    get room() { const t = this.tile; return this.world.roomAtTile(t.x, t.y); }
    get stateLabel() { return STATE_LABEL[this.state] || this.state; }
    get stateIcon() { return STATE_ICON[this.state] || '•'; }
    get busy() { return !!this.task; }

    say(text, dur = 3.2) {
      this.bubble = { text, t: dur, max: dur };
      this.bus.emit(EV.AGENT_SPEAK, { agent: this, text });
    }

    setState(s, dur = 0) {
      if (this.state !== s) {
        this.prevState = this.state;
        this.state = s;
        this.bus.emit(EV.AGENT_STATE, { agent: this, state: s });
      }
      this.stateT = 0;
      this.stateDur = dur;
    }

    teleportTo(tx, ty) {
      const c = this.world.center(tx, ty);
      this.x = c.x; this.y = c.y;
      this.path = null; this.after = null;
    }

    releaseSpot() {
      if (this.targetSpot) { this.world.release(this.targetSpot, this.id); this.targetSpot = null; }
    }

    /* ---------- Movimiento ---------- */
    goToTile(tx, ty, after = 'idle', afterDur = 0) {
      const t = this.tile;
      const path = this.world.findPath(t.x, t.y, tx, ty);
      if (!path) { this.setState('idle'); this.idleTimer = 1 + this.rng(); return false; }
      this.path = path; this.pathIdx = 0;
      this.after = after; this.afterDur = afterDur;
      this.setState('walk');
      return true;
    }

    goToSpot(spot, after, dur) {
      if (!spot) return false;
      this.releaseSpot();
      if (!this.world.reserve(spot, this.id)) return false;
      this.targetSpot = spot;
      const ok = this.goToTile(spot.tx, spot.ty, after, dur);
      if (!ok) this.releaseSpot();
      return ok;
    }

    _moveAlongPath(dt) {
      if (!this.path || this.pathIdx >= this.path.length) { this._arrive(); return; }
      const T = this.world.TILE;
      const node = this.path[this.pathIdx];
      const cx = node.x * T + T / 2, cy = node.y * T + T / 2;
      const dx = cx - this.x, dy = cy - this.y;
      const d = Math.hypot(dx, dy);
      const sp = BASE_SPEED * this.speedMul * (this.isBoss ? 0.9 : 1);
      const step = sp * dt;
      if (d <= step) {
        this.x = cx; this.y = cy;
        this.pathIdx++;
        this.stats.steps++;
        if (this.pathIdx >= this.path.length) this._arrive();
      } else {
        this.x += (dx / d) * step;
        this.y += (dy / d) * step;
        this.facing = U.dirFromDelta(dx, dy);
      }
    }

    _arrive() {
      this.path = null;
      const spot = this.targetSpot;
      if (spot) this.facing = spot.facing || this.facing;
      const after = this.after || 'idle';
      this.after = null;
      if (after === 'work') this._beginWork();
      else {
        this.setState(after, this.afterDur);
        this._onActivityStart(after);
      }
    }

    _onActivityStart(state) {
      const r = this.rng;
      switch (state) {
        case 'coffee': this.stats.coffees++; if (r() < .6) this.say(U.choice(r, N.coffeeTalk)); break;
        case 'game': this.stats.games++; if (r() < .5) this.say(U.choice(r, N.gameTalk)); break;
        case 'dance': if (r() < .7) this.say(U.choice(r, N.danceTalk)); break;
        case 'eat': this.stats.meals++; if (r() < .6) this.say(U.choice(r, N.eatTalk)); break;
        case 'sleep': this.stats.naps++; if (r() < .5) this.say(U.choice(r, N.sleepTalk)); break;
        case 'phone': if (r() < .8) this.say(U.choice(r, N.phoneTalk)); break;
        case 'talk': if (r() < .8) this.say(U.choice(r, N.smallTalk)); break;
        case 'idle': if (r() < .12) this.say(U.choice(r, N.smallTalk)); break;
      }
    }

    /* ---------- Tareas ---------- */
    assignTask(task) {
      this.task = task;
      this.taskStep = 0;
      this.retries = 0;
      task.agentId = this.id;
      task.agentName = this.name;
      task.status = 'walking';
      this.releaseSpot();
      this.say(U.choice(this.rng, ['Voy para allá', 'Ahí voy, jefe', 'Va, me pongo', 'Enterado ✓']), 2.6);
      const desk = this._findDesk();
      if (desk) this.goToSpot(desk, 'work');
      else { this.setState('work', 0); this._beginWork(); }
      this.bus.emit(EV.TASK_ASSIGNED, { task, agent: this });
    }

    _findDesk() {
      const room = this.world.rooms[this.homeRoomIndex];
      if (!room) return null;
      if (this.isBoss) return this.world.findSpot('boss', { room }) || this.world.findSpot('meet', { room });
      return this.world.findSpot('desk', { room }) || this.world.findSpot('idle', { room });
    }

    _beginWork() {
      const t = this.task;
      this.setState('work', t ? t.duration : 10);
      if (t) {
        t.status = 'working';
        t.startedAt = Date.now();
        this.say(U.choice(this.rng, N.workTalk), 3);
        this.bus.emit(EV.TASK_PROGRESS, { task: t, progress: 0 });
      }
    }

    _updateWork(dt) {
      const t = this.task;
      if (!t) { this.setState('idle'); return; }
      const total = t.duration;
      t.progress = U.clamp(t.progress + dt / total, 0, 1);
      const stepCount = t.steps.length;
      const step = Math.min(stepCount - 1, Math.floor(t.progress * stepCount));
      if (step !== this.taskStep) {
        this.taskStep = step;
        t.currentStep = step;
        this.bus.emit(EV.TASK_STEP, { task: t, step, label: t.steps[step] });
      }
      this.bus.emit(EV.TASK_PROGRESS, { task: t, progress: t.progress });
      this.needs.energy = U.clamp(this.needs.energy - dt * 0.012, 0, 1);

      if (t.progress >= 1) {
        const failChance = this.retries > 0 ? 0 : 0.09;
        if (this.rng() < failChance) {
          this.retries++;
          t.progress = 0.55;
          t.status = 'retry';
          this.setState('error', 3);
          this.say(U.choice(this.rng, N.errorTalk), 3);
          this.stats.failed++;
          this.bus.emit(EV.TASK_FAILED, { task: t, agent: this, retry: true });
        } else {
          t.status = 'done';
          t.finishedAt = Date.now();
          t.progress = 1;
          this.stats.done++;
          this.setState('success', 3.2);
          this.say(U.choice(this.rng, N.successTalk), 3.2);
          this.needs.fun = U.clamp(this.needs.fun + 0.1, 0, 1);
          this.bus.emit(EV.TASK_DONE, { task: t, agent: this });
          this.task = null;
        }
      }
    }

    /* ---------- Comportamiento autónomo ---------- */
    _chooseActivity() {
      const w = this.world, n = this.needs, r = this.rng;
      const cafe = w.roomByKind('cafeteria');
      const brk = w.roomByKind('break');
      const game = w.roomByKind('game');
      const home = w.rooms[this.homeRoomIndex];

      // El jefe casi no sale de su oficina (pero es humano… bueno, es ajo)
      if (this.isBoss) {
        const opts = [['boss', 3.4], ['phone', 2.2], ['wander', 2.0], ['sitCeo', 1.4]];
        if (brk) opts.push(['coffee', 0.8 + (1 - n.energy)]);
        if (cafe) opts.push(['eat', n.hunger * 1.6]);
        if (game) opts.push(['game', n.fun < 0.3 ? 0.8 : 0.1]);
        const k = U.weighted(r, opts);
        const d = (a, b) => U.randRange(r, a, b);
        switch (k) {
          case 'boss': this._tryGo('boss', home, 'sit', d(12, 26)); return;
          case 'phone': this._tryGo('boss', home, 'phone', d(8, 16)); return;
          case 'sitCeo': this._tryGo('sit', home, 'sit', d(10, 20)); return;
          case 'coffee': this._tryGo('coffee', brk, 'coffee', d(6, 10)); return;
          case 'eat': this._tryGo('eat', cafe, 'eat', d(10, 16)); return;
          case 'game': this._tryGo('game', game, 'game', d(8, 14)); return;
          default: this._wander(home); return;
        }
      }

      const options = [];
      if (cafe) options.push(['eat', Math.pow(n.hunger, 2) * 6 + 0.15]);
      if (brk) {
        options.push(['coffee', (1 - n.energy) * 3.2 + 0.25]);
        options.push(['sleep', n.energy < 0.3 ? 3.5 : 0.08]);
        options.push(['talk', (1 - n.social) * 3 + 0.2]);
        options.push(['sit', 0.6 + (1 - n.energy)]);
      }
      if (game) {
        options.push(['game', (1 - n.fun) * 3.2 + 0.2]);
        options.push(['dance', (1 - n.fun) * 1.4 + 0.08]);
      }
      if (home) {
        options.push(['deskidle', 0.9]);
        options.push(['phone', 0.45]);
        options.push(['wander', 1.5]);
      }
      if (!options.length) { this.idleTimer = 3; return; }

      const kind = U.weighted(r, options);
      const dur = (a, b) => U.randRange(r, a, b);

      switch (kind) {
        case 'eat': this._tryGo('eat', cafe, 'eat', dur(12, 22)); break;
        case 'coffee': this._tryGo('coffee', brk, 'coffee', dur(7, 12)); break;
        case 'sleep': this._tryGo('sleep', brk, 'sleep', dur(18, 34)); break;
        case 'talk': this._tryGo('talk', brk, 'talk', dur(9, 16)); break;
        case 'sit': this._tryGo('sit', brk, 'sit', dur(10, 20)); break;
        case 'game': this._tryGo('game', game, 'game', dur(14, 26)); break;
        case 'dance': this._tryGo('dance', game, 'dance', dur(10, 20)); break;
        case 'deskidle': this._tryGo('desk', home, 'sit', dur(10, 22)); break;
        case 'phone': this._tryGo('phone', home, 'phone', dur(8, 15)); break;
        default: this._wander(home); break;
      }
    }

    _tryGo(spotType, room, state, dur) {
      if (!room) { this._wander(); return; }
      const t = this.tile;
      const spot = this.world.findSpot(spotType, { room, from: t });
      if (spot && this.goToSpot(spot, state, dur)) return;
      this._wander(room);
    }

    _wander(room) {
      const w = this.world;
      const target = room || w.rooms[this.homeRoomIndex] || w.rooms[0];
      if (!target) { this.idleTimer = 2; return; }
      const t = w.randomTileIn(target, this.rng);
      if (t) this.goToTile(t.x, t.y, 'idle', U.randRange(this.rng, 2, 6));
      else this.idleTimer = 2;
    }

    goHome() {
      const home = this.world.rooms[this.homeRoomIndex];
      if (!home) return;
      const desk = this.world.findSpot(this.isBoss ? 'boss' : 'desk', { room: home });
      if (desk) this.goToSpot(desk, 'sit', 20);
      else this._wander(home);
    }

    goTo(kindOrRoom, state, dur) {
      const room = typeof kindOrRoom === 'string' ? this.world.roomByKind(kindOrRoom) : kindOrRoom;
      if (!room) return false;
      const spotType = { eat: 'eat', coffee: 'coffee', game: 'game', dance: 'dance', sleep: 'sleep', talk: 'talk', sit: 'sit' }[state] || 'idle';
      const spot = this.world.findSpot(spotType, { room, from: this.tile }) || this.world.findSpot('idle', { room });
      if (spot) return this.goToSpot(spot, state, dur || 15);
      this._wander(room);
      return true;
    }

    /* ---------- Update ---------- */
    update(dt) {
      this.animT += dt;
      if (this.bubble) { this.bubble.t -= dt; if (this.bubble.t <= 0) this.bubble = null; }

      // necesidades
      const n = this.needs;
      const working = this.state === 'work';
      n.hunger = U.clamp(n.hunger + dt * 0.0085, 0, 1);
      n.fun = U.clamp(n.fun - dt * (working ? 0.010 : 0.0060), 0, 1);
      n.social = U.clamp(n.social - dt * 0.0055, 0, 1);
      if (!['sleep', 'coffee', 'sit', 'eat'].includes(this.state)) {
        n.energy = U.clamp(n.energy - dt * 0.0045, 0, 1);
      }
      this.mood = (n.energy < .25 || n.hunger > .8) ? 'cansado' : (n.fun > .7 && n.energy > .6) ? 'feliz' : 'ok';

      const roomIdx = this.world.roomIndexAt(this.tile.x, this.tile.y);
      if (roomIdx !== this.lastRoomIndex) this.lastRoomIndex = roomIdx;

      if (this.frozen) return;

      this.stateT += dt;
      switch (this.state) {
        case 'walk': this._moveAlongPath(dt); break;
        case 'work': this._updateWork(dt); break;
        case 'error':
          if (this.stateT >= this.stateDur) {
            if (this.task) { this.task.status = 'working'; this.setState('work', this.task.duration); }
            else this._endActivity();
          }
          break;
        case 'success':
          if (this.stateT >= this.stateDur) this._endActivity();
          break;
        case 'coffee': this.needs.energy = U.clamp(this.needs.energy + dt * 0.075, 0, 1); this._tickActivity(dt); break;
        case 'sleep': this.needs.energy = U.clamp(this.needs.energy + dt * 0.045, 0, 1); this._tickActivity(dt); break;
        case 'eat': this.needs.hunger = U.clamp(this.needs.hunger - dt * 0.075, 0, 1); this._tickActivity(dt); break;
        case 'game': this.needs.fun = U.clamp(this.needs.fun + dt * 0.055, 0, 1); this._tickActivity(dt); break;
        case 'dance': this.needs.fun = U.clamp(this.needs.fun + dt * 0.07, 0, 1); this.needs.energy = U.clamp(this.needs.energy - dt * 0.01, 0, 1); this._tickActivity(dt); break;
        case 'talk': this.needs.social = U.clamp(this.needs.social + dt * 0.07, 0, 1); this._tickActivity(dt); break;
        case 'phone': this.needs.social = U.clamp(this.needs.social + dt * 0.03, 0, 1); this._tickActivity(dt); break;
        case 'sit': this.needs.energy = U.clamp(this.needs.energy + dt * 0.012, 0, 1); this._tickActivity(dt); break;
        case 'idle':
          this.idleTimer -= dt;
          if (this.idleTimer <= 0) { this.idleTimer = U.randRange(this.rng, 1.5, 5); this._chooseActivity(); }
          break;
        default: this._tickActivity(dt); break;
      }

      // chismecito: platicar con quien esté cerca
      if (this.state === 'talk' && this.rng() < dt * 0.35) {
        this.say(U.choice(this.rng, N.smallTalk), 3);
      }
    }

    _tickActivity(dt) {
      if (this.stateDur > 0 && this.stateT >= this.stateDur) this._endActivity();
    }

    _endActivity() {
      this.releaseSpot();
      this.setState('idle');
      this.idleTimer = U.randRange(this.rng, 1, 4);
    }
  }

  /* ============================================================ */
  class AgentEngine {
    constructor(bus, world) {
      this.bus = bus;
      this.world = world;
      this.agents = [];
      this.byId = new Map();
      this.bySkill = new Map();
      this.boss = null;
      this.meeting = null;
      this.selectedId = null;
    }

    get count() { return this.agents.length; }

    spawnBoss() {
      if (this.boss) return this.boss;
      const a = new Agent({
        id: 'don-ajo', isBoss: true, name: 'Don Ajo', fullName: 'Don Ajo Ajolote',
        title: 'CEO & Fundador', color: '#f5d76e',
        look: { kind: 'garlic', skin: '#f7f2e0', hair: '#7bd67b', shirt: '#1b1b26', pants: '#12121a', accent: '#e63946' },
        traits: ['jefe', 'sazonado'], catchphrase: 'El que no ajo, no gana.', speedMul: 0.95
      }, { world: this.world, bus: this.bus, engine: this });
      this.agents.push(a); this.byId.set(a.id, a);
      this.boss = a;
      this._home(a);
      this.bus.emit(EV.AGENT_SPAWNED, { agent: a });
      return a;
    }

    spawnFromSkill(skill) {
      if (this.bySkill.has(skill.id)) return this.bySkill.get(skill.id);
      const ag = skill.agent;
      const a = new Agent({
        id: 'agent_' + skill.id,
        skillId: skill.id,
        name: ag.nick,
        fullName: ag.fullName || (ag.nick + ' ' + ag.lastName),
        title: ag.title,
        color: skill.color,
        look: {
          kind: 'human', skin: ag.skin, hair: ag.hair, hairStyle: ag.hairStyle,
          shirt: ag.shirt, pants: ag.pants, accent: skill.color
        },
        traits: ag.traits, catchphrase: ag.catchphrase, speedMul: ag.speed || 1
      }, { world: this.world, bus: this.bus, engine: this });
      this.agents.push(a);
      this.byId.set(a.id, a);
      this.bySkill.set(skill.id, a);
      this._home(a);
      this.bus.emit(EV.AGENT_SPAWNED, { agent: a, skill });
      return a;
    }

    _home(a) {
      const room = a.isBoss ? this.world.roomByKind('ceo') : this.world.roomBySkill(a.skillId);
      if (!room) return;
      a.homeRoomIndex = room.index;
      const spot = this.world.findSpot(a.isBoss ? 'boss' : 'desk', { room });
      const t = spot ? { x: spot.tx, y: spot.ty } : this.world.randomTileIn(room, a.rng);
      if (t) a.teleportTo(t.x, t.y);
      a.facing = spot ? spot.facing : 'down';
    }

    /** Re-ubica a todos tras una remodelación del edificio */
    rehomeAll() {
      for (const a of this.agents) {
        this.world.releaseAllFor(a.id);
        a.targetSpot = null; a.path = null; a.after = null;
        const room = a.isBoss ? this.world.roomByKind('ceo') : this.world.roomBySkill(a.skillId);
        if (!room) continue;
        a.homeRoomIndex = room.index;
        const t = this.world.randomTileIn(room, a.rng);
        if (t) a.teleportTo(t.x, t.y);
        a.setState('idle');
        a.idleTimer = 0.5 + a.rng() * 2;
        if (a.task) {                      // retoma su pendiente en la nueva oficina
          const desk = a._findDesk();
          if (desk) a.goToSpot(desk, 'work');
          else a._beginWork();
        }
      }
    }

    get(id) { return this.byId.get(id); }
    forSkill(skillId) { return this.bySkill.get(skillId); }
    get workers() { return this.agents.filter(a => !a.isBoss); }
    freeWorkers() { return this.workers.filter(a => !a.task); }

    select(id) {
      this.selectedId = id;
      this.bus.emit(EV.AGENT_SELECTED, { agent: this.byId.get(id) || null });
    }
    get selected() { return this.selectedId ? this.byId.get(this.selectedId) : null; }

    nearestAgent(px, py, maxDist = 24) {
      let best = null, bd = maxDist * maxDist;
      for (const a of this.agents) {
        const d = U.dist2(a.x, a.y - 8, px, py);
        if (d < bd) { bd = d; best = a; }
      }
      return best;
    }

    /* ---- Órdenes globales ---- */
    startMeeting(duration = 22) {
      const ceo = this.world.roomByKind('ceo');
      if (!ceo || this.meeting) return false;
      this.meeting = { phase: 'gather', t: 0, duration, maxGather: 75, room: ceo };
      for (const a of this.agents) {
        if (a.isBoss) { a.say(U.choice(a.rng, N.donAjo.meeting), 4); continue; }
        a.releaseSpot();
        const spot = this.world.findSpot('meet', { room: ceo, from: a.tile });
        if (spot) a.goToSpot(spot, 'talk', 9999);
        else {
          const t = this.world.randomTileIn(ceo, a.rng);
          if (t) a.goToTile(t.x, t.y, 'talk', 9999);
        }
      }
      this.bus.emit(EV.MEETING_START, { duration });
      return true;
    }

    _inRoom(a, room) {
      const t = a.tile;
      return t.x >= room.x && t.x < room.x + room.w && t.y >= room.y && t.y < room.y + room.h;
    }

    endMeeting() {
      if (!this.meeting) return;
      this.meeting = null;
      for (const a of this.agents) {
        if (a.isBoss) continue;
        a.releaseSpot();
        a.setState('idle');
        a.idleTimer = 0.3 + a.rng() * 2.5;
        a.needs.social = U.clamp(a.needs.social + 0.4, 0, 1);
      }
      this.bus.emit(EV.MEETING_END, {});
    }

    allTo(kind, state, dur) {
      for (const a of this.workers) {
        if (a.task) continue;
        a.releaseSpot();
        a.goTo(kind, state, dur);
      }
    }

    allToDesks() {
      for (const a of this.workers) {
        if (a.task) continue;
        a.releaseSpot();
        a.goHome();
      }
    }

    update(dt) {
      if (this.meeting) {
        const m = this.meeting;
        m.t += dt;
        if (m.phase === 'gather') {
          const workers = this.workers;
          const arrived = workers.filter(a => this._inRoom(a, m.room)).length;
          if (workers.length === 0 || arrived >= Math.ceil(workers.length * 0.75) || m.t >= m.maxGather) {
            m.phase = 'talk'; m.t = 0;
            const boss = this.boss;
            if (boss) {
              boss.setState('talk', m.duration);
              boss.say('Ya que están todos: seguimos con la meta del mes. 🧄', 5);
            }
          }
        } else if (m.t >= m.duration) {
          if (this.boss) this.boss.setState('idle');
          this.endMeeting();
        }
      }
      for (let i = 0; i < this.agents.length; i++) this.agents[i].update(dt);
    }

    snapshot() {
      return this.agents.map(a => ({
        id: a.id, skillId: a.skillId, stats: a.stats, needs: a.needs
      }));
    }
    restore(list) {
      if (!Array.isArray(list)) return;
      for (const s of list) {
        const a = this.byId.get(s.id);
        if (a) { Object.assign(a.stats, s.stats || {}); Object.assign(a.needs, s.needs || {}); }
      }
    }
  }

  NAW.Agent = Agent;
  NAW.AgentEngine = AgentEngine;
  NAW.STATES = STATES;
  NAW.STATE_LABEL = STATE_LABEL;
  NAW.STATE_ICON = STATE_ICON;
})(window);

   NETWORK AGENTS WORLD — Task Engine

(function (global) {

  class TaskEngine {
