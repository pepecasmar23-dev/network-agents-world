<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NETWORK AGENTS WORLD — Tus Claude Skills como empleados godín</title>
<meta name="description" content="Oficina pixel-art donde cada Claude Skill es un empleado virtual dirigido por Don Ajo.">
<style>
/* ============================================================
   NETWORK AGENTS WORLD — Estilos (retro corporativo pixel)
   ============================================================ */
:root{
  --bg:#070910;
  --panel:rgba(13,17,30,.93);
  --panel-solid:#0d111e;
  --line:#28324f;
  --line-soft:#1b2237;
  --text:#e8ecf7;
  --muted:#8d99b8;
  --gold:#ffd166;
  --mint:#7ee2a8;
  --sky:#4cc9f0;
  --pink:#ff477e;
  --purple:#c77dff;
  --danger:#ff5a5f;
  --font:ui-monospace,"SFMono-Regular","Cascadia Mono","Courier New",monospace;
  --shadow:0 6px 0 rgba(0,0,0,.35), 0 0 0 2px #05070d;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:12px;line-height:1.45;-webkit-font-smoothing:none;
  user-select:none;-webkit-user-select:none;
}
#app{position:fixed;inset:0;overflow:hidden}
canvas#world{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;image-rendering:pixelated}
canvas#world.dragging{cursor:grabbing}
.hidden{display:none !important}

/* ---------- Scrollbars ---------- */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#0a0e18}
::-webkit-scrollbar-thumb{background:#2a3350;border:1px solid #0a0e18}
::-webkit-scrollbar-thumb:hover{background:#3a4670}

/* ---------- Panels ---------- */
.panel{
  background:var(--panel);
  border:2px solid var(--line);
  box-shadow:var(--shadow);
  backdrop-filter:blur(3px);
  display:flex;flex-direction:column;min-height:0;
  position:relative;
}
.panel::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  border:1px solid rgba(255,255,255,.04);
}
.panel-head{
  display:flex;align-items:center;gap:8px;
  padding:7px 10px;font-size:10px;letter-spacing:1.5px;font-weight:700;
  background:linear-gradient(180deg,#1a2238 0%,#141a2c 100%);
  border-bottom:2px solid var(--line);color:#c3cee8;flex:0 0 auto;
}
.panel-head .head-right{margin-left:auto;color:var(--muted);font-weight:400;letter-spacing:.5px}
.panel-head .head-right b{color:var(--gold)}
.panel-body{overflow-y:auto;overflow-x:hidden;padding:8px;flex:1 1 auto;min-height:0}

/* ---------- Topbar ---------- */
#topbar{
  position:absolute;top:0;left:0;right:0;height:46px;z-index:30;
  display:flex;align-items:center;gap:12px;padding:0 10px;
  background:linear-gradient(180deg,rgba(8,11,20,.97),rgba(8,11,20,.82));
  border-bottom:2px solid var(--line);
}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:2px;white-space:nowrap}
.brand .logo{font-size:20px;filter:drop-shadow(0 0 6px rgba(255,209,102,.45))}
.brand b{color:var(--gold)}
.brand-text{text-shadow:2px 2px 0 #000}
.chips{display:flex;gap:6px;flex:1 1 auto;overflow:hidden}
.chip{
  display:flex;align-items:center;gap:5px;padding:3px 8px;font-size:11px;
  background:#111726;border:1px solid var(--line-soft);color:#cfd8ee;
}
.chip i{font-style:normal;opacity:.85}
.chip span{color:var(--gold);font-weight:700}
.chip.clock span{color:var(--sky)}
.tools{display:flex;align-items:center;gap:5px}
.tools .sep{width:1px;height:20px;background:var(--line);margin:0 3px}

/* ---------- Botones ---------- */
.btn{
  font-family:var(--font);font-size:10px;font-weight:700;letter-spacing:1px;
  color:#d7e0f5;background:#1b2337;border:2px solid #2f3b5e;
  padding:5px 9px;cursor:pointer;box-shadow:0 3px 0 #0a0e18;
  transition:transform .05s ease, background .12s ease;
}
.btn:hover{background:#26314f;color:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 #0a0e18}
.btn.icon{padding:5px 8px;min-width:30px}
.btn.primary{background:var(--gold);color:#20180a;border-color:#b8933f;box-shadow:0 3px 0 #6b5320}
.btn.primary:hover{background:#ffdd8c}
.btn.danger{color:#ffb3b5;border-color:#63313a}
.btn.danger:hover{background:#3a1a1f}
.btn.mini{padding:3px 6px;font-size:9px;box-shadow:0 2px 0 #0a0e18}
.btn.active{background:var(--sky);color:#04202b;border-color:#2b7f9e}

/* ---------- Columnas ---------- */
#leftcol{position:absolute;left:10px;top:56px;bottom:10px;width:336px;z-index:20;display:flex;flex-direction:column;gap:8px}
#rightcol{position:absolute;right:10px;top:56px;bottom:10px;width:306px;z-index:20;display:flex;flex-direction:column;gap:8px}
#rosterPanel{flex:1 1 auto;min-height:120px}
#chatPanel{flex:0 0 auto;height:46%;min-height:250px}
#sidePanel{flex:1 1 auto;min-height:160px}
.ui-hidden #leftcol,.ui-hidden #rightcol,.ui-hidden #agentCard,.ui-hidden #topbar .chips,.ui-hidden #mobileBar{display:none}

/* ---------- Roster ---------- */
.agent-row{
  display:flex;gap:8px;align-items:center;padding:6px;margin-bottom:5px;
  background:#121828;border:1px solid var(--line-soft);cursor:pointer;position:relative;
  transition:background .12s;
}
.agent-row:hover{background:#1a2237;border-color:#33405f}
.agent-row.sel{background:#1e2a45;border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(255,209,102,.25)}
.agent-row .por{width:26px;height:32px;flex:0 0 auto;image-rendering:pixelated;background:#0b0f1a;border:1px solid #222c46}
.agent-row .info{flex:1 1 auto;min-width:0}
.agent-row .nm{font-weight:700;font-size:11px;display:flex;align-items:center;gap:5px}
.agent-row .nm .dot{width:7px;height:7px;display:inline-block;border-radius:0}
.agent-row .ti{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-row .st{font-size:9.5px;color:#b9c6e4;display:flex;align-items:center;gap:4px}
.agent-row .st .ic{opacity:.9}
.agent-row .bars{display:flex;flex-direction:column;gap:2px;width:34px;flex:0 0 auto}
.bar{height:3px;background:#222b44;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);transition:width .3s linear}
.bar.energy i{background:#ffd166}.bar.fun i{background:#c77dff}
.bar.social i{background:#4cc9f0}.bar.hunger i{background:#ff8fab}
.agent-row .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--mint);transition:width .2s linear}

/* ---------- Chat ---------- */
.panel-head.ajo{gap:8px;align-items:center}
#ajoPortrait{image-rendering:pixelated;background:#0a0f1c;border:1px solid #2b3552}
.ajo-name{display:flex;flex-direction:column;line-height:1.2;letter-spacing:1px}
.ajo-name em{font-style:normal;font-size:8.5px;color:var(--muted);letter-spacing:.5px}
.online{color:var(--mint) !important;font-size:9px;animation:blink 2.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
.chat-log{display:flex;flex-direction:column;gap:7px;font-size:11px}
.msg{max-width:92%;padding:6px 8px;border:1px solid var(--line-soft);white-space:pre-wrap;word-break:break-word;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}
.msg.ajo{background:#181f33;border-left:3px solid var(--gold);align-self:flex-start}
.msg.user{background:#1c2b44;border-right:3px solid var(--sky);align-self:flex-end;text-align:right}
.msg.agent{background:#152420;border-left:3px solid var(--mint);align-self:flex-start}
.msg.sys{background:#241a2c;border-left:3px solid var(--purple);align-self:center;font-size:10px;color:#d8c8f0;text-align:center}
.msg .who{display:block;font-size:9px;letter-spacing:1px;color:var(--muted);margin-bottom:2px}
.msg.user .who{color:#7fb8dd}
.quick-chips{display:flex;gap:4px;padding:5px 6px;flex-wrap:wrap;border-top:1px solid var(--line-soft);flex:0 0 auto}
.qchip{
  font-family:var(--font);font-size:9px;padding:3px 6px;cursor:pointer;
  background:#161d2f;color:#b9c6e4;border:1px solid #29334f;
}
.qchip:hover{background:#222c46;color:#fff;border-color:var(--gold)}
.chat-form{display:flex;gap:5px;padding:6px;border-top:2px solid var(--line);flex:0 0 auto}
.chat-form input{
  flex:1 1 auto;min-width:0;font-family:var(--font);font-size:11px;color:#eaf0ff;
  background:#0a0e18;border:2px solid #2a3350;padding:6px 8px;outline:none;
}
.chat-form input:focus{border-color:var(--gold)}

/* ---------- Minimapa ---------- */
.minimap-wrap{flex:0 0 auto;padding:0}
.panel-head.mini{padding:5px 8px;font-size:9px}
#minimap{width:100%;height:auto;display:block;image-rendering:pixelated;cursor:crosshair;background:#0a0d18}

/* ---------- Tabs ---------- */
.tabs{display:flex;flex:0 0 auto;border-bottom:2px solid var(--line)}
.tab{
  flex:1;font-family:var(--font);font-size:9px;letter-spacing:1px;font-weight:700;
  background:#111726;color:var(--muted);border:none;border-right:1px solid var(--line-soft);
  padding:8px 2px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;
}
.tab b{background:#232c45;color:#cfe0ff;padding:0 4px;font-size:9px}
.tab.active{background:#1c2540;color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
.tab:hover{color:#fff}

/* ---------- Task cards ---------- */
.task{background:#121828;border:1px solid var(--line-soft);border-left:3px solid var(--sky);padding:6px 7px;margin-bottom:6px}
.task .tt{font-size:10.5px;font-weight:700;display:flex;gap:5px;align-items:flex-start}
.task .meta{font-size:9px;color:var(--muted);display:flex;justify-content:space-between;margin-top:3px;gap:6px}
.task .step{font-size:9px;color:var(--sky);margin-top:2px}
.task .pbar{height:5px;background:#202940;margin-top:5px;position:relative;overflow:hidden}
.task .pbar i{display:block;height:100%;background:linear-gradient(90deg,#4cc9f0,#7ee2a8);transition:width .25s linear}
.task.done{border-left-color:var(--mint);opacity:.85}
.task.queued{border-left-color:var(--gold)}
.task.error{border-left-color:var(--danger)}
.task .x{margin-left:auto;cursor:pointer;color:#66739a}
.task .x:hover{color:var(--danger)}

/* ---------- Inbox ---------- */
.dlv{background:#101725;border:1px solid var(--line-soft);margin-bottom:6px}
.dlv .h{display:flex;align-items:center;gap:6px;padding:6px 7px;cursor:pointer;font-size:10.5px;font-weight:700}
.dlv .h .dot{width:8px;height:8px;flex:0 0 auto}
.dlv .h .ag{margin-left:auto;font-weight:400;font-size:9px;color:var(--muted)}
.dlv .b{display:none;padding:7px;border-top:1px solid var(--line-soft);white-space:pre-wrap;font-size:10px;color:#cfd9f0;background:#0b1120;user-select:text}
.dlv.open .b{display:block}
.dlv .acts{display:flex;gap:5px;padding:5px 7px;border-top:1px solid var(--line-soft)}

/* ---------- Skills ---------- */
.skill{background:#121828;border:1px solid var(--line-soft);padding:6px 7px;margin-bottom:6px;position:relative}
.skill .h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700}
.skill .h .dot{width:9px;height:9px}
.skill .d{font-size:9.5px;color:var(--muted);margin-top:3px}
.skill .kw{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.skill .kw span{font-size:8.5px;background:#1a2135;border:1px solid #263049;padding:1px 4px;color:#9fb0d4}
.skill .who{font-size:9.5px;margin-top:4px;color:#c9d5f0}
.skill-actions{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}

/* ---------- Ficha de empleado ---------- */
#agentCard{
  position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:25;
  width:min(560px,calc(100vw - 700px));min-width:340px;
}
#agentCard .card-body{display:flex;gap:10px;padding:9px}
#agentCard canvas{image-rendering:pixelated;background:#0b101c;border:1px solid #26304c;flex:0 0 auto}
#agentCard .col{flex:1 1 auto;min-width:0}
#agentCard .nm{font-size:14px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:7px}
#agentCard .ti{font-size:10px;color:var(--muted)}
#agentCard .phrase{font-size:10px;color:#a8bde0;font-style:italic;margin-top:3px}
#agentCard .needs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}
#agentCard .need{font-size:8.5px;color:var(--muted)}
#agentCard .stats-row{display:flex;gap:10px;font-size:9.5px;color:#9fb0d4;margin-top:6px;flex-wrap:wrap}
#agentCard .acts{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.state-chip{font-size:9px;padding:1px 6px;background:#1d2740;border:1px solid #2d3a5c;color:#cfe0ff}
.tag{font-size:8.5px;padding:1px 5px;background:#1a2135;border:1px solid #263049;color:#9fb0d4}

/* ---------- Toasts ---------- */
#toasts{position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{
  background:#131a2c;border:2px solid var(--line);border-left:4px solid var(--gold);
  padding:7px 12px;font-size:11px;box-shadow:var(--shadow);animation:slidein .25s ease-out;
  max-width:min(520px,90vw);
}
.toast.ok{border-left-color:var(--mint)}
.toast.warn{border-left-color:var(--danger)}
.toast.info{border-left-color:var(--sky)}
.toast.new{border-left-color:var(--purple)}
.toast b{color:var(--gold)}
@keyframes slidein{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.toast.out{animation:fadeout .4s forwards}
@keyframes fadeout{to{opacity:0;transform:translateY(-10px)}}

/* ---------- Hint ---------- */
.world-hint{
  position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:5;
  font-size:10px;color:#7c89ab;background:rgba(8,11,20,.6);padding:4px 10px;border:1px solid var(--line-soft);
  pointer-events:none;transition:opacity .6s;
}
.world-hint.gone{opacity:0}

/* ---------- Barra móvil ---------- */
#mobileBar{display:none;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);gap:6px;z-index:40}
#mobileBar .btn{font-size:16px;padding:8px 14px}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  #leftcol{width:300px}
  #rightcol{width:270px}
  #agentCard{width:min(480px,calc(100vw - 620px))}
}
@media (max-width:940px){
  #leftcol,#rightcol{
    width:min(340px,86vw);top:52px;bottom:60px;
  }
  #rightcol{right:8px}
  #leftcol.collapsed,#rightcol.collapsed{display:none}
  #agentCard{width:min(94vw,420px);bottom:60px}
  #mobileBar{display:flex}
  .brand-text{display:none}
  .chips{display:none}
  #topbar{height:42px;gap:6px}
  .tools{margin-left:auto}
  .tools .btn{padding:4px 6px;font-size:9px}
}
@media (max-width:640px){
  #btnBreak,#btnWork,#btnFit,#btnUI,.tools .sep{display:none}
  .tools .btn{padding:4px 5px;font-size:8.5px;box-shadow:0 2px 0 #0a0e18}
  .brand .logo{font-size:16px}
  #worldHint{display:none}
}

</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧄</text></svg>">
</head>
<body>
<div id="app">

  <!-- ===== MUNDO 2D ===== -->
  <canvas id="world"></canvas>
  <div id="worldHint" class="world-hint">Arrastra para moverte · Rueda para zoom · Clic en un empleado</div>

  <!-- ===== BARRA SUPERIOR ===== -->
  <header id="topbar">
    <div class="brand">
      <span class="logo">🧄</span>
      <span class="brand-text">NETWORK <b>AGENTS</b> WORLD</span>
    </div>
    <div class="chips" id="statChips">
      <div class="chip" title="Departamentos activos"><i>🏢</i><span id="statSkills">0</span></div>
      <div class="chip" title="Empleados"><i>👥</i><span id="statAgents">0</span></div>
      <div class="chip" title="Trabajando ahora"><i>⚙</i><span id="statBusy">0</span></div>
      <div class="chip" title="Pendientes en cola"><i>📋</i><span id="statQueue">0</span></div>
      <div class="chip" title="Entregados"><i>✔</i><span id="statDone">0</span></div>

    <div class="tools">
      <button class="btn" id="btnMeeting" title="Junta general en la dirección">JUNTA</button>
      <button class="btn" id="btnBreak" title="Todos a descansar">BREAK</button>
      <button class="btn" id="btnWork" title="Todos a sus escritorios">CHAMBA</button>
      <span class="sep"></span>
      <button class="btn icon" id="btnZoomOut" title="Alejar">−</button>
      <button class="btn icon" id="btnZoomIn" title="Acercar">+</button>
      <button class="btn icon" id="btnFit" title="Ver todo el edificio">⛶</button>
      <button class="btn icon" id="btnSpeed" title="Velocidad de simulación">x1</button>
      <button class="btn icon" id="btnSound" title="Sonido">🔊</button>
      <button class="btn icon" id="btnUI" title="Ocultar interfaz">👁</button>
      <button class="btn icon danger" id="btnReset" title="Reiniciar corporativo">⟲</button>
    </div>
  </header>

  <!-- ===== COLUMNA IZQUIERDA ===== -->
  <aside id="leftcol">
    <section class="panel" id="rosterPanel">
      <div class="panel-head">
        <span>PLANTILLA</span>
        <span class="head-right"><b id="rosterCount">0</b> empleados</span>
      </div>
      <div class="panel-body" id="rosterList"></div>
    </section>

    <section class="panel" id="chatPanel">
      <div class="panel-head ajo">
        <canvas id="ajoPortrait" width="34" height="40"></canvas>
        <span class="ajo-name">DON AJO <em>CEO &amp; Fundador</em></span>
        <span class="head-right online">● en línea</span>
      </div>
      <div class="panel-body chat-log" id="chatLog"></div>
      <div class="quick-chips" id="quickChips"></div>
      <form class="chat-form" id="chatForm" autocomplete="off">
        <input id="chatInput" type="text" placeholder="Dile a Don Ajo qué necesitas…" maxlength="240">
        <button class="btn primary" type="submit">ENVIAR</button>
      </form>
    </section>
  </aside>

  <!-- ===== COLUMNA DERECHA ===== -->
  <aside id="rightcol">
    <div class="minimap-wrap panel">
      <div class="panel-head mini"><span>EDIFICIO</span><span class="head-right" id="miniInfo">—</span></div>
      <canvas id="minimap" width="256" height="168"></canvas>
    </div>

    <section class="panel" id="sidePanel">
      <div class="tabs">
        <button class="tab active" data-tab="tasks">PENDIENTES<b id="tabTasksCount">0</b></button>
        <button class="tab" data-tab="inbox">ENTREGAS<b id="tabInboxCount">0</b></button>
        <button class="tab" data-tab="skills">SKILLS<b id="tabSkillsCount">0</b></button>
      </div>
      <div class="panel-body" id="tabTasks"></div>
      <div class="panel-body hidden" id="tabInbox"></div>
      <div class="panel-body hidden" id="tabSkills"></div>
    </section>
  </aside>

  <!-- ===== FICHA DE EMPLEADO ===== -->
  <section class="panel hidden" id="agentCard"></section>

  <!-- ===== TOASTS ===== -->
  <div id="toasts"></div>

  <!-- ===== BOTONES MÓVIL ===== -->
  <div id="mobileBar">
    <button class="btn" data-panel="leftcol">👥</button>
    <button class="btn" data-panel="chat">💬</button>
    <button class="btn" data-panel="rightcol">📋</button>
  </div>
</div>

<!-- ===== MOTORES ===== -->
<script>
/* ===== js/core/Utils.js ===== */
/* ============================================================
   NETWORK AGENTS WORLD — Utils
   Helpers puros: RNG determinista, math, color, texto, tiempo.
   ============================================================ */
(function (global) {
  'use strict';
  const NAW = (global.NAW = global.NAW || {});

  const Utils = {
    /* ---------- RNG ---------- */
    mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    },
    hashString(str) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    },
    rngFor(str) { return Utils.mulberry32(Utils.hashString(String(str))); },

    /* ---------- Math ---------- */
    clamp(v, a, b) { return v < a ? a : v > b ? b : v; },
    lerp(a, b, t) { return a + (b - a) * t; },
    damp(a, b, lambda, dt) { return Utils.lerp(a, b, 1 - Math.exp(-lambda * dt)); },
    dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); },
    dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; },
    randInt(rng, a, b) { return a + Math.floor(rng() * (b - a + 1)); },
    randRange(rng, a, b) { return a + rng() * (b - a); },
    choice(rng, arr) { return arr[Math.floor(rng() * arr.length) % arr.length]; },
    shuffle(rng, arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
    pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
    weighted(rng, entries) {
      // entries: [[value, weight], ...]
      let total = 0;
      for (const e of entries) total += e[1];
      let r = rng() * total;
      for (const e of entries) { r -= e[1]; if (r <= 0) return e[0]; }
      return entries[entries.length - 1][0];
    },

    /* ---------- Color ---------- */
    hexToRgb(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const n = parseInt(hex, 16);
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    },
    rgbToHex(r, g, b) {
      const c = (v) => Utils.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0');
      return '#' + c(r) + c(g) + c(b);
    },
    shade(hex, amt) {
      const { r, g, b } = Utils.hexToRgb(hex);
      if (amt >= 0) return Utils.rgbToHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
      return Utils.rgbToHex(r * (1 + amt), g * (1 + amt), b * (1 + amt));
    },
    mix(hexA, hexB, t) {
      const a = Utils.hexToRgb(hexA), b = Utils.hexToRgb(hexB);
      return Utils.rgbToHex(Utils.lerp(a.r, b.r, t), Utils.lerp(a.g, b.g, t), Utils.lerp(a.b, b.b, t));
    },
    rgba(hex, a) {
      const c = Utils.hexToRgb(hex);
      return `rgba(${c.r},${c.g},${c.b},${a})`;
    },
    hsl(h, s, l) { return `hsl(${h % 360} ${s}% ${l}%)`; },

    /* ---------- Texto ---------- */
    slug(s) {
      return Utils.deaccent(String(s)).toLowerCase()
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    },
    deaccent(s) {
      return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    },
    norm(s) { return Utils.deaccent(String(s)).toLowerCase().trim(); },
    titleCase(s) {
      return String(s).split(/\s+/).map(w => w ? w[0].toUpperCase() + w.slice(1) : w).join(' ');
    },
    truncate(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; },
    escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    },

    /* ---------- Tiempo / ids ---------- */
    uid(prefix) {
      return (prefix || 'id') + '_' + Date.now().toString(36) + '_' +
        Math.floor(Math.random() * 1e6).toString(36);
    },
    now() { return Date.now(); },
    clock(ms) {
      const d = new Date(ms);
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    },
    ago(ms) {
      const s = Math.max(0, (Date.now() - ms) / 1000);
      if (s < 60) return 'hace ' + Math.floor(s) + 's';
      if (s < 3600) return 'hace ' + Math.floor(s / 60) + 'm';
      return 'hace ' + Math.floor(s / 3600) + 'h';
    },
    fmtDur(sec) {
      sec = Math.max(0, Math.round(sec));
      const m = Math.floor(sec / 60), s = sec % 60;
      return m > 0 ? `${m}m ${s}s` : `${s}s`;
    },

    /* ---------- Storage seguro (file:// friendly) ---------- */
    store: {
      available: (function () {
        try {
          const k = '__naw_test__';
          global.localStorage.setItem(k, '1');
          global.localStorage.removeItem(k);
          return true;
        } catch (e) { return false; }
      })(),
      _mem: {},
      get(key, fallback) {
        try {
          const raw = this.available ? global.localStorage.getItem(key) : this._mem[key];
          if (raw == null) return fallback;
          return JSON.parse(raw);
        } catch (e) { return fallback; }
      },
      set(key, value) {
        try {
          const raw = JSON.stringify(value);
          if (this.available) global.localStorage.setItem(key, raw);
          else this._mem[key] = raw;
          return true;
        } catch (e) { return false; }
      },
      del(key) {
        try {
          if (this.available) global.localStorage.removeItem(key);
          else delete this._mem[key];
        } catch (e) { /* noop */ }
      }
    },

    /* ---------- Misc ---------- */
    throttle(fn, ms) {
      let last = 0, timer = null, lastArgs = null;
      return function (...args) {
        const t = Date.now();
        lastArgs = args;
        if (t - last >= ms) { last = t; fn.apply(this, args); }
        else if (!timer) {
          timer = setTimeout(() => { timer = null; last = Date.now(); fn.apply(this, lastArgs); }, ms - (t - last));
        }
      };
    },
    dirFromDelta(dx, dy) {
      if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'right' : 'left';
      return dy > 0 ? 'down' : 'up';
    }
  };

  NAW.Utils = Utils;
})(window);

/* ============================================================
   NETWORK AGENTS WORLD — Event System
   Bus pub/sub central. Todos los módulos se comunican por aquí
   para mantener bajo acoplamiento (escala a +100 agentes).
   ============================================================ */
(function (global) {
  'use strict';
  const NAW = (global.NAW = global.NAW || {});

  class EventSystem {
    constructor() {
      this._map = new Map();       // event -> Set(handler)
      this._any = new Set();       // wildcard handlers
      this.log = [];               // historial reciente (debug / feed)
      this.maxLog = 300;
      this.debug = false;
    }

    on(event, handler) {
      if (event === '*') { this._any.add(handler); return () => this.off(event, handler); }
      if (!this._map.has(event)) this._map.set(event, new Set());
      this._map.get(event).add(handler);
      return () => this.off(event, handler);
    }

    once(event, handler) {
      const wrap = (payload, ev) => { this.off(event, wrap); handler(payload, ev); };
      return this.on(event, wrap);
    }

    off(event, handler) {
      if (event === '*') { this._any.delete(handler); return; }
      const set = this._map.get(event);
      if (set) set.delete(handler);
    }

    emit(event, payload) {
      const entry = { event, payload, t: Date.now() };
      this.log.push(entry);
      if (this.log.length > this.maxLog) this.log.shift();
      if (this.debug) console.log('[evt]', event, payload);

      const set = this._map.get(event);
      if (set) for (const h of Array.from(set)) {
        try { h(payload, event); } catch (e) { console.error('Handler error @' + event, e); }
      }
      for (const h of Array.from(this._any)) {
        try { h(payload, event); } catch (e) { console.error('Wildcard handler error @' + event, e); }
      }
    }

    clear() { this._map.clear(); this._any.clear(); this.log.length = 0; }
  }

  NAW.EventSystem = EventSystem;
  NAW.Events = new EventSystem();

  // Catálogo de eventos (documentación viva)
  NAW.EV = {
    WORLD_BUILT: 'world:built',
    WORLD_REMODEL: 'world:remodel',
    SKILL_ADDED: 'skill:added',
    SKILL_DETECTED: 'skill:detected',
    SKILL_REMOVED: 'skill:removed',
    AGENT_SPAWNED: 'agent:spawned',
    AGENT_STATE: 'agent:state',
    AGENT_SPEAK: 'agent:speak',
    AGENT_SELECTED: 'agent:selected',
    TASK_CREATED: 'task:created',
    TASK_ASSIGNED: 'task:assigned',

    MEETING_START: 'meeting:start',
    MEETING_END: 'meeting:end',

  };

/* ===== js/engine/SkillRegistry.js ===== */
/* ============================================================
   NETWORK AGENTS WORLD — Skill Registry
   Fuente de verdad de las Skills instaladas. Cada Skill = un
   departamento + un empleado con identidad autogenerada.
   detectNewSkills() corre en loop y da de alta lo que aparezca.
   ============================================================ */
(function (global) {
  'use strict';
  const NAW = (global.NAW = global.NAW || {});
  const U = NAW.Utils, N = NAW.Names, EV = NAW.EV;

  const STORE_KEY = 'naw.registry.v1';
  const EXTERNAL_KEY = 'naw.external_skills';

  class SkillRegistry {
    constructor(bus) {
      this.bus = bus;
      this.skills = new Map();      // id -> skill
      this.order = [];              // ids en orden de alta
      this._usedNicks = new Set();
      this._usedColors = new Set();
      this._detectTimer = 0;
      this.detectInterval = 4;      // segundos
    }

    /* ---------- API pública ---------- */

    get list() { return this.order.map(id => this.skills.get(id)).filter(Boolean); }
    get count() { return this.order.length; }
    get(id) { return this.skills.get(id); }
    has(id) { return this.skills.has(id); }

    /**
     * Da de alta una skill. Autogenera identidad si falta.
     * @returns {object|null} skill creada, o null si ya existía
     */
    addSkill(raw, opts = {}) {
      const id = U.slug(raw.id || raw.name);
      if (!id) return null;
      if (this.skills.has(id)) return null;

      const skill = this._normalize(id, raw);
      this.skills.set(id, skill);
      this.order.push(id);
      this._usedNicks.add(U.norm(skill.agent.nick));
      this._usedColors.add(skill.color);

      this.bus.emit(EV.SKILL_ADDED, { skill, silent: !!opts.silent });
      if (!opts.silent) this.bus.emit(EV.SKILL_DETECTED, { skill });
      this.save();
      return skill;
    }

    removeSkill(id) {
      const skill = this.skills.get(id);
      if (!skill || skill.protected) return false;
      this.skills.delete(id);
      this.order = this.order.filter(x => x !== id);
      this._usedNicks.delete(U.norm(skill.agent.nick));
      this._usedColors.delete(skill.color);
      this.bus.emit(EV.SKILL_REMOVED, { skill });
      this.save();
      return true;
    }

    /**
     * Rutina de auto-descubrimiento. Revisa todas las fuentes
     * posibles de skills y da de alta las nuevas.
     * Fuentes:
     *   1. window.CLAUDE_SKILLS  (integración real)
     *   2. localStorage 'naw.external_skills'
     *   3. NAW.pendingSkills (cola en memoria / API pública)
     */
    detectNewSkills() {
      const found = [];
      const sources = [];

      if (Array.isArray(global.CLAUDE_SKILLS)) sources.push(global.CLAUDE_SKILLS);
      const ext = U.store.get(EXTERNAL_KEY, null);
      if (Array.isArray(ext)) sources.push(ext);
      if (Array.isArray(NAW.pendingSkills) && NAW.pendingSkills.length) {
        sources.push(NAW.pendingSkills.splice(0, NAW.pendingSkills.length));
      }

      for (const src of sources) {
        for (const raw of src) {
          if (!raw) continue;
          const id = U.slug(raw.id || raw.name);
          if (!id || this.skills.has(id)) continue;
          const skill = this.addSkill(raw);
          if (skill) found.push(skill);
        }
      }
      return found;
    }

    tick(dt) {
      this._detectTimer -= dt;
      if (this._detectTimer <= 0) {
        this._detectTimer = this.detectInterval;
        this.detectNewSkills();
      }
    }

    /** Ruteo: devuelve [{skill, score}] ordenado por relevancia. */
    match(text) {
      const t = ' ' + U.norm(text).replace(/[^a-z0-9áéíóúñ@ ]/g, ' ') + ' ';
      const words = t.split(/\s+/).filter(Boolean);
      const results = [];
      for (const skill of this.list) {
        let score = 0;
        // nombre de la skill
        const sname = U.norm(skill.name);
        if (t.includes(' ' + sname + ' ') || t.includes(sname)) score += 6;
        // nombre / apodo del agente (mención directa)
        const nick = U.norm(skill.agent.nick);
        if (words.includes(nick) || t.includes('@' + nick)) score += 12;
        if (t.includes(U.norm(skill.agent.lastName))) score += 4;
        // keywords
        for (const kw of skill.keywords) {
          const k = U.norm(kw);
          if (!k) continue;
          if (k.includes(' ')) { if (t.includes(k)) score += 4; }
          else if (words.includes(k)) score += 3;
          else if (k.length > 4 && t.includes(k)) score += 2;
        }
        // categoría
        if (words.includes(U.norm(skill.category))) score += 2;
        if (score > 0) results.push({ skill, score });
      }
      results.sort((a, b) => b.score - a.score);
      return results;
    }

    /* ---------- Identidad autogenerada ---------- */

    _normalize(id, raw) {
      const rng = U.rngFor('skill:' + id);
      const name = raw.name || U.titleCase(id.replace(/-/g, ' '));
      const category = raw.category && N.workSteps[raw.category] ? raw.category : this._guessCategory(raw, name);
      const color = raw.color || this._pickColor(rng);
      const a = raw.agent || {};

      const nick = a.nick || this._pickNick(rng);
      const lastName = a.lastName || U.choice(rng, N.lastNames);
      const title = a.title || this._makeTitle(rng, name, category);

      return {
        id,
        name,
        category,
        description: raw.description || `Skill ${name} operando en Network Agents World.`,
        keywords: (raw.keywords && raw.keywords.length ? raw.keywords : this._autoKeywords(name, category)).map(k => U.norm(k)),
        color,
        icon: raw.icon || this._iconFor(category),
        protected: !!raw.protected,
        installedAt: raw.installedAt || Date.now(),
        agent: {
          nick,
          lastName,
          fullName: nick + ' ' + lastName,
          title,
          skin: a.skin || U.choice(rng, N.skinTones),
          hair: a.hair || U.choice(rng, N.hairColors),
          hairStyle: a.hairStyle || U.choice(rng, N.hairStyles),
          shirt: a.shirt || U.mix(color, U.choice(rng, N.shirtColors), 0.45),
          pants: a.pants || U.choice(rng, N.pantsColors),
          traits: a.traits || U.shuffle(rng, ['ordenado', 'sociable', 'cafeinómano', 'gamer', 'nocturno', 'perfeccionista', 'chismoso', 'zen']).slice(0, 2),
          catchphrase: a.catchphrase || U.choice(rng, [
            'Aquí andamos, dándole.', 'Yo le entro a lo que caiga.',
            'Con confianza, jefe.', 'Eso lo saco en chinga.', 'Déjamelo a mí.'
          ]),
          speed: a.speed || U.randRange(rng, 0.85, 1.25),
          scale: a.scale || 1
        }
      };
    }

    _pickNick(rng) {
      const pool = N.nicks;
      for (let i = 0; i < 200; i++) {
        const cand = U.choice(rng, pool);
        if (!this._usedNicks.has(U.norm(cand))) return cand;
      }
      // fallback: sufijo numérico
      let i = 2;
      while (this._usedNicks.has(U.norm('Godín ' + i))) i++;
      return 'Godín ' + i;
    }

    _pickColor(rng) {
      const pool = N.colorPool;
      for (let i = 0; i < 200; i++) {
        const c = U.choice(rng, pool);
        if (!this._usedColors.has(c)) return c;
      }
      return U.hsl(Math.floor(rng() * 360), 70, 60);
    }

    _makeTitle(rng, name, category) {
      const pre = U.choice(rng, N.titlePrefix);
      return `${pre} ${name}`;
    }

    _guessCategory(raw, name) {
      const t = U.norm((name || '') + ' ' + (raw.description || '') + ' ' + (raw.keywords || []).join(' '));
      const table = {
        video: ['video', 'edit', 'capcut', 'clip', 'render', 'audio', 'shorts', 'film'],
        reels: ['reel', 'trial', 'ads', 'campaign', 'test', 'metric', 'growth'],
        planning: ['plan', 'calendar', 'schedule', 'community', 'agenda', 'organiz'],
        copy: ['copy', 'text', 'write', 'redac', 'email', 'guion', 'script'],
        ideas: ['idea', 'brand', 'concept', 'creativ', 'thumbnail', 'design', 'diseñ']
      };
      let best = 'generic', bestScore = 0;
      for (const [cat, words] of Object.entries(table)) {
        let s = 0;
        for (const w of words) if (t.includes(w)) s++;
        if (s > bestScore) { bestScore = s; best = cat; }
      }
      return best;
    }

    _autoKeywords(name, category) {
      const base = U.norm(name).split(/\s+/).filter(w => w.length > 2);
      const extra = {
        video: ['video', 'editar'], reels: ['reel', 'prueba'], planning: ['plan', 'calendario'],
        copy: ['copy', 'texto'], ideas: ['idea', 'concepto'], generic: []
      }[category] || [];
      return Array.from(new Set(base.concat(extra)));
    }

    _iconFor(cat) {
      return { video: 'film', reels: 'phone', planning: 'calendar', copy: 'pen', ideas: 'bulb', generic: 'gear' }[cat] || 'gear';
    }

    /* ---------- Persistencia ---------- */

    save() {
      U.store.set(STORE_KEY, {
        v: 1,
        order: this.order,
        skills: this.order.map(id => this.skills.get(id))
      });
    }

    load() {
      const data = U.store.get(STORE_KEY, null);
      if (!data || !Array.isArray(data.skills) || !data.skills.length) return false;
      for (const s of data.skills) {
        if (!s || !s.id || this.skills.has(s.id)) continue;
        this.skills.set(s.id, s);
        this.order.push(s.id);
        this._usedNicks.add(U.norm(s.agent.nick));
        this._usedColors.add(s.color);
      }
      return this.order.length > 0;
    }

    reset() {
      U.store.del(STORE_KEY);
      U.store.del(EXTERNAL_KEY);
      this.skills.clear();
      this.order = [];
      this._usedNicks.clear();
      this._usedColors.clear();
    }

    /** Registra una skill "externa" persistente (simula instalación real) */
    pushExternal(raw) {
      const ext = U.store.get(EXTERNAL_KEY, []) || [];
      ext.push(raw);
      U.store.set(EXTERNAL_KEY, ext);
    }
  }

  NAW.SkillRegistry = SkillRegistry;
})(window);

/* ===== js/engine/WorldEngine.js ===== */
/* ============================================================
   NETWORK AGENTS WORLD — World Engine
   Genera el edificio corporativo por tiles: pasillos, oficinas
   (una por Skill), dirección de Don Ajo, cafetería, sala de
   juegos y break room. Incluye mobiliario, "spots" de actividad
   y pathfinding A*.
   ============================================================ */
(function (global) {
  'use strict';
  const NAW = (global.NAW = global.NAW || {});
  const U = NAW.Utils, EV = NAW.EV;

  const TILE = 16;
  const CORR = 4;        // ancho de pasillo (tiles)
  const ROOM_W = 16;     // ancho de bloque de oficina (incluye muros)
  const ROOM_H = 12;     // alto de bloque de oficina (incluye muros)
  const PAD = 2;         // 1 tile exterior + 1 tile de muro perimetral

  const FLOOR = {
    EXT: 0, CORRIDOR: 1, OFFICE: 2, CEO: 3, CAFE: 4, GAME: 5, BREAK: 6,
    RUG: 7, DANCE: 8, DOOR: 9, CARPET_CEO: 10, RUNNER: 11
  };

  /* ---------------- Binary heap para A* ---------------- */
  class MinHeap {
    constructor() { this.a = []; }
    get size() { return this.a.length; }
    push(node) {
      const a = this.a; a.push(node);
      let i = a.length - 1;
      while (i > 0) {
        const p = (i - 1) >> 1;
        if (a[p].f <= a[i].f) break;
        [a[p], a[i]] = [a[i], a[p]]; i = p;
      }
    }
    pop() {
      const a = this.a, top = a[0], last = a.pop();
      if (a.length) {
        a[0] = last;
        let i = 0;
        for (;;) {
          const l = 2 * i + 1, r = l + 1; let m = i;
          if (l < a.length && a[l].f < a[m].f) m = l;
          if (r < a.length && a[r].f < a[m].f) m = r;
          if (m === i) break;
          [a[m], a[i]] = [a[i], a[m]]; i = m;
        }
      }
      return top;
    }
    clear() { this.a.length = 0; }
  }

  /* ---------------- World ---------------- */
  class WorldEngine {
    constructor(bus) {
      this.bus = bus;
      this.TILE = TILE;
      this.W = 0; this.H = 0;
      this.rooms = [];
      this.objects = [];
      this.spots = [];
      this.cols = 4;
      this.rows = 1;
      this._heap = new MinHeap();
      this._pathCalls = 0;
      this.signature = '';
    }

    get pxW() { return this.W * TILE; }
    get pxH() { return this.H * TILE; }

    /* ============ Construcción ============ */

    /**
     * @param {Array} skills lista del SkillRegistry
     */
    build(skills) {
      const roomDefs = [];
      roomDefs.push({ kind: 'ceo', name: 'Dirección General', sub: 'Don Ajo', color: '#f5d76e', span: 2 });
      roomDefs.push({ kind: 'cafeteria', name: 'Cafetería', sub: 'Comedor godín', color: '#ffb4a2', span: 1 });
      roomDefs.push({ kind: 'game', name: 'Sala de Juegos', sub: 'Arcade & Chill', color: '#b892ff', span: 1 });
      roomDefs.push({ kind: 'break', name: 'Break Room', sub: 'Café & siestas', color: '#8ecae6', span: 1 });
      for (const s of skills) {
        roomDefs.push({ kind: 'office', name: s.name, sub: s.agent.title, color: s.color, span: 1, skillId: s.id });
      }

      const slotsNeeded = roomDefs.reduce((a, r) => a + r.span, 0);
      const cols = U.clamp(Math.ceil(Math.sqrt(slotsNeeded * 1.35)), 4, 12);
      const sig = cols + ':' + roomDefs.map(r => r.kind + (r.skillId || '')).join(',');
      if (sig === this.signature) return false;    // nada cambió
      const isRemodel = this.signature !== '';
      this.signature = sig;
      this.cols = cols;

      // ---- asignación de slots (fila por fila, respetando span) ----
      const placed = [];
      let c = 0, r = 0;
      for (const def of roomDefs) {
        if (c + def.span > cols) { c = 0; r++; }
        placed.push({ def, c, r });
        c += def.span;
      }
      const rows = r + 1;
      this.rows = rows;

      this.W = PAD * 2 + CORR + cols * (ROOM_W + CORR);
      this.H = PAD * 2 + CORR + rows * (ROOM_H + CORR);

      const n = this.W * this.H;
      this.solid = new Uint8Array(n);
      this.wall = new Uint8Array(n);
      this.floor = new Uint8Array(n);
      this.roomAt = new Int16Array(n).fill(-1);

      // exterior + muro perimetral
      for (let y = 0; y < this.H; y++) {
        for (let x = 0; x < this.W; x++) {
          const i = y * this.W + x;
          const outer = x < PAD - 1 || y < PAD - 1 || x >= this.W - (PAD - 1) || y >= this.H - (PAD - 1);
          const ring = !outer && (x < PAD || y < PAD || x >= this.W - PAD || y >= this.H - PAD);
          if (outer) { this.solid[i] = 1; this.floor[i] = FLOOR.EXT; this.roomAt[i] = -2; }
          else if (ring) { this.solid[i] = 1; this.wall[i] = 1; this.floor[i] = FLOOR.EXT; this.roomAt[i] = -2; }
          else { this.floor[i] = FLOOR.CORRIDOR; }
        }
      }

      this.rooms = []; this.objects = []; this.spots = [];

      placed.forEach((p, idx) => {
        const w = p.def.span * ROOM_W + (p.def.span - 1) * CORR;
        const rx = PAD + CORR + p.c * (ROOM_W + CORR);
        const ry = PAD + CORR + p.r * (ROOM_H + CORR);
        const room = {
          index: idx,
          id: p.def.skillId ? 'room_' + p.def.skillId : 'room_' + p.def.kind + '_' + idx,
          kind: p.def.kind,
          name: p.def.name,
          sub: p.def.sub,
          color: p.def.color,
          skillId: p.def.skillId || null,
          x: rx, y: ry, w, h: ROOM_H,
          ix: rx + 1, iy: ry + 1, iw: w - 2, ih: ROOM_H - 2,
          cxPx: (rx + w / 2) * TILE, cyPx: (ry + ROOM_H / 2) * TILE,
          spots: [], objects: [], door: null
        };
        this.rooms.push(room);
        this._carveRoom(room);
        this._furnish(room);
      });

      this.roomsByKind = {};
      for (const room of this.rooms) {
        (this.roomsByKind[room.kind] = this.roomsByKind[room.kind] || []).push(room);
      }
      this.ceoRoom = (this.roomsByKind.ceo || [])[0];
      this._decorateCorridors();

      this.bus.emit(EV.WORLD_BUILT, { world: this, remodel: isRemodel });
      if (isRemodel) this.bus.emit(EV.WORLD_REMODEL, { world: this });
      return true;
    }

    roomBySkill(skillId) { return this.rooms.find(r => r.skillId === skillId); }
    roomByKind(kind) { return (this.roomsByKind[kind] || [])[0]; }

    _carveRoom(room) {
      const floorCode = {
        office: FLOOR.OFFICE, ceo: FLOOR.CEO, cafeteria: FLOOR.CAFE,
        game: FLOOR.GAME, break: FLOOR.BREAK
      }[room.kind] || FLOOR.OFFICE;

      for (let y = room.y; y < room.y + room.h; y++) {
        for (let x = room.x; x < room.x + room.w; x++) {
          const i = y * this.W + x;
          const border = (x === room.x || y === room.y || x === room.x + room.w - 1 || y === room.y + room.h - 1);
          this.roomAt[i] = room.index;
          if (border) { this.solid[i] = 1; this.wall[i] = 1; this.floor[i] = FLOOR.EXT; }
          else { this.solid[i] = 0; this.wall[i] = 0; this.floor[i] = floorCode; }
        }
      }
      // puerta al pasillo inferior (2 tiles)
      const dx = room.x + Math.floor(room.w / 2) - 1;
      const dy = room.y + room.h - 1;
      for (let k = 0; k < 2; k++) {
        const i = dy * this.W + dx + k;
        this.solid[i] = 0; this.wall[i] = 0; this.floor[i] = FLOOR.DOOR;
      }
      room.door = { x: dx, y: dy, w: 2 };
      room.entryPx = { x: (dx + 1) * TILE, y: (dy + 1.5) * TILE };
    }

    /* ---------- Mobiliario ---------- */

    _obj(room, type, tx, ty, w, h, opts = {}) {
      const o = Object.assign({
        type, tx, ty, w, h, roomIndex: room.index,
        color: room.color, solid: opts.solid !== false,
        seed: (U.hashString(room.id + type + tx + ty) % 1000) / 1000
      }, opts);
      this.objects.push(o); room.objects.push(o);
      if (o.solid) this._setSolid(tx, ty, w, h, 1);
      return o;
    }

    _setSolid(tx, ty, w, h, v) {
      for (let y = ty; y < ty + h; y++) {
        for (let x = tx; x < tx + w; x++) {
          if (x < 0 || y < 0 || x >= this.W || y >= this.H) continue;
          this.solid[y * this.W + x] = v;
        }
      }
    }

    _setFloor(tx, ty, w, h, code) {
      for (let y = ty; y < ty + h; y++) {
        for (let x = tx; x < tx + w; x++) {
          if (x < 0 || y < 0 || x >= this.W || y >= this.H) continue;
          this.floor[y * this.W + x] = code;
        }
      }
    }

    _spot(room, type, tx, ty, facing, opts = {}) {
      const s = Object.assign({
        id: room.id + ':' + type + ':' + tx + ',' + ty,
        roomIndex: room.index, roomId: room.id, type, tx, ty,
        facing: facing || 'down', taken: null
      }, opts);
      this.spots.push(s); room.spots.push(s);
      return s;
    }

    _furnish(room) {
      const { ix, iy, iw, ih } = room;
      switch (room.kind) {
        case 'office': this._furnishOffice(room, ix, iy, iw, ih); break;
        case 'ceo': this._furnishCeo(room, ix, iy, iw, ih); break;
        case 'cafeteria': this._furnishCafe(room, ix, iy, iw, ih); break;
        case 'game': this._furnishGame(room, ix, iy, iw, ih); break;
        case 'break': this._furnishBreak(room, ix, iy, iw, ih); break;
      }
    }

    _furnishOffice(room, ix, iy, iw, ih) {
      // Tapete central
      this._setFloor(ix + 4, iy + 6, 6, 3, FLOOR.RUG);
      // Pizarrón contra el muro superior
      this._obj(room, 'whiteboard', ix + 5, iy, 4, 1, { solid: true });
      // Escritorios (hasta 2 puestos por departamento)
      const desks = [[ix + 1, iy + 2], [ix + 9, iy + 2]];
      desks.forEach((d, i) => {
        this._obj(room, 'desk', d[0], d[1], 3, 2, { solid: true });
        this._obj(room, 'monitor', d[0] + 1, d[1], 1, 1, { solid: false, dyn: true });
        this._obj(room, 'chair', d[0] + 1, d[1] + 2, 1, 1, { solid: false, facing: 'up' });
        this._spot(room, 'desk', d[0] + 1, d[1] + 2, 'up', { slot: i });
      });
      // Detalles
      this._obj(room, 'plant', ix, iy, 1, 1);
      this._obj(room, 'plant', ix + iw - 1, iy + ih - 1, 1, 1);
      this._obj(room, 'cabinet', ix + iw - 2, iy + 1, 2, 1);
      this._obj(room, 'trash', ix, iy + 4, 1, 1, { solid: false });
      this._obj(room, 'boxes', ix, iy + ih - 2, 1, 2);
      this._obj(room, 'bookshelf', ix + 1, iy, 3, 1);
      this._obj(room, 'watercooler', ix + iw - 1, iy + 5, 1, 1);
      this._obj(room, 'coffeetable', ix + 5, iy + 7, 2, 1, { solid: true });
      this._spot(room, 'idle', ix + 4, iy + 7, 'down');
      this._spot(room, 'idle', ix + 9, iy + 7, 'down');
      this._spot(room, 'phone', ix + iw - 3, iy + 6, 'left');
    }

    _furnishCeo(room, ix, iy, iw, ih) {
      const midX = ix + Math.floor(iw / 2);
      this._setFloor(ix + 8, iy + 1, iw - 14, ih - 2, FLOOR.CARPET_CEO);
      // Emblema corporativo en la alfombra
      this._obj(room, 'emblem', midX - 2, iy + 5, 6, 5, { solid: false, decal: true });
      // Escritorio ejecutivo
      const dx = midX - 3, dy = iy + 2;
      this._obj(room, 'ceodesk', dx, dy, 6, 2, { solid: true });
      this._obj(room, 'monitor', dx + 1, dy, 1, 1, { solid: false, dyn: true });
      this._obj(room, 'deskphone', dx + 4, dy, 1, 1, { solid: false });
      this._obj(room, 'chairBoss', midX, dy - 1, 1, 1, { solid: false, facing: 'down' });
      this._spot(room, 'boss', midX, dy - 1, 'down');
      // Sillas de visita
      this._obj(room, 'chair', dx + 1, dy + 3, 1, 1, { solid: false, facing: 'up' });
      this._obj(room, 'chair', dx + 4, dy + 3, 1, 1, { solid: false, facing: 'up' });
      this._spot(room, 'guest', dx + 1, dy + 3, 'up');
      this._spot(room, 'guest', dx + 4, dy + 3, 'up');
      // Librero y decoración
      this._obj(room, 'bookshelf', ix + 1, iy, 3, 1);
      this._obj(room, 'bookshelf', ix + iw - 4, iy, 3, 1);
      this._obj(room, 'painting', midX + 6, iy, 2, 1);
      this._obj(room, 'painting', ix + 5, iy, 2, 1);
      this._obj(room, 'whiteboard', ix + 8, iy, 4, 1);
      this._obj(room, 'plant', ix, iy, 1, 1);
      this._obj(room, 'plant', ix + iw - 1, iy, 1, 1);
      this._obj(room, 'plant', ix, iy + ih - 1, 1, 1);
      this._obj(room, 'plant', ix + iw - 1, iy + ih - 1, 1, 1);
      this._obj(room, 'plant', midX + 9, iy + 6, 1, 1);
      // Sala de estar (izquierda)
      this._obj(room, 'sofa', ix + 1, iy + 4, 4, 1, { solid: false, sit: true, color: '#3f4a6b' });
      this._obj(room, 'coffeetable', ix + 2, iy + 6, 2, 1);
      this._obj(room, 'sofa', ix + 1, iy + 8, 4, 1, { solid: false, sit: true, color: '#3f4a6b' });
      this._obj(room, 'watercooler', ix + 6, iy + 4, 1, 1);
      this._obj(room, 'cabinet', ix + 6, iy + 8, 2, 1);
      this._spot(room, 'sit', ix + 1, iy + 4, 'down');
      this._spot(room, 'sit', ix + 3, iy + 4, 'down');
      this._spot(room, 'sit', ix + 1, iy + 8, 'down');
      // Mesa de juntas (derecha)
      const mtX = midX + 6;
      this._obj(room, 'meettable', mtX, iy + 4, 6, 2, { solid: true });
      for (let k = 0; k < 3; k++) {
        this._obj(room, 'chair', mtX + k * 2, iy + 3, 1, 1, { solid: false, facing: 'down' });
        this._obj(room, 'chair', mtX + k * 2, iy + 6, 1, 1, { solid: false, facing: 'up' });
        this._spot(room, 'guest', mtX + k * 2, iy + 3, 'down');
        this._spot(room, 'guest', mtX + k * 2, iy + 6, 'up');
      }
      this._obj(room, 'boxes', ix + iw - 1, iy + 6, 1, 2);
      // Puntos de junta (frente al escritorio, hasta 20 asistentes)
      for (let row = 0; row < 2; row++) {
        for (let col = 0; col < 10; col++) {
          const sx = ix + 9 + col * 2, sy = iy + 7 + row * 2;
          if (sx < ix + iw - 1) this._spot(room, 'meet', sx, sy, 'up');
        }
      }
    }

    _furnishCafe(room, ix, iy, iw, ih) {
      this._obj(room, 'buffet', ix + 3, iy, 8, 1, { solid: true });
      this._obj(room, 'fridge', ix, iy, 1, 2);
      this._obj(room, 'vending', ix + iw - 1, iy, 1, 2);
      this._spot(room, 'food', ix + 5, iy + 1, 'up');
      this._spot(room, 'food', ix + 8, iy + 1, 'up');
      const tables = [[ix + 2, iy + 3], [ix + 9, iy + 3], [ix + 2, iy + 7], [ix + 9, iy + 7]];
      tables.forEach(t => {
        this._obj(room, 'table', t[0], t[1], 2, 2, { solid: true });
        this._obj(room, 'chair', t[0] - 1, t[1], 1, 1, { solid: false, facing: 'right' });
        this._obj(room, 'chair', t[0] + 2, t[1], 1, 1, { solid: false, facing: 'left' });
        this._spot(room, 'eat', t[0] - 1, t[1], 'right');
        this._spot(room, 'eat', t[0] + 2, t[1], 'left');

      this._obj(room, 'plant', ix + 6, iy + 5, 1, 1);
      this._spot(room, 'idle', ix + 7, iy + 6, 'down');

    _furnishGame(room, ix, iy, iw, ih) {
      const arcades = [[ix + 1, iy], [ix + 4, iy], [ix + 7, iy]];
      arcades.forEach(a => {
        this._obj(room, 'arcade', a[0], a[1], 2, 2, { solid: true, dyn: true });
        this._spot(room, 'game', a[0] + 1, a[1] + 2, 'up');
      });
      this._obj(room, 'tv', ix + iw - 3, iy, 3, 1, { solid: true, dyn: true });
      this._obj(room, 'sofa', ix + iw - 4, iy + 3, 3, 1, { solid: false, sit: true });
      this._spot(room, 'game', ix + iw - 4, iy + 3, 'up');
      this._spot(room, 'game', ix + iw - 2, iy + 3, 'up');
      // Pista de baile
      this._setFloor(ix + 1, iy + 5, 5, 4, FLOOR.DANCE);
      this._obj(room, 'discoball', ix + 3, iy + 5, 1, 1, { solid: false, dyn: true });
      this._spot(room, 'dance', ix + 2, iy + 6, 'down');
      this._spot(room, 'dance', ix + 4, iy + 6, 'down');
      this._spot(room, 'dance', ix + 2, iy + 8, 'up');
      this._spot(room, 'dance', ix + 4, iy + 8, 'up');
      this._obj(room, 'speaker', ix, iy + 5, 1, 1);
      this._obj(room, 'speaker', ix, iy + 8, 1, 1);
      this._obj(room, 'foosball', ix + 8, iy + 6, 3, 2, { solid: true });
      this._spot(room, 'game', ix + 9, iy + 8, 'up');
      this._spot(room, 'game', ix + 9, iy + 5, 'down');
    }

    _furnishBreak(room, ix, iy, iw, ih) {
      this._obj(room, 'coffee', ix + 1, iy, 2, 2, { solid: true, dyn: true });
      this._spot(room, 'coffee', ix + 1, iy + 2, 'up');
      this._spot(room, 'coffee', ix + 2, iy + 2, 'up');
      this._obj(room, 'watercooler', ix + 5, iy, 1, 2);
      this._spot(room, 'talk', ix + 5, iy + 2, 'up');
      this._spot(room, 'talk', ix + 6, iy + 2, 'left');
      this._obj(room, 'bookshelf', ix + iw - 4, iy, 3, 1);
      this._obj(room, 'sofa', ix + 1, iy + 4, 4, 1, { solid: false, sit: true });
      this._spot(room, 'sit', ix + 1, iy + 4, 'down');
      this._spot(room, 'sit', ix + 3, iy + 4, 'down');
      this._obj(room, 'coffeetable', ix + 2, iy + 6, 2, 1);
      this._obj(room, 'napcouch', ix + 9, iy + 8, 4, 1, { solid: false, sit: true });
      this._spot(room, 'sleep', ix + 9, iy + 8, 'down');
      this._spot(room, 'sleep', ix + 11, iy + 8, 'down');
      this._obj(room, 'plant', ix, iy + ih - 1, 1, 1);
      this._obj(room, 'plant', ix + iw - 1, iy + ih - 1, 1, 1);
      this._obj(room, 'plant', ix + iw - 1, iy + 4, 1, 1);
      this._obj(room, 'vending', ix + 8, iy, 1, 2);
      this._obj(room, 'tv', ix + 10, iy + 3, 3, 1, { solid: true, dyn: true });
      this._obj(room, 'sofa', ix + 9, iy + 6, 3, 1, { solid: false, sit: true });
      this._spot(room, 'sit', ix + 9, iy + 6, 'up');
      this._spot(room, 'sit', ix + 11, iy + 6, 'up');
      this._obj(room, 'trash', ix + 7, iy + 2, 1, 1, { solid: false });
      this._setFloor(ix + 1, iy + 5, 4, 2, FLOOR.RUG);
      this._spot(room, 'idle', ix + 6, iy + 7, 'down');
    }

    /* ---------- Pasillos: tapete guía + decoración de puertas ---------- */
    _decorateCorridors() {
      const modX = ROOM_W + CORR, modY = ROOM_H + CORR;
      for (let y = PAD; y < this.H - PAD; y++) {
        const by = ((y - PAD) % modY);
        for (let x = PAD; x < this.W - PAD; x++) {
          const i = y * this.W + x;
          if (this.floor[i] !== FLOOR.CORRIDOR) continue;
          const bx = ((x - PAD) % modX);
          if ((bx === 1 || bx === 2) || (by === 1 || by === 2)) this.floor[i] = FLOOR.RUNNER;
        }
      }
      for (const room of this.rooms) {
        const d = room.door;
        if (!d) continue;
        // placa con el color del depa junto a la puerta
        this._obj(room, 'plaque', d.x + 2, d.y, 1, 1, { solid: false });
        this._obj(room, 'plaque', d.x - 1, d.y, 1, 1, { solid: false });
        // maceta en el pasillo
        const px = d.x - 3, py = d.y + 1;
        if (this.inBounds(px, py) && this.floor[py * this.W + px] !== FLOOR.EXT) {
          this._obj(room, 'plant', px, py, 1, 1, { solid: true, seed: 0.7 });
        }
        const bx = d.x + 3;
        if (this.inBounds(bx, py) && this.floor[py * this.W + bx] !== FLOOR.EXT) {
          this._obj(room, 'bench', bx, py, 2, 1, { solid: true });
        }
      }
    }

    /* ============ Consultas ============ */

    idx(x, y) { return y * this.W + x; }
    inBounds(x, y) { return x >= 0 && y >= 0 && x < this.W && y < this.H; }
    isWalkable(x, y) { return this.inBounds(x, y) && this.solid[y * this.W + x] === 0; }
    roomIndexAt(x, y) { return this.inBounds(x, y) ? this.roomAt[y * this.W + x] : -2; }
    roomAtTile(x, y) { const i = this.roomIndexAt(x, y); return i >= 0 ? this.rooms[i] : null; }
    tileOf(px, py) { return { x: Math.floor(px / TILE), y: Math.floor(py / TILE) }; }
    center(tx, ty) { return { x: tx * TILE + TILE / 2, y: ty * TILE + TILE / 2 }; }

    /** Encuentra el tile caminable más cercano a (x,y) */
    nearestWalkable(x, y, maxR = 8) {
      if (this.isWalkable(x, y)) return { x, y };
      for (let r = 1; r <= maxR; r++) {
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) {
            if (Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
            const nx = x + dx, ny = y + dy;
            if (this.isWalkable(nx, ny)) return { x: nx, y: ny };
          }
        }
      }
      return null;
    }

    randomTileIn(room, rng) {
      for (let i = 0; i < 40; i++) {
        const x = room.ix + Math.floor((rng ? rng() : Math.random()) * room.iw);
        const y = room.iy + Math.floor((rng ? rng() : Math.random()) * room.ih);
        if (this.isWalkable(x, y)) return { x, y };
      }
      return this.nearestWalkable(room.ix + 1, room.iy + 1);
    }

    /* ---- Reserva de spots ---- */
    findSpot(type, opts = {}) {
      const pool = opts.room ? opts.room.spots : this.spots;
      let best = null, bestD = Infinity;
      for (const s of pool) {
        if (s.type !== type || s.taken) continue;
        if (opts.roomIndex != null && s.roomIndex !== opts.roomIndex) continue;
        let d = 0;
        if (opts.from) d = Math.abs(s.tx - opts.from.x) + Math.abs(s.ty - opts.from.y);
        else d = Math.random() * 100;
        if (d < bestD) { bestD = d; best = s; }
      }
      return best;
    }
    reserve(spot, agentId) { if (!spot || spot.taken) return false; spot.taken = agentId; return true; }
    release(spot, agentId) { if (spot && (!agentId || spot.taken === agentId)) spot.taken = null; }
    releaseAllFor(agentId) { for (const s of this.spots) if (s.taken === agentId) s.taken = null; }

    /* ============ Pathfinding A* ============ */
    findPath(sx, sy, gx, gy, maxNodes = 4000) {
      if (!this.inBounds(sx, sy) || !this.inBounds(gx, gy)) return null;
      if (sx === gx && sy === gy) return [];
      if (!this.isWalkable(gx, gy)) {
        const nw = this.nearestWalkable(gx, gy, 4);
        if (!nw) return null;
        gx = nw.x; gy = nw.y;
      }
      const W = this.W, size = W * this.H;
      if (!this._g || this._g.length !== size) {
        this._g = new Float32Array(size);
        this._came = new Int32Array(size);
        this._closed = new Uint8Array(size);
        this._stamp = new Int32Array(size);
        this._stampId = 0;
      }
      this._stampId++;
      const stampId = this._stampId, g = this._g, came = this._came,
        closed = this._closed, stamp = this._stamp, solid = this.solid;
      const heap = this._heap; heap.clear();

      const start = sy * W + sx, goal = gy * W + gx;
      g[start] = 0; came[start] = -1; stamp[start] = stampId; closed[start] = 0;
      heap.push({ i: start, f: Math.abs(sx - gx) + Math.abs(sy - gy) });

      let nodes = 0;
      while (heap.size) {
        const cur = heap.pop();
        const ci = cur.i;
        if (stamp[ci] === stampId && closed[ci]) continue;
        closed[ci] = 1;
        if (ci === goal) return this._reconstruct(came, ci, stampId, stamp);
        if (++nodes > maxNodes) break;
        const cx = ci % W, cy = (ci / W) | 0;
        for (let d = 0; d < 4; d++) {
          const nx = cx + (d === 0 ? 1 : d === 1 ? -1 : 0);
          const ny = cy + (d === 2 ? 1 : d === 3 ? -1 : 0);
          if (nx < 0 || ny < 0 || nx >= W || ny >= this.H) continue;
          const ni = ny * W + nx;
          if (solid[ni]) continue;
          const ng = g[ci] + 1;
          if (stamp[ni] !== stampId) {
            stamp[ni] = stampId; closed[ni] = 0; g[ni] = ng; came[ni] = ci;
            heap.push({ i: ni, f: ng + Math.abs(nx - gx) + Math.abs(ny - gy) });
          } else if (!closed[ni] && ng < g[ni]) {
            g[ni] = ng; came[ni] = ci;
            heap.push({ i: ni, f: ng + Math.abs(nx - gx) + Math.abs(ny - gy) });
          }
        }
      }
      return null;
    }

    _reconstruct(came, i, stampId, stamp) {
      const W = this.W, path = [];
      while (i !== -1) {
        path.push({ x: i % W, y: (i / W) | 0 });
        i = came[i];
      }
      path.reverse();
      path.shift(); // quitamos el tile inicial
      return path;
    }
  }

  WorldEngine.TILE = TILE;
  WorldEngine.FLOOR = FLOOR;
  WorldEngine.ROOM_W = ROOM_W;
  WorldEngine.ROOM_H = ROOM_H;
  WorldEngine.CORR = CORR;
  NAW.WorldEngine = WorldEngine;
  NAW.FLOOR = FLOOR;
})(window);

   NETWORK AGENTS WORLD — Agent Engine
