/* ============================================================
   NETWORK AGENTS WORLD — UI
   Todo el HUD: plantilla de empleados, chat con Don Ajo,
   tablero de pendientes, bandeja de entregables, skills,
   ficha de empleado, minimapa, toasts y SFX chiptune.
   ============================================================ */
(function (global) {
  'use strict';
  const NAW = (global.NAW = global.NAW || {});
  const U = NAW.Utils, EV = NAW.EV, S = NAW.Sprites;
  const $ = (id) => document.getElementById(id);

  /* ---------------- SFX (WebAudio, sin assets) ---------------- */
  const Sfx = {
    on: true, ctx: null, unlocked: false,
    unlock() {
      this.unlocked = true;
      const ac = this._ac();
      if (ac && ac.state === 'suspended') ac.resume();
    },
    _ac() {
      if (!this.unlocked) return null;
      if (!this.ctx) {
        const AC = global.AudioContext || global.webkitAudioContext;
        if (!AC) return null;
        this.ctx = new AC();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    },
    blip(freq = 440, dur = 0.07, type = 'square', vol = 0.05) {
      if (!this.on) return;
      const ac = this._ac(); if (!ac) return;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    },
    click() { this.blip(320, 0.05, 'square', 0.035); },
    send() { this.blip(560, 0.06); this.setTimeoutBlip(720, 60); },
    done() { [660, 880, 1180].forEach((f, i) => this.setTimeoutBlip(f, i * 70)); },
    fail() { [300, 200].forEach((f, i) => this.setTimeoutBlip(f, i * 110, 'sawtooth')); },
    hire() { [523, 659, 784, 1046].forEach((f, i) => this.setTimeoutBlip(f, i * 80)); },
    setTimeoutBlip(f, ms, type) { setTimeout(() => this.blip(f, 0.08, type || 'square'), ms); }
  };

  /* ---------------- Retratos ---------------- */
  function drawPortrait(canvas, agent, scale) {
    if (!canvas || !agent) return;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    scale = scale || 1;
    ctx.save();
    ctx.scale(scale, scale);
    const sx = agent.x, sy = agent.y, sf = agent.facing, st = agent.state, sb = agent.bubble, sa = agent.animT;
    agent.x = canvas.width / (2 * scale);
    agent.y = canvas.height / scale - 2;
    agent.facing = 'down'; agent.bubble = null;
    if (!['idle', 'work', 'coffee', 'talk', 'success'].includes(st)) agent.state = 'idle';
    S.drawAgent(ctx, agent, 0);
    agent.x = sx; agent.y = sy; agent.facing = sf; agent.state = st; agent.bubble = sb; agent.animT = sa;
    ctx.restore();
  }

  /* ============================================================ */
  class UI {
    constructor(app) {
      this.app = app;
      this.bus = app.bus;
      this.el = {
        chatLog: $('chatLog'), chatForm: $('chatForm'), chatInput: $('chatInput'),
        roster: $('rosterList'), rosterCount: $('rosterCount'),
        tabs: document.querySelectorAll('.tab'),
        tasks: $('tabTasks'), inbox: $('tabInbox'), skills: $('tabSkills'),
        agentCard: $('agentCard'), toasts: $('toasts'), minimap: $('minimap'),
        quick: $('quickChips'), miniInfo: $('miniInfo')
      };
      this.rosterEls = new Map();
      this.taskEls = new Map();
      this.activeTab = 'tasks';
      this._mmTimer = 0;
      this._uiTimer = 0;
      this.dirty = { roster: true, tasks: true, inbox: true, skills: true, card: true };
      this._bind();
      this._quickChips();
      this._events();
    }

    /* ---------- Binding ---------- */
    _bind() {
      const A = this.app;
      // El audio sólo puede arrancar tras un gesto del usuario
      const unlock = () => { Sfx.unlock(); global.removeEventListener('pointerdown', unlock); global.removeEventListener('keydown', unlock); };
      global.addEventListener('pointerdown', unlock);
      global.addEventListener('keydown', unlock);

      this.el.chatForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const v = this.el.chatInput.value.trim();
        if (!v) return;
        this.el.chatInput.value = '';
        Sfx.click();
        A.ajo.userSays(v);
      });

      $('btnMeeting').onclick = () => { Sfx.click(); A.ajo.process('/junta'); };
      $('btnBreak').onclick = () => { Sfx.click(); A.ajo.process('/descanso'); };
      $('btnWork').onclick = () => { Sfx.click(); A.ajo.process('/trabajo'); };
      $('btnZoomIn').onclick = () => { Sfx.click(); A.renderer.zoomBy(1.3); };
      $('btnZoomOut').onclick = () => { Sfx.click(); A.renderer.zoomBy(1 / 1.3); };
      $('btnFit').onclick = () => { Sfx.click(); A.fitView(); };
      $('btnSpeed').onclick = (e) => { Sfx.click(); const s = A.cycleSpeed(); e.target.textContent = 'x' + s; };
      $('btnSound').onclick = (e) => {
        Sfx.on = !Sfx.on; e.target.textContent = Sfx.on ? '🔊' : '🔇';
        e.target.classList.toggle('active', Sfx.on); if (Sfx.on) Sfx.click();
      };
      $('btnUI').onclick = () => {
        document.body.classList.toggle('ui-hidden');
        setTimeout(() => A.renderer.updateInsets(), 30);
        Sfx.click();
      };
      $('btnReset').onclick = () => {
        if (confirm('¿Reiniciar el corporativo? Se borran skills nuevas, tareas y entregables.')) A.hardReset();
      };

      this.el.tabs.forEach(t => t.onclick = () => {
        Sfx.click();
        this.el.tabs.forEach(x => x.classList.toggle('active', x === t));
        this.activeTab = t.dataset.tab;
        $('tabTasks').classList.toggle('hidden', this.activeTab !== 'tasks');
        $('tabInbox').classList.toggle('hidden', this.activeTab !== 'inbox');
        $('tabSkills').classList.toggle('hidden', this.activeTab !== 'skills');
        this.dirty[this.activeTab] = true;
      });

      // minimapa: clic para viajar
      this.el.minimap.addEventListener('pointerdown', (e) => {
        const r = this.el.minimap.getBoundingClientRect();
        const mx = (e.clientX - r.left) * (this.el.minimap.width / r.width);
        const my = (e.clientY - r.top) * (this.el.minimap.height / r.height);
        const p = A.renderer.minimapToWorld(mx, my);
        if (p) { A.renderer.follow = null; A.renderer.centerOn(p.x, p.y); Sfx.click(); }
      });

      // barra móvil
      document.querySelectorAll('#mobileBar .btn').forEach(b => {
        b.onclick = () => {
          const target = b.dataset.panel;
          if (target === 'chat') {
            $('leftcol').classList.remove('collapsed');
            $('chatInput').focus();
          } else {
            const el = $(target);
            el.classList.toggle('collapsed');
            if (target === 'leftcol') $('rightcol').classList.add('collapsed');
            if (target === 'rightcol') $('leftcol').classList.add('collapsed');
          }
          Sfx.click();
        };
      });
      if (global.matchMedia('(max-width:940px)').matches) {
        $('leftcol').classList.add('collapsed');
        $('rightcol').classList.add('collapsed');
      }
    }

    _quickChips() {
      const chips = [
        ['🎬 Edítame un video', 'Edítame el video del testimonio para TikTok con subtítulos'],
        ['📱 Trial reel', 'Lanza un trial reel para probar 3 hooks distintos'],
        ['🗓 Plan semanal', 'Arma el calendario de contenido de la próxima semana'],
        ['✍️ 5 hooks', 'Escríbeme 5 hooks para el reel de esta semana'],
        ['💡 Ideas', 'Dame ideas de contenido para la marca'],
        ['📊 Estado', '/estado']
      ];
      this.el.quick.innerHTML = '';
      chips.forEach(([label, text]) => {
        const b = document.createElement('button');
        b.className = 'qchip'; b.type = 'button'; b.textContent = label;
        b.onclick = () => { Sfx.click(); this.app.ajo.userSays(text); };
        this.el.quick.appendChild(b);
      });
    }

    _events() {
      const bus = this.bus;
      bus.on(EV.CHAT_MESSAGE, (m) => this.addChat(m));
      bus.on('chat:clear', () => { this.el.chatLog.innerHTML = ''; });
      bus.on(EV.AGENT_SPAWNED, () => { this.dirty.roster = true; });
      bus.on(EV.SKILL_ADDED, () => { this.dirty.skills = true; this.dirty.roster = true; });
      bus.on(EV.SKILL_DETECTED, ({ skill }) => {
        Sfx.hire();
        this.toast(`Nueva Skill detectada: <b>${U.escapeHtml(skill.name)}</b> → contratado <b>${U.escapeHtml(skill.agent.nick)}</b>`, 'new', 6000);
      });
      bus.on(EV.TASK_CREATED, () => { this.dirty.tasks = true; });
      bus.on(EV.TASK_ASSIGNED, () => { this.dirty.tasks = true; });
      bus.on(EV.TASK_DONE, ({ task, agent }) => {
        this.dirty.tasks = true; this.dirty.inbox = true;
        Sfx.done();
        this.toast(`<b>${U.escapeHtml(agent.name)}</b> entregó “${U.escapeHtml(U.truncate(task.title, 40))}”`, 'ok');
        this.app.renderer.burst(agent.x, agent.y, 'confetti');
      });
      bus.on(EV.TASK_FAILED, ({ agent }) => {
        this.dirty.tasks = true; Sfx.fail();
        if (agent) this.app.renderer.burst(agent.x, agent.y, 'error');
      });
      bus.on(EV.AGENT_SELECTED, () => { this.dirty.card = true; this.dirty.roster = true; });
      bus.on(EV.TOAST, ({ text, kind }) => this.toast(text, kind));
      bus.on(EV.WORLD_REMODEL, () => {
        this.toast('🏗 Remodelación corporativa: el edificio creció', 'info');
      });
      bus.on(EV.MEETING_START, () => this.toast('📣 Junta general en la Dirección', 'info'));
    }

    /* ---------- Chat ---------- */
    addChat(m) {
      const div = document.createElement('div');
      div.className = 'msg ' + (m.from === 'user' ? 'user' : m.from === 'agent' ? 'agent' : m.from === 'sys' ? 'sys' : 'ajo');
      const who = m.from === 'user' ? 'TÚ' : (m.name || 'DON AJO').toUpperCase();
      div.innerHTML = (m.from === 'sys' ? '' : `<span class="who">${U.escapeHtml(who)}</span>`) +
        U.escapeHtml(m.text).replace(/\n/g, '<br>');
      this.el.chatLog.appendChild(div);
      while (this.el.chatLog.children.length > 90) this.el.chatLog.removeChild(this.el.chatLog.firstChild);
      this.el.chatLog.scrollTop = this.el.chatLog.scrollHeight;
      if (m.from === 'ajo') Sfx.blip(420, 0.05, 'triangle', 0.04);
    }

    sys(text) { this.addChat({ from: 'sys', text }); }

    /* ---------- Toasts ---------- */
    toast(html, kind = '', ms = 4200) {
      const d = document.createElement('div');
      d.className = 'toast ' + kind;
      d.innerHTML = html;
      this.el.toasts.appendChild(d);
      setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 400); }, ms);
      while (this.el.toasts.children.length > 4) this.el.toasts.firstChild.remove();
    }

    /* ---------- Roster ---------- */
    renderRoster() {
      const A = this.app;
      const list = A.agents.agents;
      this.el.roster.innerHTML = '';
      this.rosterEls.clear();
      this.el.rosterCount.textContent = A.agents.workers.length;
      for (const a of list) {
        const row = document.createElement('div');
        row.className = 'agent-row' + (A.agents.selectedId === a.id ? ' sel' : '');
        row.innerHTML = `
          <canvas class="por" width="26" height="32"></canvas>
          <div class="info">
            <div class="nm"><span class="dot" style="background:${a.color}"></span>${U.escapeHtml(a.name)}${a.isBoss ? ' 👑' : ''}</div>
            <div class="ti">${U.escapeHtml(a.title)}</div>
            <div class="st"><span class="ic">${a.stateIcon}</span><span class="stx">${a.stateLabel}</span></div>
          </div>
          <div class="bars">
            <div class="bar energy" title="Energía"><i style="width:100%"></i></div>
            <div class="bar fun" title="Diversión"><i style="width:100%"></i></div>
            <div class="bar social" title="Social"><i style="width:100%"></i></div>
            <div class="bar hunger" title="Hambre"><i style="width:0%"></i></div>
          </div>
          <div class="prog" style="width:0%"></div>`;
        row.onclick = () => { Sfx.click(); A.selectAgent(a.id, true); };
        row.ondblclick = () => A.renderer.focusAgent(a, 3);
        this.el.roster.appendChild(row);
        drawPortrait(row.querySelector('canvas'), a, 1.15);
        this.rosterEls.set(a.id, {
          row,
          stx: row.querySelector('.stx'),
          ic: row.querySelector('.ic'),
          bars: row.querySelectorAll('.bar i'),
          prog: row.querySelector('.prog')
        });
      }
    }

    updateRoster() {
      const A = this.app;
      for (const a of A.agents.agents) {
        const e = this.rosterEls.get(a.id);
        if (!e) continue;
        e.stx.textContent = a.task ? U.truncate(a.task.title, 18) : a.stateLabel;
        e.ic.textContent = a.stateIcon;
        e.bars[0].style.width = Math.round(a.needs.energy * 100) + '%';
        e.bars[1].style.width = Math.round(a.needs.fun * 100) + '%';
        e.bars[2].style.width = Math.round(a.needs.social * 100) + '%';
        e.bars[3].style.width = Math.round(a.needs.hunger * 100) + '%';
        e.prog.style.width = a.task ? Math.round(a.task.progress * 100) + '%' : '0%';
        e.row.classList.toggle('sel', A.agents.selectedId === a.id);
      }
    }

    /* ---------- Pendientes ---------- */
    renderTasks() {
      const A = this.app, T = A.tasks;
      const active = T.tasks.filter(t => ['queued', 'walking', 'working', 'retry'].includes(t.status));
      const recent = T.tasks.filter(t => t.status === 'done').slice(-6).reverse();
      $('tabTasksCount').textContent = active.length;
      const box = this.el.tasks;
      box.innerHTML = '';
      this.taskEls.clear();

      if (!active.length && !recent.length) {
        box.innerHTML = `<div style="color:#6d7ba0;font-size:10.5px;padding:10px;text-align:center">
          Sin pendientes.<br>Pídele algo a Don Ajo en el chat 👇</div>`;
        return;
      }
      const add = (t, done) => {
        const d = document.createElement('div');
        d.className = 'task ' + (done ? 'done' : t.status === 'queued' ? 'queued' : t.status === 'retry' ? 'error' : '');
        d.style.borderLeftColor = t.color || '#4cc9f0';
        d.innerHTML = `
          <div class="tt"><span>#${t.num || '·'} ${U.escapeHtml(U.truncate(t.title, 52))}</span>
            ${done ? '' : '<span class="x" title="Cancelar">✕</span>'}</div>
          <div class="meta"><span>${U.escapeHtml(t.skillName || '')}</span><span>${U.escapeHtml(t.agentName || 'sin asignar')}</span></div>
          <div class="step">${done ? '✔ entregado' : (t.status === 'queued' ? '⏳ en cola' : '▶ ' + U.escapeHtml(t.steps[t.currentStep] || 'trabajando'))}</div>
          ${done ? '' : '<div class="pbar"><i style="width:' + Math.round((t.progress || 0) * 100) + '%"></i></div>'}`;
        if (!done) {
          const x = d.querySelector('.x');
          if (x) x.onclick = (e) => { e.stopPropagation(); A.tasks.cancel(t.id); this.dirty.tasks = true; Sfx.fail(); };
          this.taskEls.set(t.id, { el: d, bar: d.querySelector('.pbar i'), step: d.querySelector('.step') });
        }
        d.onclick = () => {
          const ag = t.agentId ? A.agents.get(t.agentId) : null;
          if (ag) { A.selectAgent(ag.id, true); A.renderer.focusAgent(ag, 2.8); }
        };
        box.appendChild(d);
      };
      active.forEach(t => add(t, false));
      if (recent.length) {
        const h = document.createElement('div');
        h.style.cssText = 'font-size:9px;letter-spacing:1px;color:#66739a;margin:8px 0 5px';
        h.textContent = 'RECIENTES';
        box.appendChild(h);
        recent.forEach(t => add(t, true));
      }
    }

    updateTasks() {
      for (const [id, e] of this.taskEls) {
        const t = this.app.tasks.tasks.find(x => x.id === id);
        if (!t) continue;
        if (e.bar) e.bar.style.width = Math.round((t.progress || 0) * 100) + '%';
        if (e.step) {
          e.step.textContent = t.status === 'queued' ? '⏳ en cola'
            : t.status === 'retry' ? '⚠ reintentando…'
              : '▶ ' + (t.steps[t.currentStep] || 'trabajando');
        }
      }
    }

    /* ---------- Entregables ---------- */
    renderInbox() {
      const box = this.el.inbox, items = this.app.tasks.deliverables;
      $('tabInboxCount').textContent = items.length;
      box.innerHTML = '';
      if (!items.length) {
        box.innerHTML = `<div style="color:#6d7ba0;font-size:10.5px;padding:10px;text-align:center">
          Aquí caen los entregables de tus empleados.</div>`;
        return;
      }
      items.forEach((it, i) => {
        const d = document.createElement('div');
        d.className = 'dlv' + (i === 0 ? ' open' : '');

          <div class="h"><span class="dot" style="background:${it.color}"></span>
            <span>${U.escapeHtml(U.truncate(it.title, 34))}</span>
            <span class="ag">${U.escapeHtml(it.agent)} · ${U.ago(it.at)}</span></div>
          <div class="b">${U.escapeHtml(it.body)}</div>
          <div class="acts"><button class="btn mini copy">COPIAR</button>

        d.querySelector('.h').onclick = () => { d.classList.toggle('open'); Sfx.click(); };

          e.stopPropagation();
          const t = it.body;
          if (navigator.clipboard) navigator.clipboard.writeText(t).catch(() => { });
          else { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (err) { } ta.remove(); }
          this.toast('Entregable copiado al portapapeles', 'ok', 2200);
        };
        d.querySelector('.goto').onclick = (e) => {
          e.stopPropagation();
          const ag = it.agentId ? this.app.agents.get(it.agentId) : null;
          if (ag) { this.app.selectAgent(ag.id, true); this.app.renderer.focusAgent(ag, 2.8); }

              <span class="state-chip" id="cardState">${a.stateIcon} ${a.stateLabel}</span></div>
            <div class="ti">${U.escapeHtml(a.title)}${skill ? ' · Skill: ' + U.escapeHtml(skill.name) : ''}</div>

            <div class="needs">
              ${['energy:Energía', 'fun:Diversión', 'social:Social', 'hunger:Hambre'].map(x => {

      const st = $('cardState');
      if (st) st.textContent = `${a.stateIcon} ${a.stateLabel}`;
      const bars = this.el.agentCard.querySelectorAll('[data-need]');
      bars.forEach(b => { b.style.width = Math.round((a.needs[b.dataset.need] || 0) * 100) + '%'; });
      const s = $('cardStats');
      if (s) {
        s.innerHTML = [
          `✔ ${a.stats.done} entregas`, `⚠ ${a.stats.failed} errores`,
          `☕ ${a.stats.coffees}`, `🎮 ${a.stats.games}`, `🍽 ${a.stats.meals}`, `😴 ${a.stats.naps}`,
          a.task ? `⚙ ${U.truncate(a.task.title, 26)} (${Math.round(a.task.progress * 100)}%)` : ''
        ].filter(Boolean).map(t => `<span>${U.escapeHtml(t)}</span>`).join('');
      }
    }

    /* ---------- Stats topbar ---------- */
    updateStats() {
      const A = this.app;
      const st = A.tasks.stats();
      $('statSkills').textContent = A.registry.count;
      $('statAgents').textContent = A.agents.workers.length;
      $('statBusy').textContent = A.agents.workers.filter(x => x.task).length;
      $('statQueue').textContent = st.queued;
      $('statDone').textContent = st.done;
      $('statClock').textContent = U.clock(Date.now());
      $('tabTasksCount').textContent = st.active + st.queued;
      $('tabInboxCount').textContent = A.tasks.deliverables.length;
      $('tabSkillsCount').textContent = A.registry.count;
      this.el.miniInfo.textContent = `${A.world.rooms.length} salas · ${A.world.W}×${A.world.H}`;
    }

    /* ---------- Tick ---------- */
    update(dt) {
      this._uiTimer -= dt;
      this._mmTimer -= dt;
      if (this._uiTimer <= 0) {
        this._uiTimer = 0.28;
        if (this.dirty.roster) { this.renderRoster(); this.dirty.roster = false; }
        else this.updateRoster();
        if (this.dirty.card) { this.renderCard(); this.dirty.card = false; }
        else this.updateCard();
        if (this.activeTab === 'tasks') {
          if (this.dirty.tasks) { this.renderTasks(); this.dirty.tasks = false; }
          else this.updateTasks();
        }
        if (this.activeTab === 'inbox' && this.dirty.inbox) { this.renderInbox(); this.dirty.inbox = false; }
        if (this.activeTab === 'skills' && this.dirty.skills) { this.renderSkills(); this.dirty.skills = false; }
        this.updateStats();
      }
      if (this._mmTimer <= 0) {
        this._mmTimer = 0.2;
        this.app.renderer.drawMinimap(this.el.minimap);
      }
    }

    drawAjoPortrait() {
      const boss = this.app.agents.boss;
      if (boss) drawPortrait($('ajoPortrait'), boss, 1.3);
    }
  }

  NAW.UI = UI;
  NAW.Sfx = Sfx;
  NAW.drawPortrait = drawPortrait;

/* ============================================================
   NETWORK AGENTS WORLD — Bootstrap / App
   Une todos los motores, corre el game loop, maneja input,
   persistencia y el pipeline de auto-detección de Skills.
   ============================================================ */
(function (global) {
  'use strict';
  const NAW = (global.NAW = global.NAW || {});
  const U = NAW.Utils, EV = NAW.EV;

  const SETTINGS_KEY = 'naw.settings.v1';
  const AGENTS_KEY = 'naw.agents.v1';

  class App {
    constructor() {
      this.bus = NAW.Events;
      this.speed = 1;
      this.speeds = [1, 2, 4];
      this.speedIdx = 0;
      this.last = 0;
      this.running = false;
    }

    /* ============ BOOT ============ */
    boot() {
      const settings = U.store.get(SETTINGS_KEY, {});
      this.speedIdx = settings.speedIdx || 0;
      this.speed = this.speeds[this.speedIdx];

      // 1. Registro de Skills (persistido o semilla)
      this.registry = new NAW.SkillRegistry(this.bus);
      if (!this.registry.load()) {
        for (const s of NAW.SEED_SKILLS) this.registry.addSkill(Object.assign({ protected: true }, s), { silent: true });
      }

      // 2. Mundo
      this.world = new NAW.WorldEngine(this.bus);
      this.world.build(this.registry.list);

      // 3. Agentes
      this.agents = new NAW.AgentEngine(this.bus, this.world);
      this.agents.spawnBoss();
      for (const s of this.registry.list) this.agents.spawnFromSkill(s);
      this.agents.restore(U.store.get(AGENTS_KEY, null));

      // 4. Tareas
      this.tasks = new NAW.TaskEngine(this.bus, this.registry, this.agents);
      this.tasks.load();

      // 5. Don Ajo
      this.ajo = new NAW.DonAjo({
        bus: this.bus, registry: this.registry, agents: this.agents,
        tasks: this.tasks, world: this.world, app: this
      });

      // 6. Render + UI
      this.canvas = document.getElementById('world');
      this.renderer = new NAW.Renderer(this.canvas, { world: this.world, agents: this.agents, bus: this.bus });
      this.ui = new NAW.UI(this);
      this.ui.drawAjoPortrait();

      // 7. Eventos de crecimiento del corporativo
      this.bus.on(EV.SKILL_ADDED, ({ skill, silent }) => { if (!silent) this._onNewSkill(skill); });
      this.bus.on(EV.SKILL_REMOVED, () => this._rebuild());

      // 8. Input
      this._bindInput();

      // 9. Cámara inicial: dirección de Don Ajo
      const ceo = this.world.roomByKind('ceo');
      if (ceo) { this.renderer.centerOn(ceo.cxPx, ceo.cyPx + 70); }
      this.renderer.setZoom(settings.zoom || 1.9);
      this.renderer.cam.zoom = this.renderer.cam.targetZoom;

      // 10. Saludo
      this.ajo.greet();
      this.ui.sys('Bienvenido a NETWORK AGENTS WORLD · Cada Skill instalada = una oficina + un empleado.');
      this.ui.toast('🧄 <b>Don Ajo</b> tomó el control del corporativo', 'new', 5200);

      // 11. Autoguardado
      setInterval(() => this.save(), 12000);
      global.addEventListener('beforeunload', () => this.save());

      // 12. Loop
      this.running = true;
      this.last = performance.now();
      requestAnimationFrame(this._loop.bind(this));

      // API pública para integrar Skills reales
      NAW.app = this;
      NAW.addSkill = (raw) => this.installSkill(raw);
      NAW.detectNewSkills = () => this.registry.detectNewSkills();
      NAW.assign = (skillId, text) => this.tasks.create({ title: text, prompt: text, skillId });
      console.log('%c🧄 NETWORK AGENTS WORLD listo', 'color:#ffd166;font-weight:bold',
        '\nAPI: NAW.addSkill({id,name,category,keywords}) · NAW.detectNewSkills() · NAW.assign(skillId, texto)');
    }

    /* ============ Skills ============ */
    installSkill(raw) {
      const s = this.registry.addSkill(raw);
      if (!s) { this.ui.toast('Esa Skill ya está instalada', 'warn', 2400); return null; }
      this.registry.pushExternal({ id: s.id, name: s.name, category: s.category, description: s.description, keywords: s.keywords });
      return s;
    }

    installRandomDemoSkill() {
      const pending = NAW.DEMO_SKILLS.filter(s => !this.registry.has(U.slug(s.id)));
      if (!pending.length) { this.ui.toast('Ya instalaste todas las skills de demo', 'info', 2600); return; }
      const pick = U.pick(pending);
      // Simula una instalación externa: el detector la encontrará solo
      this.registry.pushExternal(pick);
      this.ui.toast('📦 Instalando Skill externa… el detector la encontrará en segundos', 'info', 3000);
      setTimeout(() => this.registry.detectNewSkills(), 900);
    }

    _onNewSkill(skill) {
      this._rebuild();
      const agent = this.agents.spawnFromSkill(skill);
      this.ui.dirty.roster = true;
      this.ui.dirty.skills = true;
      if (agent) {
        this.renderer.focusAgent(agent, 2.6);
        setTimeout(() => { if (this.renderer.follow === agent) this.renderer.follow = null; }, 3800);
        agent.say('¡Nuevo en el corporativo!', 4);
        this.renderer.burst(agent.x, agent.y, 'confetti');
      }
      this.save();
    }

    _rebuild() {
      const changed = this.world.build(this.registry.list);
      if (changed) {
        this.renderer.clearCache();
        this.agents.rehomeAll();
      }
      return changed;
    }

    /* ============ Interacción ============ */
    selectAgent(id, showCard) {
      this.agents.select(id);
      if (showCard) this.ui.dirty.card = true;
    }

    fitView() {
      const w = this.world, R = this.renderer;
      R.updateInsets();
      const z = Math.min(R.safeW / (w.pxW + 60), R.safeH / (w.pxH + 60));
      R.follow = null;
      R.centerOn(w.pxW / 2, w.pxH / 2);
      R.setZoom(U.clamp(z, 0.12, 5));
    }

    cycleSpeed() {
      this.speedIdx = (this.speedIdx + 1) % this.speeds.length;
      this.speed = this.speeds[this.speedIdx];
      this.save();
      return this.speed;
    }

    hardReset() {
      U.store.del(SETTINGS_KEY);
      U.store.del(AGENTS_KEY);
      this.registry.reset();
      this.tasks.reset();
      location.reload();
    }

    save() {
      this.registry.save();
      this.tasks.save();
      U.store.set(AGENTS_KEY, this.agents.snapshot());
      U.store.set(SETTINGS_KEY, { speedIdx: this.speedIdx, zoom: this.renderer.cam.targetZoom });
    }

    /* ============ Input ============ */
    _bindInput() {
      const cv = this.canvas, R = this.renderer;
      const pointers = new Map();
      let dragging = false, moved = 0, lastX = 0, lastY = 0, pinchDist = 0;

      const hint = document.getElementById('worldHint');
      const killHint = () => { if (hint) { hint.classList.add('gone'); setTimeout(() => hint.remove(), 800); } };
      setTimeout(killHint, 12000);

      cv.addEventListener('pointerdown', (e) => {
        cv.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 1) {
          dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
          cv.classList.add('dragging');
        } else if (pointers.size === 2) {
          const [a, b] = Array.from(pointers.values());
          pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
        }
      });

      cv.addEventListener('pointermove', (e) => {
        const rect = cv.getBoundingClientRect();
        if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pointers.size === 2) {
          const [a, b] = Array.from(pointers.values());
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (pinchDist > 0) {
            const f = d / pinchDist;
            R.cam.targetZoom = U.clamp(R.cam.targetZoom * f, 0.12, 5);
            R.cam.zoom = R.cam.targetZoom;
          }
          pinchDist = d;
          return;
        }

        if (dragging) {
          const dx = e.clientX - lastX, dy = e.clientY - lastY;
          moved += Math.abs(dx) + Math.abs(dy);
          if (moved > 4) { R.panBy(dx, dy); killHint(); }
          lastX = e.clientX; lastY = e.clientY;
        } else {
          const p = R.screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
          R.hover = this.agents.nearestAgent(p.x, p.y - 8, 14);
          cv.style.cursor = R.hover ? 'pointer' : 'grab';
        }
      });

      const endPointer = (e) => {
        const rect = cv.getBoundingClientRect();
        if (dragging && moved <= 4 && pointers.size === 1) {
          const p = R.screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
          const a = this.agents.nearestAgent(p.x, p.y - 8, 16);
          if (a) {
            this.selectAgent(a.id, true);
            NAW.Sfx.blip(660, 0.05);
            R.burst(a.x, a.y - 10, 'spark');
          } else {
            const room = this.world.roomAtTile(Math.floor(p.x / 16), Math.floor(p.y / 16));
            if (room && room.skillId) {
              const ag = this.agents.forSkill(room.skillId);
              if (ag) this.selectAgent(ag.id, true);
            } else this.agents.select(null);
          }
          killHint();
        }
        pointers.delete(e.pointerId);
        if (pointers.size === 0) { dragging = false; cv.classList.remove('dragging'); pinchDist = 0; }
      };
      cv.addEventListener('pointerup', endPointer);
      cv.addEventListener('pointercancel', (e) => { pointers.delete(e.pointerId); dragging = false; cv.classList.remove('dragging'); });

      cv.addEventListener('dblclick', (e) => {
        const rect = cv.getBoundingClientRect();
        const p = R.screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
        const a = this.agents.nearestAgent(p.x, p.y - 8, 18);
        if (a) { this.selectAgent(a.id, true); R.focusAgent(a, 3.2); }
      });

      cv.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = cv.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const before = R.screenToWorld(mx, my);
        const f = e.deltaY < 0 ? 1.16 : 1 / 1.16;
        R.follow = null;
        R.cam.targetZoom = U.clamp(R.cam.targetZoom * f, 0.12, 5);
        R.cam.zoom = R.cam.targetZoom;
        const after = R.screenToWorld(mx, my);
        R.cam.x += before.x - after.x;
        R.cam.y += before.y - after.y;
        killHint();
      }, { passive: false });

      global.addEventListener('resize', U.throttle(() => R.resize(), 120));

      global.addEventListener('keydown', (e) => {
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea') {
          if (e.key === 'Escape') e.target.blur();
          return;
        }
        const step = 40 / R.cam.zoom * 4;
        switch (e.key) {
          case 'ArrowLeft': case 'a': R.follow = null; R.cam.x -= step; break;
          case 'ArrowRight': case 'd': R.follow = null; R.cam.x += step; break;
          case 'ArrowUp': case 'w': R.follow = null; R.cam.y -= step; break;
          case 'ArrowDown': case 's': R.follow = null; R.cam.y += step; break;
          case '+': case '=': R.zoomBy(1.25); break;
          case '-': case '_': R.zoomBy(1 / 1.25); break;
          case 'f': case 'F': this.fitView(); break;
          case 'Escape': this.agents.select(null); break;
          case 'Enter': document.getElementById('chatInput').focus(); e.preventDefault(); break;
          case ' ': {
            const sel = this.agents.selected;
            if (sel) R.focusAgent(sel, 3);
            e.preventDefault();
            break;
          }
          case 'h': case 'H': document.body.classList.toggle('ui-hidden'); break;
        }
      });
    }

    /* ============ Loop ============ */
    _loop(ts) {
      if (!this.running) return;
      const dtRaw = Math.min(0.05, Math.max(0, (ts - this.last) / 1000));
      this.last = ts;
      const dt = dtRaw * this.speed;

      this.registry.tick(dt);
      this.agents.update(dt);
      this.tasks.update(dt);
      this.renderer.update(dtRaw);
      this.renderer.render(dt);
      this.ui.update(dtRaw);
      this.bus.emit(EV.TICK, { dt });

      requestAnimationFrame(this._loop.bind(this));
    }
  }

  function start() {
    const app = new App();
    try { app.boot(); }
    catch (err) {
      console.error(err);
      document.body.insertAdjacentHTML('beforeend',
        `<div style="position:fixed;inset:20px;background:#12172a;border:2px solid #ff5a5f;color:#fff;
         padding:16px;font-family:monospace;z-index:999;overflow:auto">
         <b>Error al iniciar NETWORK AGENTS WORLD</b><br><pre>${U.escapeHtml(err.stack || err.message)}</pre></div>`);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})(window);

   <script>
(function(){
  let ctx = null, nextNoteTime = 0, timer = null, step = 0;
  const BPM = 96, beat = 60 / BPM;
  const bass = [130.81, 146.83, 164.81, 146.83];
  const pad  = [261.63, 293.66, 329.63, 293.66];

  function ac(){
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function note(freq, time, dur, type, vol){
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(vol, time + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g); g.connect(c.destination);
    o.start(time); o.stop(time + dur + 0.05);
  }

  function musicMuted(){
    return window.NAW && NAW.Sfx && NAW.Sfx.on === false;
  }

  function scheduler(){
    const c = ac(); if (!c || musicMuted()) return;
    while (nextNoteTime < c.currentTime + 0.4) {
      note(bass[step % bass.length], nextNoteTime, beat * 0.9, 'triangle', 0.05);
      note(pad[step % pad.length], nextNoteTime, beat * 1.8, 'sine', 0.025);
      nextNoteTime += beat;
      step++;
    }
  }

  function startMusic(){
    const c = ac(); if (!c || timer) return;
    nextNoteTime = c.currentTime + 0.1;
    timer = setInterval(scheduler, 100);
  }

  function unlock(){
    startMusic();
    window.removeEventListener('pointerdown', unlock);
  }
  window.addEventListener('pointerdown', unlock);
})();

(function(){
  let ctx = null, timer = null, started = false, chordIdx = 0;
  const CHORDS = [
    [220.00, 261.63, 329.63, 392.00], // Am7
    [174.61, 220.00, 261.63, 349.23], // Fmaj7
    [130.81, 164.81, 196.00, 261.63], // C
    [196.00, 246.94, 293.66, 392.00]  // G
  ];

  function ac(){
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function musicMuted(){
    return window.NAW && NAW.Sfx && NAW.Sfx.on === false;
  }

  function playChord(freqs, time, dur){
    const c = ac(); if (!c) return;
    freqs.forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = i === 0 ? 'sine' : 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(0.028, time + 2);
      g.gain.linearRampToValueAtTime(0.028, time + dur - 3);
      g.gain.linearRampToValueAtTime(0, time + dur);
      o.connect(g); g.connect(c.destination);
      o.start(time); o.stop(time + dur + 0.2);
    });
  }

  function loop(){
    const c = ac();
    if (!c || musicMuted()) { timer = setTimeout(loop, 1000); return; }
    const dur = 16;
    playChord(CHORDS[chordIdx % CHORDS.length], c.currentTime + 0.05, dur);
    chordIdx++;
    timer = setTimeout(loop, dur * 1000);
  }

  function start(){ if (started) return; started = true; loop(); }

  function unlock(){ start(); window.removeEventListener('pointerdown', unlock); }
  window.addEventListener('pointerdown', unlock);
})();

(function(){

    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target !== canvas) return;

      app.selectAgent(a.id, true);

   <script>
(function(){
  const tryInit = setInterval(() => {
    if (!(window.NAW && NAW.app && NAW.app.renderer && NAW.app.agents && NAW.app.canvas && NAW.app.world && NAW.FLOOR)) return;
    clearInterval(tryInit);
    const app = NAW.app, R = app.renderer, canvas = app.canvas, W = app.world;

    const layer = document.createElement('div');
    layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden;';
    document.body.appendChild(layer);

    function popup(agent, text, color, riseY){
      const p = R.worldToScreen(agent.x, agent.y - 30);
      const el = document.createElement('div');
      el.textContent = text;
      el.style.cssText = `position:absolute;left:${p.x}px;top:${p.y}px;transform:translate(-50%,0);
        font-family:ui-monospace,monospace;font-weight:700;font-size:13px;color:${color};
        text-shadow:2px 2px 0 #000;transition:transform 1.5s ease-out, opacity 1.5s ease-out;`;
      layer.appendChild(el);
      requestAnimationFrame(() => {
        el.style.transform = `translate(-50%,0) translateY(-${riseY || 26}px)`;
        el.style.opacity = '0';
      });
      setTimeout(() => el.remove(), 1600);
    }

    let dragAgent = null, activePointerId = null;
    function worldPointFromEvent(e){
      const rect = canvas.getBoundingClientRect();
      return R.screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
    }
    function tileAt(x, y){ return { x: Math.floor(x / W.TILE), y: Math.floor(y / W.TILE) }; }
    function isOnDanceFloor(wx, wy){
      const t = tileAt(wx, wy);
      if (t.x < 0 || t.y < 0 || t.x >= W.W || t.y >= W.H) return false;
      return W.floor[t.y * W.W + t.x] === NAW.FLOOR.DANCE;
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target !== canvas) return;
      const p = worldPointFromEvent(e);
      const a = app.agents.nearestAgent(p.x, p.y - 8, 16);
      if (!a) return;
      dragAgent = a; activePointerId = e.pointerId;
      a.releaseSpot(); a.frozen = true; a.path = null; a.after = null;
      app.selectAgent(a.id, true);
      canvas.style.cursor = 'grabbing';
      e.stopPropagation(); e.preventDefault();
    }, true);

    window.addEventListener('pointermove', (e) => {
      if (!dragAgent || e.pointerId !== activePointerId) return;
      const p = worldPointFromEvent(e);
      dragAgent.x = p.x; dragAgent.y = p.y;
      e.stopPropagation();
    }, true);

    function release(e){
      if (!dragAgent || e.pointerId !== activePointerId) return;
      const a = dragAgent;
      dragAgent = null; activePointerId = null;
      a.frozen = false;
      canvas.style.cursor = 'grab';
      if (isOnDanceFloor(a.x, a.y)) {
        a.setState('dance', 999);
        registerDancer(a);
      } else {
        a.setState('idle');
        a.idleTimer = 1 + Math.random() * 2;
      }
      e.stopPropagation();
    }
    window.addEventListener('pointerup', release, true);
    window.addEventListener('pointercancel', release, true);

    const MOVES = ['¡Moonwalk!', '¡Robot!', '¡Spin!', '¡Break!', '¡Sabor!', '¡Combo!', '¡Flow!', '¡Estilo libre!'];
    const waitingFloor = [];
    let battling = false;

    function registerDancer(agent){
      if (battling) return;
      if (waitingFloor.includes(agent)) return;
      waitingFloor.push(agent);
      if (waitingFloor.length >= 2) {
        const a = waitingFloor.shift();
        const b = waitingFloor.shift();
        runBattle(a, b);
      }
    }

    function runBattle(a, b){
      battling = true;
      app.ajo.speak(`¡Batalla de baile! ${a.name} vs ${b.name}. 5 rondas, que gane el mejor. 🕺💃`);
      let round = 0;
      function nextTurn(){
        if (round >= 5) return finish();
        const turnAgent = round % 2 === 0 ? a : b;
        const move = MOVES[Math.floor(Math.random() * MOVES.length)];
        popup(turnAgent, move, '#4cc9f0', 22);
        turnAgent.say(move, 1.4);
        app.renderer.burst(turnAgent.x, turnAgent.y - 10, 'spark');
        round++;
        setTimeout(nextTurn, 900);
      }
      function finish(){
        const winner = Math.random() < 0.5 ? a : b;
        const loser = winner === a ? b : a;
        popup(winner, '+10,000 AURA', '#ffd166', 34);
        popup(loser, '-500 AURA', '#ff5a5f', 34);
        app.renderer.burst(winner.x, winner.y - 14, 'confetti');
        app.ajo.speak(`¡${winner.name} se llevó la batalla! +10,000 de aura. ${loser.name}, la próxima será. 😅`);
        [a, b].forEach(ag => { ag.releaseSpot(); ag.setState('idle'); ag.idleTimer = 1 + Math.random() * 3; });
        battling = false;
      }
      nextTurn();
    }
  }, 200);
})();
</script>

(function(){
  const tryInit = setInterval(() => {
    if (!(window.NAW && NAW.app && NAW.app.tasks && NAW.app.registry && NAW.EV && NAW.Events)) return;
    if (!NAW.app.registry.has('publicador-multicuenta')) return; // espera a que existan los 9 departamentos
    clearInterval(tryInit);
    const app = NAW.app;

    const CHAIN = [
      'imagen-de-la-marca',
      'generadora-de-ideas',
      'copywriter',
      'escritor-de-prompts',
      'generador-de-trial-reels',
      'editor-de-capcut',
      'planificador-de-contenido',
      'recepcionista',
      'publicador-multicuenta'
    ];
    const LABELS = ['Archivo', 'Planning', 'Redacción', 'Realización', 'Laboratorio', 'Post', 'Tráfico', 'Cuentas', 'Medios'];

    function startPipeline(topic){
      const first = CHAIN[0];
      if (!app.registry.has(first)) { app.ui.toast('Falta el departamento de Archivo', 'warn'); return; }
      const task = app.tasks.create({
        title: `[Cadena 1/9] ${LABELS[0]}: ${topic || 'contenido nuevo'}`,
        prompt: topic || 'Arranca la cadena de producción',
        skillId: first
      });
      if (task) task._chain = { step: 0, topic: topic || 'contenido nuevo' };
    }

    NAW.Events.on(NAW.EV.TASK_DONE, ({ task }) => {
      if (!task._chain) return;
      const nextStep = task._chain.step + 1;
      if (nextStep >= CHAIN.length) {
        app.ajo.speak(`✅ ¡Cadena completa! "${task._chain.topic}" ya quedó publicada en las tres redes.`);
        return;
      }
      const nextSkillId = CHAIN[nextStep];
      if (!app.registry.has(nextSkillId)) return;
      const nextTask = app.tasks.create({
        title: `[Cadena ${nextStep + 1}/9] ${LABELS[nextStep]}: ${task._chain.topic}`,
        prompt: `Continúa la cadena para: ${task._chain.topic}. Entregable anterior: ${task.deliverable || task.title}`,
        skillId: nextSkillId
      });
      if (nextTask) nextTask._chain = { step: nextStep, topic: task._chain.topic };
    });

    const originalCommand = app.ajo._command.bind(app.ajo);
    app.ajo._command = function(raw){
      const [cmd, ...rest] = raw.trim().split(/\s+/);
      if (cmd.toLowerCase() === '/cadena') {
        const topic = rest.join(' ');
        if (!topic) return app.ajo.speak('Dime el tema así: /cadena Lanzamiento de producto nuevo');
        startPipeline(topic);
        return app.ajo.speak(`🎬 Arrancó la cadena para "${topic}": Archivo → Planning → Redacción → Realización → Laboratorio → Post → Tráfico → Cuentas → Medios.`);
      }
      return originalCommand(raw);
    };
  }, 200);
})();
</script>

(function(){
  const tryInit = setInterval(() => {
    if (!(window.NAW && NAW.app && NAW.Utils)) return;
    clearInterval(tryInit);
    const app = NAW.app, U = NAW.Utils;

    const rosterPanel = document.getElementById('rosterPanel');
    const panelHead = rosterPanel ? rosterPanel.querySelector('.panel-head') : null;
    if (!rosterPanel || !panelHead) return;

    const searchWrap = document.createElement('div');
    searchWrap.style.cssText = 'padding:6px 8px;border-bottom:1px solid #1b2237;position:relative;flex:0 0 auto;';
    searchWrap.innerHTML = `
      <input id="rosterSearchInput" type="text" placeholder="Buscar empleado o departamento…"
        style="width:100%;box-sizing:border-box;font-family:inherit;font-size:11px;color:#eaf0ff;
        background:#0a0e18;border:2px solid #2a3350;padding:6px 8px;outline:none;">
      <div id="rosterSearchResults" style="position:absolute;left:8px;right:8px;top:36px;z-index:50;
        background:#0d111e;border:2px solid #28324f;display:none;max-height:220px;overflow-y:auto;"></div>`;
    panelHead.insertAdjacentElement('afterend', searchWrap);

    const input = document.getElementById('rosterSearchInput');
    const resultsBox = document.getElementById('rosterSearchResults');

    function matches(agent, q){
      const dept = agent.skillId ? ((app.registry.get(agent.skillId) || {}).name || '') : 'Dirección';
      const hay = U.norm(agent.name + ' ' + (agent.fullName || '') + ' ' + (agent.title || '') + ' ' + dept);
      return hay.includes(q);
    }

    function focusAgent(agent){
      app.selectAgent(agent.id, true);
      app.renderer.focusAgent(agent, 3);
      resultsBox.style.display = 'none';
      input.value = agent.name;
    }

    function renderResults(list){
      if (!list.length) { resultsBox.style.display = 'none'; return; }
      resultsBox.innerHTML = list.slice(0, 12).map(a => {
        const dept = a.skillId ? ((app.registry.get(a.skillId) || {}).name || '') : 'Dirección';
        return `<div class="rs-item" data-id="${a.id}" style="padding:6px 8px;cursor:pointer;font-size:10.5px;
          border-bottom:1px solid #1b2237;display:flex;justify-content:space-between;gap:6px;">
          <span style="color:${a.color}">●</span>
          <span style="flex:1;color:#eaf0ff;">${U.escapeHtml(a.name)}</span>
          <span style="color:#8d99b8;">${U.escapeHtml(dept)}</span>
        </div>`;
      }).join('');
      resultsBox.style.display = 'block';
      resultsBox.querySelectorAll('.rs-item').forEach(el => {
        el.addEventListener('mouseenter', () => el.style.background = '#1a2237');
        el.addEventListener('mouseleave', () => el.style.background = '');
        el.addEventListener('click', () => {
          const agent = app.agents.get(el.dataset.id);
          if (agent) focusAgent(agent);
        });
      });
    }

    input.addEventListener('input', () => {
      const q = U.norm(input.value.trim());
      if (!q) { resultsBox.style.display = 'none'; return; }
      renderResults(app.agents.agents.filter(a => matches(a, q)));
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const q = U.norm(input.value.trim());
        if (!q) return;
        const list = app.agents.agents.filter(a => matches(a, q));
        if (list.length) focusAgent(list[0]);
      } else if (e.key === 'Escape') {
        resultsBox.style.display = 'none';
        input.blur();
      }
    });

    document.addEventListener('click', (e) => {
      if (!searchWrap.contains(e.target)) resultsBox.style.display = 'none';
    });
  }, 200);
})();
</script>
