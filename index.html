      bus.on(EV.TASK_DONE, ({ task, agent }) => this._onDone(task, agent));
      bus.on(EV.TASK_FAILED, ({ task }) => { task.attempts = (task.attempts || 1) + 1; });
    }

    get active() { return this.tasks.filter(t => ['queued', 'walking', 'working', 'retry'].includes(t.status)); }
    get completed() { return this.tasks.filter(t => t.status === 'done'); }

    /**
     * Crea una tarea y la despacha.
     * @param {object} o {title, prompt, skillId, priority}
     */
    create(o) {
      const skill = this.registry.get(o.skillId);
      if (!skill) return null;
      const cat = skill.category || 'generic';
      const steps = (N.workSteps[cat] || N.workSteps.generic).slice();
      const baseDur = 14 + Math.random() * 10;
      const task = {
        id: 'task_' + (++this.counter) + '_' + Math.floor(Math.random() * 1e4).toString(36),
        num: this.counter,
        title: U.truncate(o.title || o.prompt || 'Pendiente', 70),
        prompt: o.prompt || o.title || '',
        skillId: skill.id,
        skillName: skill.name,
        color: skill.color,
        category: cat,
        steps,
        currentStep: 0,
        duration: baseDur / this.speed,
        progress: 0,
        status: 'queued',
        agentId: null,
        agentName: null,
        attempts: 1,
        createdAt: Date.now(),
        startedAt: null,
        finishedAt: null,
        deliverable: null,
        source: o.source || 'don-ajo'
      };
      this.tasks.push(task);
      this.bus.emit(EV.TASK_CREATED, { task });
      this._dispatch(task);
      return task;
    }

    _dispatch(task) {
      const agent = this.agents.forSkill(task.skillId);
      if (!agent) { task.status = 'queued'; this.queue.push(task); return; }
      if (agent.task) {
        task.status = 'queued';
        task.agentId = agent.id;
        task.agentName = agent.name;
        this.queue.push(task);
        return;
      }
      agent.assignTask(task);
    }

    update(dt) {
      if (!this.queue.length) return;
      for (let i = 0; i < this.queue.length; i++) {
        const t = this.queue[i];
        const agent = this.agents.forSkill(t.skillId);
        if (agent && !agent.task) {
          this.queue.splice(i, 1); i--;
          agent.assignTask(t);
        }
      }
    }

    queuedFor(skillId) { return this.queue.filter(t => t.skillId === skillId).length; }

    _onDone(task, agent) {
      task.deliverable = this.buildDeliverable(task, agent);
      const item = {
        id: 'dlv_' + task.id,
        taskId: task.id,
        title: task.title,
        agent: agent ? agent.name : '—',
        agentId: agent ? agent.id : null,
        skillName: task.skillName,
        color: task.color,
        body: task.deliverable,
        at: Date.now()
      };
      this.deliverables.unshift(item);
      if (this.deliverables.length > 60) this.deliverables.pop();
      this.bus.emit(EV.DELIVERABLE, { item, task, agent });
      this.save();
    }

    buildDeliverable(task, agent) {
      const cat = task.category || 'generic';
      const pool = N.deliverableTemplates[cat] || N.deliverableTemplates.generic;
      const rng = U.rngFor(task.id);
      const tpl = U.choice(rng, pool);
      const secs = Math.max(1, Math.round(((task.finishedAt || Date.now()) - (task.startedAt || Date.now())) / 1000));
      return tpl
        .replace(/\{title\}/g, task.title)
        .replace(/\{agent\}/g, agent ? agent.fullName : 'el equipo')
        .replace(/\{skill\}/g, task.skillName)
        .replace(/\{slug\}/g, U.slug(task.title).slice(0, 22) || 'entregable')
        .replace(/\{n1\}/g, String(U.randInt(rng, 18, 92)))
        .replace(/\{n2\}/g, String(U.randInt(rng, 3, 9)))
        .replace(/\{secs\}/g, String(secs));
    }

    cancel(taskId) {
      const t = this.tasks.find(x => x.id === taskId);
      if (!t || t.status === 'done') return false;
      t.status = 'cancelled';
      this.queue = this.queue.filter(x => x.id !== taskId);
      const agent = t.agentId ? this.agents.get(t.agentId) : null;
      if (agent && agent.task && agent.task.id === taskId) {
        agent.task = null;
        agent.setState('idle');
        agent.say('Cancelado, jefe', 2.5);
      }
      return true;
    }

    stats() {
      let done = 0, active = 0, queued = 0, failed = 0;
      for (const t of this.tasks) {
        if (t.status === 'done') done++;
        else if (t.status === 'queued') queued++;
        else if (t.status === 'cancelled') continue;
        else active++;
        if (t.attempts > 1) failed++;
      }
      return { done, active, queued, failed, total: this.tasks.length };
    }

    save() {
      const light = this.tasks.slice(-40).map(t => ({
        id: t.id, num: t.num, title: t.title, prompt: t.prompt, skillId: t.skillId,
        skillName: t.skillName, color: t.color, category: t.category, status: t.status,
        agentName: t.agentName, createdAt: t.createdAt, finishedAt: t.finishedAt,
        deliverable: t.deliverable
      }));
      U.store.set(STORE_KEY, { v: 1, counter: this.counter, tasks: light, deliverables: this.deliverables.slice(0, 25) });
    }

    load() {
      const d = U.store.get(STORE_KEY, null);
      if (!d) return false;
      this.counter = d.counter || 0;
      for (const t of (d.tasks || [])) {
        if (['queued', 'walking', 'working', 'retry'].includes(t.status)) t.status = 'cancelled';
        t.progress = t.status === 'done' ? 1 : 0;
        t.steps = N.workSteps[t.category] || N.workSteps.generic;
        this.tasks.push(t);
      }
      this.deliverables = d.deliverables || [];
      return true;
    }

    reset() { U.store.del(STORE_KEY); this.tasks = []; this.queue = []; this.deliverables = []; this.counter = 0; }
  }

  NAW.TaskEngine = TaskEngine;
})(window);

/* ===== js/engine/DonAjo.js ===== */
/* ============================================================
   NETWORK AGENTS WORLD — Don Ajo (CEO Brain)
   Un diente de ajo con traje y lentes oscuros que recibe las
   órdenes del usuario, las rutea a la Skill correcta y reporta
   resultados con personalidad de jefe godín mexicano.
   ============================================================ */
(function (global) {
  'use strict';
  const NAW = (global.NAW = global.NAW || {});
  const U = NAW.Utils, N = NAW.Names, EV = NAW.EV;

  const HELP = [
    'Así funciona el corporativo, patrón:',
    '• Pídeme cosas en español normal: "edítame un video para TikTok", "arma el calendario de la semana", "necesito 5 hooks".',
    '• Yo detecto la Skill correcta y mando al empleado a su escritorio.',
    '• Menciona a alguien por su nombre (ej. "Chuy, córtame el video") para asignárselo directo.',
    '• Comandos: /junta · /descanso · /trabajo · /agentes · /skills · /nueva <nombre> · /estado · /ayuda'
  ].join('\n');

  class DonAjo {
    constructor(ctx) {
      this.bus = ctx.bus;
      this.registry = ctx.registry;
      this.agents = ctx.agents;
      this.tasks = ctx.tasks;
      this.world = ctx.world;
      this.app = ctx.app;
      this.history = [];
      this.rng = Math.random;

      this.bus.on(EV.TASK_DONE, ({ task, agent }) => {
        const line = U.pick(N.donAjo.done)
          .replace('{agent}', agent ? agent.name : 'el equipo')
          .replace('{title}', '“' + U.truncate(task.title, 42) + '”');
        this.speak(line, { taskId: task.id });
      });
      this.bus.on(EV.TASK_FAILED, ({ task, agent, retry }) => {
        if (!retry) return;
        const line = U.pick(N.donAjo.failed)
          .replace('{agent}', agent ? agent.name : 'el equipo')
          .replace('{title}', '“' + U.truncate(task.title, 40) + '”');
        this.speak(line, { warn: true });
      });
      this.bus.on(EV.SKILL_DETECTED, ({ skill }) => {
        this.speak(`¡Ey! Detecté una Skill nueva: ${skill.name}. Ya le abrí oficina y contraté a ${skill.agent.nick} (${skill.agent.title}). Bienvenido al corporativo. 🧄`);
      });
    }

    greet() {
      this.speak(U.pick(N.donAjo.greetings));
      this.speak(`Tengo ${this.registry.count} departamento(s) operando. Escribe /ayuda si quieres el manual del godín.`, { muted: true });
    }

    speak(text, meta = {}) {
      const msg = Object.assign({ from: 'ajo', name: 'Don Ajo', text, t: Date.now() }, meta);
      this.history.push(msg);
      this.bus.emit(EV.CHAT_MESSAGE, msg);
      const boss = this.agents.boss;
      if (boss && !meta.muted) boss.say(U.truncate(text.split('\n')[0], 44), 4);
      return msg;
    }

    speakAs(agent, text) {
      const msg = { from: 'agent', name: agent.name, color: agent.color, text, t: Date.now(), agentId: agent.id };
      this.history.push(msg);
      this.bus.emit(EV.CHAT_MESSAGE, msg);
      agent.say(U.truncate(text, 40), 4);
      return msg;
    }

    userSays(text) {
      text = String(text || '').trim();
      if (!text) return;
      const msg = { from: 'user', name: 'Tú', text, t: Date.now() };
      this.history.push(msg);
      this.bus.emit(EV.CHAT_MESSAGE, msg);
      setTimeout(() => this.process(text), 260 + Math.random() * 320);
    }

    /* ---------------- Núcleo de decisión ---------------- */
    process(text) {
      const t = U.norm(text);

      // ----- comandos -----
      if (text.startsWith('/')) return this._command(text);

      // ----- intents conversacionales -----
      if (/^(hola|buenas|que onda|qué onda|hey|holi|buenos dias|buenas tardes)\b/.test(t)) {
        return this.speak(U.pick([
          '¡Qué onda, patrón! Aquí firmes. ¿Qué pendiente le caemos?',
          'Buenas, mi buen. El equipo ya está en sus lugares. ¿Qué necesitas?',
          'A sus órdenes. Nomás dígame y le muevo al organigrama.'
        ]));
      }
      if (/\b(ayuda|help|manual|como funciona|qué puedes|que puedes)\b/.test(t)) return this.speak(HELP);
      if (/\b(junta|reunion|reunión|all hands|meeting)\b/.test(t)) return this._meeting();
      if (/\b(descanso|break|relaj|coffee break|pausa)\b/.test(t)) return this._break();
      if (/\b(a trabajar|todos a chambear|a chambear|a sus lugares|de vuelta al trabajo)\b/.test(t)) return this._backToWork();
      if (/\b(quien|quién|equipo|empleados|agentes|plantilla|organigrama)\b/.test(t) && /\b(hay|tienes|somos|son|esta|está|libre|disponible)\b/.test(t)) return this._roster();
      if (/\b(estado|status|como va|cómo va|reporte|avance)\b/.test(t)) return this._status();
      if (/\b(gracias|grax|thank)\b/.test(t)) return this.speak(U.pick(['De nada, patrón. Para eso estamos.', 'Sale y vale. Aquí seguimos.', 'Nomás no me deje sin café. 😎']));
      if (/\b(nueva skill|instala|agrega skill|nuevo departamento|contrata)\b/.test(t)) return this._suggestNewSkill(text);

      // ----- ruteo a skills -----
      const matches = this.registry.match(text);
      if (!matches.length || matches[0].score < 3) {
        return this._fallback(text, matches);
      }

      // ¿doble encargo? ("edita el video y escribe el copy")
      const dispatched = [];
      const primary = matches[0];
      dispatched.push(primary.skill);
      if (matches[1] && matches[1].score >= Math.max(4, primary.score * 0.65) && /\by\b|\btambien\b|\btambién\b|,|\+/.test(t)) {
        dispatched.push(matches[1].skill);
      }

      for (const skill of dispatched) {
        this._assign(skill, text, dispatched.length > 1);
      }
    }

    _assign(skill, text, shared) {
      const agent = this.agents.forSkill(skill.id);
      const task = this.tasks.create({
        title: this._titleFrom(text, skill),
        prompt: text,
        skillId: skill.id
      });
      if (!task) return;
      let line;
      if (agent && agent.task && agent.task.id !== task.id) {
        line = U.pick(N.donAjo.busy).replace('{agent}', agent.name).replace('{title}', skill.name);
      } else {
        line = U.pick(N.donAjo.dispatch)
          .replace('{agent}', agent ? agent.name : skill.agent.nick)
          .replace('{title}', skill.agent.title);
      }
      this.speak(line + (shared ? ` (parte de ${skill.name})` : ''), { skillId: skill.id, taskId: task.id });
      const boss = this.agents.boss;
      if (boss && !boss.task) { boss.setState('phone', 4.5); }   // el jefe "marca" al empleado
      if (agent) {
        setTimeout(() => {
          if (agent.task && agent.task.id === task.id) this.speakAs(agent, U.pick([
            'Va, ya lo tengo. ' + (agent.catchphrase || ''),
            'Recibido, jefe. Me pongo ahorita.',
            'Sale. Le doy en un ratito el entregable.'
          ]).trim());
        }, 900 + Math.random() * 800);
      }
    }

    _titleFrom(text, skill) {
      let t = text.replace(/^(oye|hey|porfa|por favor|necesito que|necesito|quiero que|quiero|puedes|podrias|podrías|hazme|hazle|dile a \w+ que|@\w+)\s*/i, '');
      t = t.replace(/\s+/g, ' ').trim();
      if (t.length < 4) t = skill.name + ': pendiente rápido';
      return U.titleCase(t.slice(0, 1)) + t.slice(1);
    }

    _fallback(text, matches) {
      const t = U.norm(text);
      if (/\?$/.test(text.trim()) || /^(que|qué|como|cómo|cuando|cuándo|donde|dónde|por que|por qué|cual|cuál)\b/.test(t)) {
        return this.speak(U.pick([
          'Buena pregunta, patrón. Yo soy más de repartir chamba que de filosofar, pero cuénteme qué necesita y lo aterrizo con el equipo.',
          'Mmm. Deme un poquito más de contexto y le asigno al indicado.',
          U.pick(N.donAjo.chatter) + ' ¿Le caemos a algún pendiente?'
        ]));
      }
      if (matches.length) {
        const s = matches[0].skill;
        return this.speak(`No estoy seguro, ¿esto es chamba de ${s.agent.nick} (${s.name})? Si sí, dígame "sí" o menciónelo por nombre.`, { suggestSkill: s.id });
      }
      return this.speak(U.pick(N.donAjo.noSkill));
    }

    /* ---------------- Comandos ---------------- */
    _command(raw) {
      const [cmd, ...rest] = raw.trim().split(/\s+/);
      const arg = rest.join(' ');
      switch (U.norm(cmd)) {
        case '/ayuda': case '/help': return this.speak(HELP);
        case '/junta': case '/meeting': return this._meeting();
        case '/descanso': case '/break': return this._break();
        case '/trabajo': case '/chamba': return this._backToWork();
        case '/agentes': case '/team': return this._roster();
        case '/skills': return this._skills();
        case '/estado': case '/status': return this._status();
        case '/nueva': case '/skill':
          if (!arg) return this.speak('Dime el nombre: /nueva Podcast Editor');
          return this._createSkill(arg);
        case '/limpiar': case '/clear':
          this.history = [];
          this.bus.emit('chat:clear', {});
          return this.speak('Pizarrón limpio, patrón.');
        default:
          return this.speak('Ese comando no lo traigo en el manual. Prueba /ayuda.');
      }
    }

    _meeting() {
      const ok = this.agents.startMeeting(24);
      return this.speak(ok ? U.pick(N.donAjo.meeting) : 'Ya estamos en junta, patrón. Paciencia.');
    }
    _break() {
      this.agents.allTo('break', 'coffee', 14);
      return this.speak('¡Aguas! Break oficial. Todos a la sala de descanso, se lo ganaron. ☕');
    }
    _backToWork() {
      this.agents.allToDesks();
      return this.speak('Se acabó el recreo. Todos a sus escritorios, que el contenido no se hace solo.');
    }
    _roster() {
      const lines = this.agents.workers.map(a => {
        const st = a.task ? `⚙ ocupado con “${U.truncate(a.task.title, 26)}”` : a.stateLabel.toLowerCase();
        return `• ${a.name} — ${a.title} · ${st}`;
      });
      return this.speak('Mi gente:\n' + (lines.join('\n') || 'Todavía no contrato a nadie.'));
    }
    _skills() {
      const lines = this.registry.list.map(s => `• ${s.name} (${s.category}) → ${s.agent.nick}`);
      return this.speak(`Skills instaladas (${this.registry.count}):\n` + lines.join('\n'));
    }
    _status() {
      const st = this.tasks.stats();
      const busy = this.agents.workers.filter(a => a.task).length;
      return this.speak(
        `Reporte del corporativo:\n• Empleados: ${this.agents.workers.length} (${busy} chambeando)\n` +
        `• Tareas activas: ${st.active} · en cola: ${st.queued}\n• Entregadas: ${st.done}\n` +
        `• Departamentos: ${this.registry.count}`
      );
    }
    _suggestNewSkill(text) {
      const m = text.match(/(?:skill|departamento|contrata(?:r)?)\s+(?:de\s+|para\s+|llamad[ao]\s+)?["“']?([\w\sáéíóúñ-]{3,40})/i);
      if (m) return this._createSkill(m[1].trim());
      return this.speak('Va. Dime el nombre así: /nueva Podcast Editor — y te abro la oficina al instante.');
    }
    _createSkill(name) {
      const id = U.slug(name);
      if (this.registry.has(id)) return this.speak(`Ese departamento ya existe, patrón (${name}).`);
      this.registry.pushExternal({ id, name: U.titleCase(name) });
      const found = this.registry.detectNewSkills();
      if (!found.length) return this.speak('No pude dar de alta esa skill, revisa el nombre.');
      return null; // el evento SKILL_DETECTED ya anuncia la contratación
    }
  }

  NAW.DonAjo = DonAjo;
})(window);

/* ===== js/render/Sprites.js ===== */
/* ============================================================
   NETWORK AGENTS WORLD — Sprites
   Todo el pixel-art se dibuja por código (sin assets externos):
   personajes godín, Don Ajo (ajo con traje y lentes oscuros),
   mobiliario de oficina, arcades, cafetería y break room.
   ============================================================ */
(function (global) {
  'use strict';
  const NAW = (global.NAW = global.NAW || {});
  const U = NAW.Utils;
  const T = 16;

  /* helper: pixel rect */
  function R(ctx, x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

  const DARK = '#1b1b26';

  /* ============================================================
     PERSONAJES
     ============================================================ */
  const SIT_STATES = { sit: 1, work: 1, eat: 1, sleep: 1 };

  function isSitting(a) {
    if (a.state === 'game' && a.targetSpot && a.targetSpot.type === 'game') return false;
    return !!SIT_STATES[a.state];
  }

  function drawAgent(ctx, a, time) {
    const x = Math.round(a.x), y = Math.round(a.y);
    ctx.save();
    ctx.translate(x, y);
    const s = a.isBoss ? 1.15 : 1;
    if (s !== 1) ctx.scale(s, s);

    // sombra
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.ellipse(0, 1, 6, 2.4, 0, 0, Math.PI * 2);
    ctx.fill();

    if (a.look && a.look.kind === 'garlic') drawGarlicBoss(ctx, a, time);
    else drawHuman(ctx, a, time);

    ctx.restore();
  }

  function poseOf(a, time) {
    const st = a.state;
    const t = a.animT;
    const sitting = isSitting(a);
    let bob = 0, legPhase = 0, lean = 0, shake = 0;
    if (st === 'walk') {
      legPhase = Math.sin(t * 9);
      bob = Math.abs(Math.sin(t * 9)) > 0.6 ? -1 : 0;
    } else if (st === 'dance') {
      bob = Math.sin(t * 8) > 0 ? -2 : 0;
      lean = Math.sin(t * 4) * 1.5;
    } else if (st === 'error') {
      shake = Math.sin(t * 30) * 1.2;
    } else if (st === 'success') {
      bob = -Math.abs(Math.sin(t * 7)) * 3;
    } else if (st === 'sleep') {
      bob = Math.sin(t * 1.2) * 0.6 + 1;
    } else {
      bob = Math.sin(t * 2 + (a.id.length % 7)) * 0.5;
    }
    return { bob, legPhase, lean, shake, sitting };
  }

  function drawHuman(ctx, a, time) {
    const L = a.look || {};
    const skin = L.skin || '#e0a878';
    const skinD = U.shade(skin, -0.22);
    const hair = L.hair || '#2b1b12';
    const shirt = L.shirt || '#3d5a80';
    const shirtD = U.shade(shirt, -0.25);
    const pants = L.pants || '#2b2d42';
    const facing = a.facing;
    const p = poseOf(a, time);

    ctx.save();
    ctx.translate(Math.round(p.shake + p.lean), 0);

    const baseY = -20 + (p.sitting ? 4 : 0) + Math.round(p.bob);
    const ox = -6;

    /* ---- piernas ---- */
    if (p.sitting) {
      R(ctx, ox + 3, baseY + 14, 3, 3, pants);
      R(ctx, ox + 7, baseY + 14, 3, 3, pants);
      R(ctx, ox + 2, baseY + 17, 4, 2, U.shade(pants, -0.3));
      R(ctx, ox + 7, baseY + 17, 4, 2, U.shade(pants, -0.3));
    } else {
      const off = a.state === 'walk' ? Math.round(p.legPhase * 1.6) : 0;
      R(ctx, ox + 3, baseY + 14, 3, 5 - Math.abs(off), pants);
      R(ctx, ox + 6, baseY + 14, 3, 5 - Math.abs(off ? off : 0), pants);
      if (a.state === 'walk') {
        R(ctx, ox + 3 - (off > 0 ? 1 : 0), baseY + 19 - Math.abs(off), 3, 1, DARK);
        R(ctx, ox + 6 + (off < 0 ? 1 : 0), baseY + 19 - Math.abs(off), 3, 1, DARK);
      } else {
        R(ctx, ox + 3, baseY + 19, 3, 1, DARK);
        R(ctx, ox + 6, baseY + 19, 3, 1, DARK);
      }
    }

    /* ---- torso ---- */
    R(ctx, ox + 3, baseY + 7, 6, 7, shirt);
    R(ctx, ox + 3, baseY + 13, 6, 1, shirtD);
    // detalle de gafete
    R(ctx, ox + (facing === 'left' ? 3 : 8), baseY + 10, 1, 2, L.accent || '#ffffff');

    /* ---- brazos según estado ---- */
    drawArms(ctx, a, ox, baseY, skin, shirt, time);

    /* ---- cabeza ---- */
    R(ctx, ox + 2, baseY, 8, 7, skin);
    R(ctx, ox + 2, baseY + 6, 8, 1, skinD);
    drawHair(ctx, ox, baseY, hair, L.hairStyle || 'short', facing, L.accent);

    // ojos / cara
    if (a.state === 'sleep') {
      R(ctx, ox + 4, baseY + 3, 2, 1, DARK);
      R(ctx, ox + 7, baseY + 3, 2, 1, DARK);
    } else if (facing !== 'up') {
      const eyeC = DARK;
      if (facing === 'down') {
        R(ctx, ox + 4, baseY + 3, 1, 2, eyeC);
        R(ctx, ox + 8, baseY + 3, 1, 2, eyeC);
        if (a.state === 'success' || a.mood === 'feliz') R(ctx, ox + 5, baseY + 5, 3, 1, U.shade(skin, -0.4));
        if (a.state === 'error') R(ctx, ox + 5, baseY + 5, 3, 1, '#a33');
      } else if (facing === 'left') {
        R(ctx, ox + 3, baseY + 3, 1, 2, eyeC);
      } else {
        R(ctx, ox + 8, baseY + 3, 1, 2, eyeC);
      }
    }
    ctx.restore();
  }

  function drawHair(ctx, ox, baseY, hair, style, facing, accent) {
    const hd = U.shade(hair, -0.2);
    switch (style) {
      case 'buzz': R(ctx, ox + 2, baseY, 8, 2, hair); break;
      case 'bald': R(ctx, ox + 2, baseY, 8, 1, U.shade(hair, 0.1)); break;
      case 'bun':
        R(ctx, ox + 2, baseY, 8, 2, hair); R(ctx, ox + 4, baseY - 2, 4, 2, hair);
        break;
      case 'ponytail':
        R(ctx, ox + 2, baseY, 8, 3, hair);
        R(ctx, ox + (facing === 'right' ? 0 : 10), baseY + 1, 2, 5, hair);
        break;
      case 'curly':
        R(ctx, ox + 1, baseY - 1, 10, 3, hair); R(ctx, ox + 2, baseY + 2, 1, 2, hd); R(ctx, ox + 9, baseY + 2, 1, 2, hd);
        break;
      case 'long':
        R(ctx, ox + 2, baseY, 8, 3, hair); R(ctx, ox + 1, baseY + 1, 1, 7, hair); R(ctx, ox + 10, baseY + 1, 1, 7, hair);
        break;
      case 'mohawk':
        R(ctx, ox + 5, baseY - 3, 2, 4, accent || hair); R(ctx, ox + 2, baseY, 8, 1, hair);
        break;
      case 'cap':
        R(ctx, ox + 2, baseY - 1, 8, 3, accent || '#c0392b');
        R(ctx, ox + (facing === 'left' ? 0 : 2), baseY + 2, 10, 1, U.shade(accent || '#c0392b', -0.3));
        break;
      case 'headphones':
        R(ctx, ox + 2, baseY, 8, 2, hair);
        R(ctx, ox + 1, baseY, 1, 4, '#22243a'); R(ctx, ox + 10, baseY, 1, 4, '#22243a');
        R(ctx, ox + 2, baseY - 2, 8, 1, '#22243a');
        break;
      default: R(ctx, ox + 2, baseY - 1, 8, 3, hair); R(ctx, ox + 2, baseY + 2, 1, 1, hd); R(ctx, ox + 9, baseY + 2, 1, 1, hd);
    }
  }

  function drawArms(ctx, a, ox, baseY, skin, shirt, time) {
    const st = a.state, t = a.animT;
    const armL = ox + 2, armR = ox + 9;
    const put = (x, y, w, h, c) => R(ctx, x, y, w, h, c);
    switch (st) {
      case 'work': {
        const k = Math.sin(t * 11) > 0 ? 0 : 1;
        put(armL, baseY + 7, 1, 3, shirt); put(armR, baseY + 7, 1, 3, shirt);
        put(armL, baseY + 10 - k, 2, 1, skin); put(armR - 1, baseY + 10 - (1 - k), 2, 1, skin);
        break;
      }
      case 'coffee':
        put(armL, baseY + 7, 1, 4, shirt);
        put(armR, baseY + 7, 1, 2, shirt);
        put(armR - 1, baseY + 5, 1, 2, skin);
        put(armR - 1, baseY + 3, 2, 2, '#ffffff');          // taza
        put(armR - 1, baseY + 3, 2, 1, '#c98a5e');
        break;
      case 'phone':
        put(armL, baseY + 7, 1, 4, shirt);
        put(armR, baseY + 5, 1, 4, shirt);
        put(armR - 1, baseY + 2, 1, 3, DARK);               // teléfono
        break;
      case 'eat': {
        const k = Math.sin(t * 6) > 0 ? 1 : 0;
        put(armL, baseY + 7, 1, 4, shirt);
        put(armR, baseY + 7 - k, 1, 3, shirt);
        put(armR - 1, baseY + 4 - k, 1, 2, '#c7ccd6');
        break;
      }
      case 'dance': {
        const up = Math.sin(t * 8) > 0;
        put(armL, baseY + (up ? 3 : 7), 1, 4, shirt);
        put(armR, baseY + (up ? 7 : 3), 1, 4, shirt);
        break;
      }
      case 'game':
        put(armL + 1, baseY + 9, 1, 2, shirt); put(armR - 1, baseY + 9, 1, 2, shirt);
        put(armL + 2, baseY + 10, 4, 2, '#333a4d');
        break;
      case 'talk': {
        const k = Math.sin(t * 5) > 0 ? 1 : 0;
        put(armL, baseY + 7, 1, 4, shirt);
        put(armR, baseY + 6 - k, 1, 4, shirt);
        break;
      }
      case 'success':
        put(armL, baseY + 3, 1, 4, shirt); put(armR, baseY + 3, 1, 4, shirt);
        break;
      case 'sleep':
        put(armL, baseY + 8, 1, 3, shirt); put(armR, baseY + 8, 1, 3, shirt);
        break;
      case 'walk': {
        const sw = Math.sin(t * 9) * 1.4;
        put(armL, baseY + 7 + Math.round(sw), 1, 4, shirt);
        put(armR, baseY + 7 - Math.round(sw), 1, 4, shirt);
        break;
      }
      default:
        put(armL, baseY + 7, 1, 5, shirt); put(armR, baseY + 7, 1, 5, shirt);
        put(armL, baseY + 12, 1, 1, skin); put(armR, baseY + 12, 1, 1, skin);
    }
  }

  /* ---------- DON AJO (ajo con traje) ---------- */
  function drawGarlicBoss(ctx, a, time) {
    const p = poseOf(a, time);
    const ox = -6;
    const baseY = -22 + (p.sitting ? 4 : 0) + Math.round(p.bob);
    const cream = '#f7f2e0', creamD = '#ded6bd', creamS = '#c9c0a4';
    const suit = '#191922', suitL = '#2a2a38';

    ctx.save();
    ctx.translate(Math.round(p.shake + p.lean), 0);

    // piernas
    if (p.sitting) {
      R(ctx, ox + 3, baseY + 16, 3, 3, suit); R(ctx, ox + 7, baseY + 16, 3, 3, suit);
      R(ctx, ox + 2, baseY + 19, 4, 2, '#0d0d12'); R(ctx, ox + 7, baseY + 19, 4, 2, '#0d0d12');
    } else {
      const off = a.state === 'walk' ? Math.round(Math.sin(a.animT * 8) * 1.5) : 0;
      R(ctx, ox + 3, baseY + 16, 3, 5 - Math.abs(off), suit);
      R(ctx, ox + 6, baseY + 16, 3, 5 - Math.abs(off), suit);
      R(ctx, ox + 3, baseY + 21 - Math.abs(off), 3, 1, '#0d0d12');
      R(ctx, ox + 6, baseY + 21 - Math.abs(off), 3, 1, '#0d0d12');
    }

    // traje
    R(ctx, ox + 1, baseY + 9, 10, 7, suit);
    R(ctx, ox + 1, baseY + 9, 10, 1, suitL);
    R(ctx, ox + 5, baseY + 9, 2, 4, '#f4f4f6');     // camisa
    R(ctx, ox + 5, baseY + 10, 2, 4, '#e63946');    // corbata
    R(ctx, ox + 5, baseY + 14, 2, 1, '#b02a37');
    // brazos
    if (a.state === 'phone') {
      R(ctx, ox, baseY + 9, 1, 5, suit);
      R(ctx, ox + 11, baseY + 6, 1, 4, suit);
      R(ctx, ox + 10, baseY + 3, 1, 3, DARK);
    } else if (a.state === 'talk' || a.state === 'success') {
      const k = Math.sin(a.animT * 5) > 0 ? 1 : 0;
      R(ctx, ox, baseY + 8 - k, 1, 5, suit);
      R(ctx, ox + 11, baseY + 9, 1, 5, suit);
    } else {
      R(ctx, ox, baseY + 9, 1, 6, suit);
      R(ctx, ox + 11, baseY + 9, 1, 6, suit);
    }

    // bulbo de ajo
    R(ctx, ox + 5, baseY - 3, 2, 2, '#6bbf59');       // brote
    R(ctx, ox + 7, baseY - 4, 2, 2, '#8ed97a');
    R(ctx, ox + 3, baseY - 1, 6, 1, cream);
    R(ctx, ox + 2, baseY, 8, 1, cream);
    R(ctx, ox + 1, baseY + 1, 10, 6, cream);
    R(ctx, ox + 2, baseY + 7, 8, 1, creamD);
    R(ctx, ox + 3, baseY + 8, 6, 1, creamS);
    // dientes del ajo
    R(ctx, ox + 4, baseY + 1, 1, 6, creamD);
    R(ctx, ox + 7, baseY + 1, 1, 6, creamD);
    R(ctx, ox + 10, baseY + 2, 1, 4, creamD);
    // lentes oscuros
    R(ctx, ox + 1, baseY + 3, 10, 2, '#101018');
    R(ctx, ox + 2, baseY + 3, 1, 1, '#4a4a66');
    if (a.state !== 'sleep') R(ctx, ox + 8, baseY + 3, 1, 1, '#4a4a66');
    // boca / gesto
    if (a.state === 'talk' || a.state === 'phone') {
      const open = Math.sin(a.animT * 12) > 0;
      R(ctx, ox + 5, baseY + 6, 2, open ? 2 : 1, '#8a6b4a');
    }
    ctx.restore();
  }

  /* ============================================================
     MOBILIARIO
     ============================================================ */
  function drawObject(ctx, o, room, time) {
    const x = o.tx * T, y = o.ty * T, w = o.w * T, h = o.h * T;
    const c = o.color || '#8899aa';
    switch (o.type) {
      case 'desk': deskSprite(ctx, x, y, w, h, c); break;
      case 'ceodesk': ceoDesk(ctx, x, y, w, h); break;
      case 'monitor': monitor(ctx, x, y, c, time, o); break;
      case 'chair': chair(ctx, x, y, o.facing || 'up', c); break;
      case 'chairBoss': chairBoss(ctx, x, y); break;
      case 'plant': plant(ctx, x, y, o.seed); break;
      case 'cabinet': cabinet(ctx, x, y, w, h, c); break;
      case 'whiteboard': whiteboard(ctx, x, y, w, h, c); break;
      case 'bookshelf': bookshelf(ctx, x, y, w, h); break;
      case 'painting': painting(ctx, x, y, w, h, c); break;
      case 'sofa': sofa(ctx, x, y, w, h, c); break;
      case 'napcouch': sofa(ctx, x, y, w, h, '#7fa8c9', { blanket: true, pillow: '#f7f4ec' }); break;
      case 'meettable': meetTable(ctx, x, y, w, h); break;
      case 'coffeetable': coffeeTable(ctx, x, y, w, h); break;
      case 'watercooler': waterCooler(ctx, x, y); break;
      case 'coffee': coffeeMachine(ctx, x, y, time); break;
      case 'arcade': arcade(ctx, x, y, time, o); break;
      case 'tv': tv(ctx, x, y, w, h, time); break;
      case 'speaker': speaker(ctx, x, y, time); break;
      case 'discoball': discoball(ctx, x, y, time); break;
      case 'emblem': emblem(ctx, x, y, w, h, time); break;
      case 'foosball': foosball(ctx, x, y, w, h); break;
      case 'table': cafeTable(ctx, x, y, w, h); break;
      case 'buffet': buffet(ctx, x, y, w, h); break;
      case 'fridge': fridge(ctx, x, y); break;
      case 'vending': vending(ctx, x, y, time); break;
      case 'trash': trash(ctx, x, y); break;
      case 'boxes': boxes(ctx, x, y, c); break;
      case 'deskphone': deskPhone(ctx, x, y); break;
      case 'plaque': plaque(ctx, x, y, c); break;
      case 'bench': bench(ctx, x, y, w); break;
      default: R(ctx, x + 2, y + 2, w - 4, h - 4, c);
    }
  }

  function deskSprite(ctx, x, y, w, h, c) {
    const top = '#b98b5e', topD = '#8d6742', legc = '#6b4f33';
    R(ctx, x, y + 4, w, h - 8, top);
    R(ctx, x, y + 4, w, 2, U.shade(top, 0.25));
    R(ctx, x, y + h - 6, w, 2, topD);
    R(ctx, x + 1, y + h - 4, 2, 4, legc);
    R(ctx, x + w - 3, y + h - 4, 2, 4, legc);
    // papelitos y taza
    R(ctx, x + w - 10, y + 7, 5, 4, '#f5f2ea');
    R(ctx, x + w - 9, y + 8, 3, 1, '#c3c8d2');
    R(ctx, x + w - 9, y + 10, 3, 1, '#c3c8d2');
    R(ctx, x + 4, y + 8, 3, 3, c);
  }

  function ceoDesk(ctx, x, y, w, h) {
    const wood = '#5b3a29', woodL = '#7a5236';
    R(ctx, x, y + 2, w, h - 4, wood);
    R(ctx, x, y + 2, w, 2, woodL);
    R(ctx, x, y + h - 6, w, 3, '#3f2a1d');
    R(ctx, x + 2, y + h - 3, 3, 3, '#2c1d14');
    R(ctx, x + w - 5, y + h - 3, 3, 3, '#2c1d14');
    // placa dorada + papeles
    R(ctx, x + w - 22, y + 8, 14, 4, '#e8c15a');
    R(ctx, x + w - 21, y + 9, 12, 1, '#fff0b8');
    R(ctx, x + 8, y + 7, 8, 6, '#f7f4ec');
    R(ctx, x + 9, y + 9, 6, 1, '#b9c0cc');
  }

  function monitor(ctx, x, y, c, time, o) {
    const glow = 0.5 + 0.5 * Math.sin(time * 2 + (o.seed || 0) * 10);
    R(ctx, x + 2, y + 10, 12, 2, '#33384a');       // base
    R(ctx, x + 6, y + 7, 4, 3, '#454b60');
    R(ctx, x + 1, y - 2, 14, 10, '#22263a');
    R(ctx, x + 2, y - 1, 12, 8, U.mix('#0d1b2a', c, 0.45));
    ctx.globalAlpha = 0.35 + glow * 0.35;
    R(ctx, x + 3, y, 6, 1, c);
    R(ctx, x + 3, y + 2, 9, 1, U.shade(c, 0.4));
    R(ctx, x + 3, y + 4, 5, 1, c);
    ctx.globalAlpha = 1;
  }

  function chair(ctx, x, y, facing, c) {
    const seat = '#4d5670', seatL = '#616c8c', dark = '#2b3145';
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.fillRect(x + 3, y + 13, 10, 2);
    if (facing === 'up') {          // el agente mira hacia arriba: respaldo abajo
      R(ctx, x + 3, y + 4, 10, 7, seat);
      R(ctx, x + 4, y + 5, 8, 3, seatL);
      R(ctx, x + 2, y + 10, 12, 4, dark);      // respaldo
      R(ctx, x + 3, y + 10, 10, 1, U.shade(dark, 0.35));
      R(ctx, x + 6, y + 14, 4, 2, '#20263a');
    } else if (facing === 'down') { // respaldo arriba
      R(ctx, x + 2, y + 1, 12, 5, dark);
      R(ctx, x + 3, y + 1, 10, 1, U.shade(dark, 0.35));
      R(ctx, x + 3, y + 6, 10, 7, seat);
      R(ctx, x + 4, y + 7, 8, 3, seatL);
      R(ctx, x + 6, y + 13, 4, 2, '#20263a');
    } else {
      const flip = facing === 'left';
      R(ctx, x + (flip ? 9 : 2), y + 3, 5, 11, dark);
      R(ctx, x + (flip ? 3 : 4), y + 5, 8, 8, seat);
      R(ctx, x + (flip ? 4 : 5), y + 6, 6, 3, seatL);
      R(ctx, x + 6, y + 14, 4, 2, '#20263a');
    }
    R(ctx, x + 6, y + (facing === 'down' ? 2 : 5), 4, 1, c);
  }

  function chairBoss(ctx, x, y) {
    R(ctx, x + 1, y - 6, 14, 16, '#2b2233');
    R(ctx, x + 2, y - 5, 12, 13, '#3d3048');
    R(ctx, x + 2, y - 5, 12, 2, '#e8c15a');
    R(ctx, x + 3, y - 2, 4, 6, '#4a3a58');
    R(ctx, x + 2, y + 9, 12, 4, '#221b29');
    R(ctx, x + 6, y + 13, 4, 3, '#15111c');
  }

  function plant(ctx, x, y, seed) {
    const s = seed || 0.3;
    R(ctx, x + 5, y + 10, 6, 5, '#a4643c');
    R(ctx, x + 5, y + 10, 6, 1, '#c17b4d');
    const g1 = '#3f8f4f', g2 = '#57b567';
    R(ctx, x + 7, y + 4, 2, 7, g1);
    R(ctx, x + 3, y + 5 + (s > .5 ? 1 : 0), 4, 2, g2);
    R(ctx, x + 9, y + 3, 4, 2, g2);
    R(ctx, x + 4, y + 8, 3, 2, g1);
    R(ctx, x + 10, y + 7, 3, 2, g1);
    R(ctx, x + 6, y + 1, 3, 3, g2);
  }

  function whiteboard(ctx, x, y, w, h, c) {
    R(ctx, x, y - 10, w, 24, '#aeb8c9');
    R(ctx, x + 1, y - 9, w - 2, 21, '#eef1f6');
    R(ctx, x + 1, y - 9, w - 2, 2, '#ffffff');
    R(ctx, x + 4, y - 5, w - 14, 2, U.shade(c, -0.1));
    R(ctx, x + 4, y - 1, w - 22, 2, '#7f8ba0');
    R(ctx, x + 4, y + 3, w - 18, 1, '#9aa6bb');
    R(ctx, x + w - 10, y + 1, 6, 5, U.rgba(c, .8));
    R(ctx, x, y + 12, w, 3, '#8e99ad');
    R(ctx, x + 3, y + 10, 5, 2, '#e63946');
    R(ctx, x + 10, y + 10, 5, 2, '#3a86ff');
  }

  function bookshelf(ctx, x, y, w, h) {
    R(ctx, x, y - 12, w, 28, '#5b4130');
    R(ctx, x + 1, y - 11, w - 2, 8, '#3b2a1e');
    R(ctx, x + 1, y - 2, w - 2, 8, '#3b2a1e');
    R(ctx, x + 1, y + 7, w - 2, 6, '#3b2a1e');
    const cols = ['#c0392b', '#2980b9', '#27ae60', '#e8c15a', '#8e44ad', '#e67e22', '#16a085'];
    for (let i = 0; i < w - 6; i += 4) {
      const hh = 6 + (i % 3);
      R(ctx, x + 3 + i, y - 10 + (7 - hh), 3, hh, cols[(i / 4) % cols.length]);
      R(ctx, x + 3 + i, y - 1 + (7 - hh), 3, hh, cols[(i / 4 + 3) % cols.length]);
    }
    R(ctx, x + 3, y + 8, w - 8, 4, '#7ec850');
    R(ctx, x, y + 13, w, 3, '#42301f');
  }

  function cabinet(ctx, x, y, w, h, c) {
    R(ctx, x, y - 6, w, h * 1 + 20, '#8d99ae');
    R(ctx, x, y - 6, w, 3, '#b3bccd');
    for (let i = 0; i < 3; i++) {
      R(ctx, x + 2, y - 2 + i * 7, w - 4, 5, '#6c7a91');
      R(ctx, x + w / 2 - 3, y + i * 7, 6, 1, '#c9d1dd');
    }
    R(ctx, x + 2, y - 10, w - 4, 4, c);
    R(ctx, x + 3, y - 9, w - 6, 2, U.shade(c, 0.4));
  }

  function painting(ctx, x, y, w, h, c) {
    R(ctx, x + 1, y + 2, w - 2, 10, '#e8c15a');
    R(ctx, x + 2, y + 3, w - 4, 8, U.mix(c, '#1b2540', 0.35));
    R(ctx, x + 3, y + 8, w - 6, 3, U.shade(c, -0.25));
    R(ctx, x + 4, y + 5, 2, 2, '#fff3c4');
  }

  function sofa(ctx, x, y, w, h, c, opts) {
    const fabric = U.mix(c, '#59647f', 0.45);
    const back = U.shade(fabric, -0.30);
    const seat = U.shade(fabric, 0.12);
    const dark = U.shade(fabric, -0.5);
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x + 2, y + 13, w - 4, 3);
    // respaldo
    R(ctx, x, y - 9, w, 11, back);
    R(ctx, x, y - 9, w, 2, U.shade(back, 0.28));
    // asiento
    R(ctx, x + 3, y + 1, w - 6, 11, seat);
    for (let i = 3; i < w - 6; i += 14) {
      R(ctx, x + i + 1, y + 2, 12, 8, U.shade(seat, 0.10));
      R(ctx, x + i + 1, y + 9, 12, 1, U.shade(seat, -0.2));
    }
    // brazos
    R(ctx, x, y - 2, 4, 14, U.shade(fabric, -0.12));
    R(ctx, x + w - 4, y - 2, 4, 14, U.shade(fabric, -0.12));
    R(ctx, x, y - 2, 4, 2, U.shade(fabric, 0.2));
    R(ctx, x + w - 4, y - 2, 4, 2, U.shade(fabric, 0.2));
    // patas
    R(ctx, x + 2, y + 12, 3, 3, dark); R(ctx, x + w - 5, y + 12, 3, 3, dark);
    // cojín decorativo
    R(ctx, x + 6, y - 5, 7, 7, opts && opts.pillow ? opts.pillow : U.shade(c, 0.35));
    if (opts && opts.blanket) {
      R(ctx, x + w - 22, y + 1, 18, 11, '#d9e2ef');
      R(ctx, x + w - 22, y + 1, 18, 2, '#eef3f9');
    }
  }

  function coffeeTable(ctx, x, y, w, h) {
    R(ctx, x, y + 4, w, 6, '#8d6742');
    R(ctx, x, y + 4, w, 2, '#b98b5e');
    R(ctx, x + 1, y + 10, 2, 3, '#6b4f33');
    R(ctx, x + w - 3, y + 10, 2, 3, '#6b4f33');
    R(ctx, x + 5, y + 5, 4, 3, '#f2f4f7');
  }

  function waterCooler(ctx, x, y) {
    R(ctx, x + 3, y + 8, 10, 12, '#dfe6ee');
    R(ctx, x + 4, y + 1, 8, 8, '#7fd0e8');
    R(ctx, x + 4, y + 1, 8, 2, '#a9e4f5');
    R(ctx, x + 5, y + 12, 6, 2, '#39516b');
    R(ctx, x + 3, y + 18, 10, 2, '#a8b3c2');
  }

  function coffeeMachine(ctx, x, y, time) {
    // máquina de 2x2 tiles (32x32)
    R(ctx, x + 2, y - 6, 28, 36, '#39415a');
    R(ctx, x + 2, y - 6, 28, 3, '#586285');
    R(ctx, x + 4, y - 3, 24, 12, '#1b2030');
    R(ctx, x + 6, y - 1, 8, 3, '#7ee2a8');
    R(ctx, x + 16, y - 1, 4, 3, '#e63946');
    R(ctx, x + 22, y - 1, 4, 3, '#ffd166');
    // dispensadores
    R(ctx, x + 5, y + 11, 22, 10, '#5b6478');
    R(ctx, x + 8, y + 11, 3, 4, '#39415a');
    R(ctx, x + 20, y + 11, 3, 4, '#39415a');
    const drip = Math.sin(time * 7) > 0.2;
    if (drip) { R(ctx, x + 9, y + 15, 1, 4, '#6b4226'); R(ctx, x + 21, y + 16, 1, 3, '#6b4226'); }
    R(ctx, x + 6, y + 18, 7, 5, '#f2f4f7'); R(ctx, x + 6, y + 18, 7, 1, '#6b4226');
    R(ctx, x + 18, y + 18, 7, 5, '#f2f4f7'); R(ctx, x + 18, y + 18, 7, 1, '#6b4226');
    R(ctx, x + 3, y + 24, 26, 6, '#2b3245');
    // vasitos apilados
    R(ctx, x + 24, y + 4, 4, 6, '#e8eef7');
  }

  function arcade(ctx, x, y, time, o) {
    const c1 = ['#e63946', '#3a86ff', '#8338ec'][Math.floor((o.seed || 0) * 3) % 3];
    R(ctx, x + 2, y - 8, 28, 40, '#252b3d');
    R(ctx, x + 2, y - 8, 28, 4, c1);
    R(ctx, x + 4, y - 3, 24, 16, '#0b0f1a');
    // pantalla animada
    const f = Math.floor(time * 6);
    for (let i = 0; i < 8; i++) {
      const px = 6 + ((i * 5 + f) % 20), py = -1 + ((i * 4 + f * 2) % 12);
      R(ctx, x + px, y + py, 3, 3, i % 3 === 0 ? '#7ee2a8' : (i % 3 === 1 ? c1 : '#ffd166'));
    }
    R(ctx, x + 5, y - 2, 3, 1, '#3d4a63'); R(ctx, x + 5, y + 10, 22, 1, '#3d4a63');
    // controles
    R(ctx, x + 4, y + 15, 24, 8, '#1b2130');
    R(ctx, x + 7, y + 17, 3, 3, '#e63946'); R(ctx, x + 7, y + 16, 3, 1, '#ff8a8f');
    R(ctx, x + 14, y + 18, 3, 3, '#ffd166');
    R(ctx, x + 19, y + 18, 3, 3, '#4cc9f0');
    R(ctx, x + 4, y + 24, 24, 8, '#161b29');
    R(ctx, x + 8, y + 26, 16, 3, U.rgba(c1, .5));
  }

  function tv(ctx, x, y, w, h, time) {
    R(ctx, x + 1, y - 14, w - 2, 26, '#12161f');
    R(ctx, x + 3, y - 12, w - 6, 21, '#0a0d14');
    const f = Math.floor(time * 3) % 3;
    const cols = ['#3a86ff', '#8338ec', '#06d6a0'];
    R(ctx, x + 3, y - 12, w - 6, 21, U.shade(cols[f], -0.55));
    R(ctx, x + 6, y - 9, w - 20, 5, cols[f]);
    R(ctx, x + 6, y - 2, 14, 4, U.shade(cols[(f + 1) % 3], 0.2));
    R(ctx, x + 6, y + 4, 24, 2, U.shade(cols[(f + 2) % 3], 0.3));
    R(ctx, x + w / 2 - 6, y + 12, 12, 3, '#333a4d');
    R(ctx, x + w / 2 - 10, y + 14, 20, 2, '#242a3a');
  }

  function speaker(ctx, x, y, time) {
    const pulse = Math.sin(time * 8) > 0 ? 1 : 0;
    R(ctx, x + 2, y - 10, 12, 26, '#1d2330');
    R(ctx, x + 2, y - 10, 12, 2, '#39415a');
    R(ctx, x + 4, y - 7, 8, 8, pulse ? '#8338ec' : '#5b2fa8');
    R(ctx, x + 6, y - 5, 4, 4, '#1a1030');
    R(ctx, x + 5, y + 3, 6, 6, pulse ? '#4cc9f0' : '#2b6f8a');
    R(ctx, x + 4, y + 11, 8, 3, '#2b3245');
    if (pulse) { R(ctx, x - 1, y - 6, 2, 2, U.rgba('#8338ec', .7)); R(ctx, x + 15, y - 2, 2, 2, U.rgba('#4cc9f0', .7)); }
  }

  function discoball(ctx, x, y, time) {
    const cx = x + 8;
    R(ctx, cx, y - 18, 1, 6, '#8892a8');
    const cols = ['#ff477e', '#4cc9f0', '#ffd166', '#7ee2a8', '#c77dff'];
    const f = Math.floor(time * 5);
    R(ctx, cx - 5, y - 12, 10, 10, '#9aa6bd');
    R(ctx, cx - 4, y - 11, 8, 8, '#c3cddd');
    for (let i = 0; i < 6; i++) {
      R(ctx, cx - 4 + ((i * 3 + f) % 8), y - 11 + ((i * 5 + f * 2) % 8), 2, 2, cols[(i + f) % cols.length]);
    }
    ctx.globalAlpha = 0.35;
    for (let i = 0; i < 4; i++) {
      const a = time * 1.6 + i * Math.PI / 2;
      ctx.fillStyle = cols[(i + f) % cols.length];
      ctx.fillRect(cx + Math.cos(a) * 18 - 2, y - 7 + Math.sin(a) * 10, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function foosball(ctx, x, y, w, h) {
    R(ctx, x + 1, y + 3, w - 2, h - 6, '#2e7d4f');
    R(ctx, x + 1, y + 3, w - 2, 2, '#3fa06a');
    for (let i = 8; i < w - 4; i += 10) R(ctx, x + i, y + 3, 1, h - 6, '#c9ced8');
    R(ctx, x + 1, y + h - 4, w - 2, 2, '#5b4130');
    R(ctx, x + w / 2 - 1, y + h / 2 - 1, 2, 2, '#fff');
  }

  function cafeTable(ctx, x, y, w, h) {
    ctx.fillStyle = 'rgba(0,0,0,.20)';
    ctx.fillRect(x + 4, y + h - 5, w - 8, 4);
    const top = '#f2f4f9', edge = '#c8cfdd';
    R(ctx, x + 3, y + 3, w - 6, h - 10, top);
    R(ctx, x + 1, y + 6, w - 2, h - 16, top);
    R(ctx, x + 3, y + 3, w - 6, 2, '#ffffff');
    R(ctx, x + 3, y + h - 8, w - 6, 2, edge);
    R(ctx, x + w / 2 - 3, y + h - 7, 6, 6, '#98a2b6');
    R(ctx, x + w / 2 - 5, y + h - 2, 10, 2, '#7c8699');
    // mantel + platos
    R(ctx, x + 5, y + 6, w - 10, 6, '#ffd9cf');
    R(ctx, x + 7, y + 7, 7, 5, '#ffffff'); R(ctx, x + 9, y + 8, 3, 3, '#ef8354');
    R(ctx, x + w - 13, y + 7, 5, 5, '#ffffff'); R(ctx, x + w - 12, y + 8, 3, 3, '#7ec850');
  }

  function meetTable(ctx, x, y, w, h) {
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(x + 4, y + h - 4, w - 8, 4);
    const wood = '#8d6742';
    R(ctx, x + 1, y + 2, w - 2, h - 8, wood);
    R(ctx, x + 1, y + 2, w - 2, 3, '#b98b5e');
    R(ctx, x + 1, y + h - 8, w - 2, 2, '#6b4f33');
    R(ctx, x + 4, y + h - 6, 3, 5, '#5b4130');
    R(ctx, x + w - 7, y + h - 6, 3, 5, '#5b4130');
    for (let i = 8; i < w - 14; i += 26) {
      R(ctx, x + i, y + 7, 9, 6, '#f7f4ec');
      R(ctx, x + i + 1, y + 9, 6, 1, '#b9c0cc');
      R(ctx, x + i + 13, y + 8, 4, 4, '#ffffff');
      R(ctx, x + i + 13, y + 8, 4, 1, '#6b4226');
    }
  }

  function buffet(ctx, x, y, w, h) {
    // panel trasero
    R(ctx, x, y - 12, w, 12, '#9aa6bd');
    R(ctx, x, y - 12, w, 2, '#c3cddd');
    for (let i = 4; i < w - 4; i += 10) R(ctx, x + i, y - 9, 6, 6, '#8391ab');
    // barra
    R(ctx, x, y + 1, w, 11, '#b9c2d0');
    R(ctx, x, y + 1, w, 3, '#dfe6ee');
    R(ctx, x, y + 11, w, 4, '#8d99ae');
    const foods = ['#e8c15a', '#7ec850', '#e5735a', '#f0e5c9', '#c58b5c'];
    for (let i = 0; i < Math.floor((w - 8) / 14); i++) {
      const fx = x + 6 + i * 14;
      R(ctx, fx, y + 4, 10, 6, '#eef2f7');
      R(ctx, fx + 1, y + 5, 8, 4, foods[i % foods.length]);
      R(ctx, fx, y + 4, 10, 1, '#ffffff');
    }
    // cristal
    ctx.globalAlpha = .35;
    R(ctx, x + 1, y - 4, w - 2, 1, '#ffffff');
    R(ctx, x + 1, y - 3, w - 2, 3, '#cfe6f5');
    ctx.globalAlpha = 1;
  }

  function fridge(ctx, x, y) {
    R(ctx, x + 2, y + 2, 12, 28, '#dfe6ee');
    R(ctx, x + 2, y + 2, 12, 12, '#eef3f8');
    R(ctx, x + 11, y + 6, 2, 4, '#8d99ae');
    R(ctx, x + 11, y + 18, 2, 4, '#8d99ae');
    R(ctx, x + 4, y + 4, 4, 3, '#ffd166');
  }

  function vending(ctx, x, y, time) {
    R(ctx, x + 2, y + 2, 12, 28, '#2b3245');
    R(ctx, x + 3, y + 4, 8, 18, '#101725');
    const cols = ['#e63946', '#4cc9f0', '#7ee2a8', '#ffd166'];
    for (let r = 0; r < 4; r++) for (let c2 = 0; c2 < 2; c2++) {
      R(ctx, x + 4 + c2 * 4, y + 5 + r * 4, 3, 3, cols[(r + c2) % 4]);
    }
    R(ctx, x + 12, y + 6, 1, 6, Math.sin(time * 4) > 0 ? '#7ee2a8' : '#2f6b4f');
    R(ctx, x + 4, y + 24, 8, 3, '#4a5262');
  }

  function trash(ctx, x, y) {
    R(ctx, x + 5, y + 6, 7, 9, '#5b6478');
    R(ctx, x + 4, y + 5, 9, 2, '#7d8798');
    R(ctx, x + 7, y + 8, 1, 5, '#465063');
  }

  function boxes(ctx, x, y, c) {
    R(ctx, x + 2, y + 6, 12, 10, '#c19a6b');
    R(ctx, x + 2, y + 6, 12, 2, '#d8b183');
    R(ctx, x + 7, y + 6, 2, 10, '#a67c4e');
    R(ctx, x + 3, y + 17, 10, 8, '#b98b5e');
    R(ctx, x + 3, y + 17, 10, 2, c);
  }

  function deskPhone(ctx, x, y) {
    R(ctx, x + 3, y + 8, 10, 5, '#2b3245');
    R(ctx, x + 2, y + 6, 12, 3, '#3d4759');
    R(ctx, x + 4, y + 10, 3, 2, '#7d8798');
  }

  function plaque(ctx, x, y, c) {
    R(ctx, x + 2, y + 6, 12, 7, '#151a28');
    R(ctx, x + 3, y + 7, 10, 5, U.shade(c, -0.1));
    R(ctx, x + 4, y + 8, 8, 1, U.shade(c, 0.45));
    R(ctx, x + 4, y + 10, 5, 1, U.shade(c, 0.3));
  }

  function bench(ctx, x, y, w) {
    R(ctx, x + 1, y + 4, w - 2, 4, '#a9764a');
    R(ctx, x + 1, y + 4, w - 2, 1, '#c4936a');
    R(ctx, x + 1, y + 8, w - 2, 2, '#7d5533');
    R(ctx, x + 2, y + 10, 2, 3, '#5b6478');
    R(ctx, x + w - 4, y + 10, 2, 3, '#5b6478');
  }

  /* Emblema corporativo del ajo, pintado en la alfombra de dirección */
  function emblem(ctx, x, y, w, h, time) {
    const cx = x + w / 2, cy = y + h / 2;
    const gold = '#e8c15a', goldD = '#a8862f';
    const rad = Math.min(w, h) / 2 - 3;
    const s = Math.max(2, Math.round(rad / 11));   // escala del ajo
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = gold; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = goldD; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, rad - 5, 0, Math.PI * 2); ctx.stroke();
    const b = Math.round(cx - 6 * s), t2 = Math.round(cy - 9 * s);
    R(ctx, b + 5 * s, t2, 2 * s, 2 * s, '#6bbf59');
    R(ctx, b + 3 * s, t2 + 2 * s, 6 * s, 1 * s, gold);
    R(ctx, b + 1 * s, t2 + 3 * s, 10 * s, 5 * s, gold);
    R(ctx, b + 2 * s, t2 + 8 * s, 8 * s, 1 * s, goldD);
    R(ctx, b + 4 * s, t2 + 3 * s, s, 5 * s, goldD);
    R(ctx, b + 7 * s, t2 + 3 * s, s, 5 * s, goldD);
    ctx.restore();
  }

  /* ============================================================
     EMOTES / ICONOS FLOTANTES
     ============================================================ */
  function drawEmote(ctx, a, time) {
    const st = a.state;
    if (['idle', 'walk', 'sit'].includes(st)) return;
    const x = Math.round(a.x), y = Math.round(a.y) - (a.isBoss ? 28 : 25);
    const fl = Math.sin(time * 3 + a.animT) * 1.2;
    ctx.save();
    ctx.translate(x, y + fl);
    switch (st) {
      case 'work':
        R(ctx, -4, -2, 8, 5, '#f7f8fb'); R(ctx, -3, -1, 6, 1, '#9aa3b2');
        R(ctx, -3, 1, 4, 1, '#9aa3b2');
        break;
      case 'coffee':
        R(ctx, -3, -1, 6, 5, '#ffffff'); R(ctx, -3, -1, 6, 1, '#6b4226');
        R(ctx, 3, 0, 1, 3, '#e0e0e0');
        R(ctx, -2, -4 - (time * 4 % 3), 1, 2, 'rgba(255,255,255,0.7)');
        R(ctx, 1, -5 - (time * 3 % 3), 1, 2, 'rgba(255,255,255,0.5)');
        break;
      case 'game':
        R(ctx, -5, -1, 10, 4, '#39405a'); R(ctx, -3, 0, 2, 2, '#e63946');
        R(ctx, 2, 0, 2, 2, '#4cc9f0');
        break;
      case 'dance': {
        const n = Math.sin(time * 5) * 2;
        R(ctx, -4 + n, -3, 1, 4, '#ffd166'); R(ctx, -3 + n, 0, 2, 1, '#ffd166');
        R(ctx, 3 - n, -5, 1, 4, '#ff8fab'); R(ctx, 4 - n, -2, 2, 1, '#ff8fab');
        break;
      }
      case 'talk':
        R(ctx, -5, -2, 10, 6, '#ffffff'); R(ctx, -2, 3, 2, 2, '#ffffff');
        R(ctx, -3, 0, 1, 1, '#39405a'); R(ctx, -1, 0, 1, 1, '#39405a'); R(ctx, 1, 0, 1, 1, '#39405a');
        break;
      case 'phone':
        R(ctx, -2, -3, 4, 7, '#22263a'); R(ctx, -1, -2, 2, 4, '#7ee2a8');
        break;
      case 'eat':
        R(ctx, -4, 0, 8, 3, '#ffffff'); R(ctx, -3, 1, 6, 1, '#e5735a');
        R(ctx, 4, -3, 1, 5, '#c9ced8');
        break;
      case 'success':
        R(ctx, -1, 1, 2, 2, '#7ee2a8'); R(ctx, 0, 0, 2, 2, '#7ee2a8');
        R(ctx, 1, -1, 2, 2, '#7ee2a8'); R(ctx, 2, -3, 2, 2, '#7ee2a8');
        R(ctx, -3, 0, 2, 2, '#7ee2a8');
        break;
      case 'error':
        R(ctx, -1, -4, 2, 5, '#ff5a5f'); R(ctx, -1, 2, 2, 2, '#ff5a5f');
        break;
      case 'sleep': {
        const k = (time * 1.5) % 3;
        ctx.fillStyle = '#cfd6e2';
        ctx.font = '7px monospace';
        ctx.fillText('z', 2 + k, -k * 2);
        ctx.fillText('z', -3, 2 - k);
        break;
      }
    }
    ctx.restore();
  }

  /* Versión "lejana" (LOD) para cuando el zoom es bajo: 1-2 rects por mueble.
     Permite mantener 60fps con cientos de objetos en pantalla. */
  const LOD = {
    desk: '#a9784f', ceodesk: '#6b4526', meettable: '#8d6742', table: '#e8eaf0',
    chair: '#454e66', chairBoss: '#332942', monitor: '#20263a', plant: '#4f9c53',
    cabinet: '#8d99ae', whiteboard: '#e9ecf2', bookshelf: '#5b4130', painting: '#e8c15a',
    sofa: '#5d6a86', napcouch: '#7fa8c9', coffeetable: '#8d6742', watercooler: '#bcd9e8',
    coffee: '#39415a', arcade: '#252b3d', tv: '#12161f', speaker: '#1d2330',
    foosball: '#2e7d4f', buffet: '#b9c2d0', fridge: '#dfe6ee', vending: '#2b3245',
    trash: '#5b6478', boxes: '#c19a6b', deskphone: '#2b3245', plaque: '#888',
    bench: '#a9764a', discoball: '#c3cddd', emblem: null
  };

  function drawObjectFar(ctx, o) {
    const col = LOD[o.type];
    if (!col) return;
    const x = o.tx * T, y = o.ty * T, w = o.w * T, h = o.h * T;
    ctx.fillStyle = o.type === 'plaque' ? (o.color || col) : col;
    ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  }

  NAW.Sprites = {
    drawAgent, drawObject, drawObjectFar, drawEmote, isSitting, R, T
  };
})(window);

/* ===== js/render/Renderer.js ===== */
/* ============================================================
   NETWORK AGENTS WORLD — Renderer
   Cámara con zoom/paneo, caché estático por chunks (escala a
   edificios enormes), pase dinámico con orden por profundidad,
   partículas, burbujas de diálogo y minimapa.
   ============================================================ */
(function (global) {
  'use strict';
  const NAW = (global.NAW = global.NAW || {});
  const U = NAW.Utils, S = NAW.Sprites, F = NAW.FLOOR;
  const T = 16;
  const CHUNK = 32;              // tiles por chunk
  const CHUNK_PX = CHUNK * T;

  class Renderer {
    constructor(canvas, ctx0) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d', { alpha: false });
      this.world = ctx0.world;
      this.agents = ctx0.agents;
      this.bus = ctx0.bus;
      this.chunks = new Map();
      this.chunkOrder = [];
      this.maxChunks = 90;
      this.cam = { x: 0, y: 0, zoom: 2.2, targetZoom: 2.2 };
      this.follow = null;
      this.hover = null;
      this.particles = [];
      this.dpr = Math.min(global.devicePixelRatio || 1, 2);
      this.time = 0;
      this.showGrid = false;
      this.showNames = true;
      this.quality = 1;
      this.frame = 0;
      this.insets = { left: 0, right: 0, top: 46, bottom: 0 };
      this.resize();
    }

    /* ---------- Cámara ---------- */
    resize() {
      const r = this.canvas.getBoundingClientRect();
      const w = Math.max(320, r.width | 0), h = Math.max(240, r.height | 0);
      this.vw = w; this.vh = h;
      this.canvas.width = Math.floor(w * this.dpr);
      this.canvas.height = Math.floor(h * this.dpr);
      this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      this.ctx.imageSmoothingEnabled = false;
      this.updateInsets();
    }

    /** El área "segura" es la parte del canvas que no tapan los paneles */
    updateInsets() {
      const vis = (el) => el && el.offsetParent !== null && !el.classList.contains('collapsed');
      const L = document.getElementById('leftcol'), Rp = document.getElementById('rightcol');
      const hidden = document.body.classList.contains('ui-hidden');
      const narrow = this.vw < 940;
      this.insets.top = hidden ? 0 : 46;
      this.insets.bottom = 0;
      if (hidden || narrow) { this.insets.left = 0; this.insets.right = 0; return; }
      this.insets.left = vis(L) ? L.getBoundingClientRect().right + 8 : 0;
      this.insets.right = vis(Rp) ? this.vw - Rp.getBoundingClientRect().left + 8 : 0;
      if (this.insets.left + this.insets.right > this.vw * 0.75) { this.insets.left = 0; this.insets.right = 0; }
    }

    get cx() { return (this.insets.left + (this.vw - this.insets.right)) / 2; }
    get cy() { return (this.insets.top + (this.vh - this.insets.bottom)) / 2; }
    get safeW() { return Math.max(120, this.vw - this.insets.left - this.insets.right); }
    get safeH() { return Math.max(120, this.vh - this.insets.top - this.insets.bottom); }

    clearCache() { this.chunks.clear(); this.chunkOrder.length = 0; }

    centerOn(x, y) { this.cam.x = x; this.cam.y = y; }
    focusAgent(a, zoom) {
      if (!a) return;
      this.follow = a;
      if (zoom) this.cam.targetZoom = zoom;
    }
    setZoom(z) { this.cam.targetZoom = U.clamp(z, 0.12, 5); }
    zoomBy(f) { this.setZoom(this.cam.targetZoom * f); }

    screenToWorld(sx, sy) {
      return {
        x: (sx - this.cx) / this.cam.zoom + this.cam.x,
        y: (sy - this.cy) / this.cam.zoom + this.cam.y
      };
    }
    worldToScreen(wx, wy) {
      return {
        x: (wx - this.cam.x) * this.cam.zoom + this.cx,
        y: (wy - this.cam.y) * this.cam.zoom + this.cy
      };
    }

    panBy(dxScreen, dyScreen) {
      this.follow = null;
      this.cam.x -= dxScreen / this.cam.zoom;
      this.cam.y -= dyScreen / this.cam.zoom;
      this._clampCam();
    }

    _clampCam() {
      const w = this.world;
      const halfW = this.safeW / (2 * this.cam.zoom), halfH = this.safeH / (2 * this.cam.zoom);
      const pad = 90;
      this.cam.x = U.clamp(this.cam.x, -pad + halfW * 0.15, w.pxW + pad - halfW * 0.15);
      this.cam.y = U.clamp(this.cam.y, -pad + halfH * 0.15, w.pxH + pad - halfH * 0.15);
    }

    update(dt) {
      this.cam.zoom = U.damp(this.cam.zoom, this.cam.targetZoom, 8, dt);
      if (this.follow) {
        this.cam.x = U.damp(this.cam.x, this.follow.x, 5, dt);
        this.cam.y = U.damp(this.cam.y, this.follow.y - 8, 5, dt);
      }
      this._clampCam();
      // partículas
      const ps = this.particles;
      for (let i = ps.length - 1; i >= 0; i--) {
        const p = ps[i];
        p.life -= dt;
        if (p.life <= 0) { ps.splice(i, 1); continue; }
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vy += (p.g || 0) * dt;
      }
    }

    burst(x, y, kind) {
      const n = kind === 'confetti' ? 26 : 10;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 12 + Math.random() * 36;
        this.particles.push({
          x, y: y - 14,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (kind === 'confetti' ? 26 : 6),
          g: kind === 'confetti' ? 70 : -10,
          life: 0.7 + Math.random() * 0.9,
          size: kind === 'confetti' ? 2 : 1,
          color: kind === 'confetti'
            ? U.pick(['#ffd166', '#7ee2a8', '#4cc9f0', '#ff8fab', '#c77dff'])
            : (kind === 'error' ? '#ff5a5f' : '#ffffff')
        });
      }
    }

    /* ---------- Chunks estáticos ---------- */
    _chunkKey(cx, cy) { return cx + ',' + cy; }

    _getChunk(cx, cy) {
      const key = this._chunkKey(cx, cy);
      let ch = this.chunks.get(key);
      if (ch) return ch;
      ch = this._renderChunk(cx, cy);
      this.chunks.set(key, ch);
      this.chunkOrder.push(key);
      if (this.chunkOrder.length > this.maxChunks) {
        const old = this.chunkOrder.shift();
        this.chunks.delete(old);
      }
      return ch;
    }

    _renderChunk(cx, cy) {
      const cv = document.createElement('canvas');
      cv.width = CHUNK_PX; cv.height = CHUNK_PX;
      const g = cv.getContext('2d');
      g.imageSmoothingEnabled = false;
      const w = this.world;
      const x0 = cx * CHUNK, y0 = cy * CHUNK;
      g.fillStyle = '#0b0d16';
      g.fillRect(0, 0, CHUNK_PX, CHUNK_PX);
      for (let ty = y0; ty < y0 + CHUNK; ty++) {
        if (ty < 0 || ty >= w.H) continue;
        for (let tx = x0; tx < x0 + CHUNK; tx++) {
          if (tx < 0 || tx >= w.W) continue;
          const px = (tx - x0) * T, py = (ty - y0) * T;
          this._drawTile(g, tx, ty, px, py);
        }
      }
      return cv;
    }

    _drawTile(g, tx, ty, px, py) {
      const w = this.world, i = ty * w.W + tx;
      const code = w.floor[i];
      const roomIdx = w.roomAt[i];
      const room = roomIdx >= 0 ? w.rooms[roomIdx] : null;
      const isWall = w.wall[i] === 1;
      const h = U.hashString(tx + ':' + ty);

      if (isWall) { this._drawWall(g, tx, ty, px, py, room, h); return; }

      switch (code) {
        case F.EXT: {
          g.fillStyle = '#0a0c14'; g.fillRect(px, py, T, T);
          if (h % 23 === 0) { g.fillStyle = '#161b2b'; g.fillRect(px + (h % 12), py + (h % 9), 2, 2); }
          break;
        }
        case F.CORRIDOR: {
          const base = ((tx + ty) & 1) ? '#cfd4e2' : '#c7cddc';
          g.fillStyle = base; g.fillRect(px, py, T, T);
          g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(px, py, T, 1);
          g.fillStyle = 'rgba(60,70,100,.14)'; g.fillRect(px, py + T - 1, T, 1); g.fillRect(px + T - 1, py, 1, T);
          if (h % 37 === 0) { g.fillStyle = 'rgba(90,100,130,.25)'; g.fillRect(px + 4, py + 6, 3, 1); }
          break;
        }
        case F.OFFICE: {
          const c = room ? U.mix(room.color, '#b9c0d4', 0.74) : '#b9c0d4';
          g.fillStyle = c; g.fillRect(px, py, T, T);
          g.fillStyle = U.rgba(U.shade(c, -0.35), 0.20);
          for (let k = 0; k < 4; k++) g.fillRect(px + ((h >> (k * 3)) % 15), py + ((h >> (k * 2 + 1)) % 15), 1, 1);
          g.fillStyle = U.rgba('#ffffff', 0.10); g.fillRect(px, py, T, 1);
          break;
        }
        case F.CEO: {
          const plank = ((ty >> 0) % 3 === 0) ? '#5a3d2b' : ((ty % 3 === 1) ? '#63432f' : '#553927');
          g.fillStyle = plank; g.fillRect(px, py, T, T);
          g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(px, py + T - 1, T, 1);
          if ((tx + ty * 2) % 5 === 0) { g.fillStyle = 'rgba(255,220,170,.07)'; g.fillRect(px, py, T, T); }
          break;
        }
        case F.CARPET_CEO: {
          g.fillStyle = '#7a1f2b'; g.fillRect(px, py, T, T);
          g.fillStyle = 'rgba(232,193,90,.18)';
          if ((tx + ty) % 4 === 0) g.fillRect(px + 6, py + 6, 4, 4);
          g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(px, py + T - 1, T, 1);
          break;
        }
        case F.CAFE: {
          const on = ((tx + ty) & 1);
          g.fillStyle = on ? '#eef1f6' : '#d7dce8'; g.fillRect(px, py, T, T);
          g.fillStyle = 'rgba(120,130,160,.18)'; g.fillRect(px, py + T - 1, T, 1); g.fillRect(px + T - 1, py, 1, T);
          break;
        }
        case F.GAME: {
          g.fillStyle = '#241f3d'; g.fillRect(px, py, T, T);
          g.fillStyle = 'rgba(131,56,236,.35)'; g.fillRect(px, py + T - 1, T, 1); g.fillRect(px + T - 1, py, 1, T);
          if (h % 19 === 0) { g.fillStyle = 'rgba(76,201,240,.4)'; g.fillRect(px + 5, py + 5, 2, 2); }
          break;
        }
        case F.BREAK: {
          const plank = (ty % 2 === 0) ? '#c9a87c' : '#c09e73';
          g.fillStyle = plank; g.fillRect(px, py, T, T);
          g.fillStyle = 'rgba(120,90,60,.25)'; g.fillRect(px, py + T - 1, T, 1);
          if ((tx * 3 + ty) % 7 === 0) { g.fillStyle = 'rgba(90,60,30,.15)'; g.fillRect(px + 2, py + 4, 8, 1); }
          break;
        }
        case F.RUG: {
          const c = room ? U.mix(room.color, '#f2f4fa', 0.62) : '#e6c9c9';
          g.fillStyle = c; g.fillRect(px, py, T, T);
          g.fillStyle = U.rgba(U.shade(c, -0.28), 0.30);
          if ((tx + ty) % 2 === 0) g.fillRect(px + 3, py + 3, 10, 10);
          g.fillStyle = U.rgba('#ffffff', 0.18); g.fillRect(px, py, T, 1);
          break;
        }
        case F.DANCE: {
          const on = ((tx + ty) & 1);
          g.fillStyle = on ? '#3b2a6b' : '#2c2050'; g.fillRect(px, py, T, T);
          g.fillStyle = 'rgba(255,255,255,.06)'; g.fillRect(px + 1, py + 1, 14, 1);
          break;
        }
        case F.RUNNER: {
          const base = ((tx + ty) & 1) ? '#cfd4e2' : '#c7cddc';
          g.fillStyle = base; g.fillRect(px, py, T, T);
          g.fillStyle = '#3c4a72'; g.fillRect(px, py, T, T);
          g.fillStyle = '#46578a'; g.fillRect(px, py, T, 2);
          g.fillStyle = 'rgba(255,255,255,.07)';
          if ((tx + ty) % 3 === 0) g.fillRect(px + 3, py + 6, 10, 3);
          g.fillStyle = 'rgba(0,0,0,.16)'; g.fillRect(px, py + T - 1, T, 1);
          break;
        }
        case F.DOOR: {
          const c = room ? room.color : '#888';
          g.fillStyle = '#c7cddc'; g.fillRect(px, py, T, T);
          g.fillStyle = U.rgba(c, 0.5); g.fillRect(px, py + 4, T, 8);
          g.fillStyle = U.shade(c, -0.35); g.fillRect(px, py, T, 3);
          g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(px, py + T - 2, T, 2);
          break;
        }
        default:
          g.fillStyle = '#20243a'; g.fillRect(px, py, T, T);
      }

      // sombra proyectada por los muros vecinos (profundidad)
      if (code !== F.EXT) {
        if (ty > 0 && w.wall[(ty - 1) * w.W + tx]) {
          g.fillStyle = 'rgba(0,0,0,.20)'; g.fillRect(px, py, T, 3);
          g.fillStyle = 'rgba(0,0,0,.10)'; g.fillRect(px, py + 3, T, 2);
        }
        if (tx > 0 && w.wall[ty * w.W + tx - 1]) {
          g.fillStyle = 'rgba(0,0,0,.14)'; g.fillRect(px, py, 3, T);
        }
        if (tx < w.W - 1 && w.wall[ty * w.W + tx + 1]) {
          g.fillStyle = 'rgba(0,0,0,.10)'; g.fillRect(px + T - 2, py, 2, T);
        }
      }
    }

    _drawWall(g, tx, ty, px, py, room, h) {
      const w = this.world;
      const below = ty + 1 < w.H ? w.wall[(ty + 1) * w.W + tx] : 1;
      const belowSolidExt = ty + 1 < w.H ? (w.roomAt[(ty + 1) * w.W + tx] === -2 && w.wall[(ty + 1) * w.W + tx] === 0) : true;
      const exterior = !room;
      const baseTop = exterior ? '#39405c' : U.mix(room.color, '#8b93ad', 0.72);
      const face = exterior ? '#4b5473' : U.mix(room.color, '#dfe3ee', 0.80);
      const isFace = (below === 0 && !belowSolidExt);

      if (isFace) {
        g.fillStyle = U.shade(baseTop, -0.15); g.fillRect(px, py, T, 5);
        g.fillStyle = face; g.fillRect(px, py + 5, T, 9);
        g.fillStyle = U.shade(face, -0.28); g.fillRect(px, py + 14, T, 2);
        g.fillStyle = U.rgba('#ffffff', 0.12); g.fillRect(px, py + 5, T, 1);
        // zoclo / textura
        if (h % 11 === 0) { g.fillStyle = U.rgba('#000000', 0.06); g.fillRect(px + 3, py + 7, 10, 4); }
      } else {
        g.fillStyle = baseTop; g.fillRect(px, py, T, T);
        g.fillStyle = U.rgba('#000000', 0.10); g.fillRect(px, py + T - 2, T, 2);
        g.fillStyle = U.rgba('#ffffff', 0.05); g.fillRect(px, py, T, 1);
      }

      // ventanas en muro exterior
      if (exterior && isFace && tx % 5 === 2) {
        g.fillStyle = '#10203a'; g.fillRect(px + 3, py + 5, 10, 7);
        g.fillStyle = '#2b6ea8'; g.fillRect(px + 4, py + 6, 8, 5);
        g.fillStyle = '#7fc8f8'; g.fillRect(px + 4, py + 6, 8, 2);
        g.fillStyle = '#0d1830'; g.fillRect(px + 8, py + 6, 1, 5);
      }
    }

    /* ---------- Render principal ---------- */
    render(dt) {
      this.time += dt;
      this.frame++;
      const ctx = this.ctx, cam = this.cam, w = this.world;
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = '#070910';
      ctx.fillRect(0, 0, this.vw, this.vh);

      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.scale(cam.zoom, cam.zoom);
      ctx.translate(-cam.x, -cam.y);

      // rango visible
      const tl = this.screenToWorld(0, 0), br = this.screenToWorld(this.vw, this.vh);
      const vx0 = tl.x, vy0 = tl.y, vx1 = br.x, vy1 = br.y;

      // --- chunks estáticos ---
      const c0x = Math.floor(vx0 / CHUNK_PX), c1x = Math.floor(vx1 / CHUNK_PX);
      const c0y = Math.floor(vy0 / CHUNK_PX), c1y = Math.floor(vy1 / CHUNK_PX);
      for (let cy = c0y; cy <= c1y; cy++) {
        for (let cx = c0x; cx <= c1x; cx++) {
          if (cx < 0 || cy < 0 || cx * CHUNK >= w.W || cy * CHUNK >= w.H) continue;
          const ch = this._getChunk(cx, cy);
          ctx.drawImage(ch, cx * CHUNK_PX, cy * CHUNK_PX);
        }
      }

      // --- objetos + agentes con orden de profundidad ---
      const draw = [];
      const visRooms = [];
      const far = cam.zoom < 0.85;
      for (const room of w.rooms) {
        const rx0 = room.x * T, ry0 = room.y * T, rx1 = (room.x + room.w) * T, ry1 = (room.y + room.h) * T;
        if (rx1 < vx0 - 32 || rx0 > vx1 + 32 || ry1 < vy0 - 32 || ry0 > vy1 + 32) continue;
        visRooms.push(room);
        if (far) { for (const o of room.objects) S.drawObjectFar(ctx, o); continue; }
        for (const o of room.objects) {
          if (o.decal) continue;
          draw.push({ y: (o.ty + o.h) * T, o });
        }
      }
      this.visibleRooms = visRooms;

      // calcomanías de piso (emblemas, marcas) bajo todo lo demás
      if (!far) {
        for (const room of visRooms) {
          for (const o of room.objects) if (o.decal) S.drawObject(ctx, o, room, this.time);
        }
      }

      // efectos de piso animados (pista de baile)
      for (const room of visRooms) {
        if (room.kind === 'game') this._danceFloor(ctx, room);
      }

      const agentsVisible = [];
      for (const a of this.agents.agents) {
        if (a.x < vx0 - 40 || a.x > vx1 + 40 || a.y < vy0 - 60 || a.y > vy1 + 40) continue;
        agentsVisible.push(a);
        draw.push({ y: a.y + 0.5, a });
      }
      this.visibleAgents = agentsVisible;

      draw.sort((p, q) => p.y - q.y);
      for (const d of draw) {
        if (d.o) S.drawObject(ctx, d.o, w.rooms[d.o.roomIndex], this.time);
        else S.drawAgent(ctx, d.a, this.time);
      }

      // emotes encima
      for (const a of agentsVisible) S.drawEmote(ctx, a, this.time);

      // partículas
      for (const p of this.particles) {
        ctx.globalAlpha = U.clamp(p.life, 0, 1);
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
      }
      ctx.globalAlpha = 1;

      // resaltado de selección
      const sel = this.agents.selected;
      if (sel) this._selectionRing(ctx, sel);
      if (this.hover && this.hover !== sel) this._selectionRing(ctx, this.hover, true);

      ctx.restore();

      // --- capa de pantalla (texto nítido) ---
      this._screenLayer(ctx, visRooms, agentsVisible);
    }

    _danceFloor(ctx, room) {
      const t = this.time;
      const x0 = (room.ix + 1) * T, y0 = (room.iy + 5) * T;
      const cols = ['#ff477e', '#4cc9f0', '#ffd166', '#7ee2a8', '#c77dff'];
      for (let y = 0; y < 4; y++) {
        for (let x = 0; x < 5; x++) {
          const ph = Math.sin(t * 3.4 + x * 0.9 + y * 0.7);
          if (ph < -0.1) continue;
          ctx.globalAlpha = 0.18 + Math.max(0, ph) * 0.55;
          ctx.fillStyle = cols[(x + y + Math.floor(t)) % cols.length];
          ctx.fillRect(x0 + x * T, y0 + y * T, T, T);
        }
      }
      ctx.globalAlpha = 1;
    }

    _selectionRing(ctx, a, soft) {
      ctx.save();
      ctx.globalAlpha = soft ? 0.35 : 0.85;
      ctx.strokeStyle = a.color || '#ffd166';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(a.x, a.y + 1, 8, 3.5, 0, 0, Math.PI * 2);
      ctx.stroke();
      if (!soft) {
        const bob = Math.sin(this.time * 4) * 1.5;
        ctx.fillStyle = a.color || '#ffd166';
        const ty = a.y - (a.isBoss ? 34 : 30) + bob;
        ctx.beginPath();
        ctx.moveTo(a.x - 3, ty); ctx.lineTo(a.x + 3, ty); ctx.lineTo(a.x, ty + 4);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    /* ---------- Capa de pantalla: etiquetas, burbujas, barras ---------- */
    _screenLayer(ctx, rooms, agents) {
      const zoom = this.cam.zoom;

      // letreros de sala
      if (zoom > 0.5) {
        const small = zoom < 1;
        const fs = small ? 8 : 10, bh = small ? 13 : 16;
        for (const room of rooms) {
          const p = this.worldToScreen((room.x + room.w / 2) * T, (room.y + 0.2) * T);
          const label = room.name.toUpperCase();
          ctx.font = `bold ${fs}px ui-monospace, "Courier New", monospace`;
          const tw = ctx.measureText(label).width;
          const pad = 6;
          const bw = tw + pad * 2;
          const bx = Math.round(p.x - bw / 2), by = Math.round(p.y - bh - 4);
          ctx.fillStyle = 'rgba(10,12,22,0.82)';
          ctx.fillRect(bx, by, bw, bh);
          ctx.fillStyle = room.color;
          ctx.fillRect(bx, by, bw, 2);
          ctx.fillStyle = '#e8ecf7';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(label, bx + bw / 2, by + bh / 2 + 1);
          if (zoom > 1.4 && room.sub) {
            ctx.font = '9px ui-monospace, monospace';
            ctx.fillStyle = 'rgba(200,210,230,.65)';
            ctx.fillText(room.sub, bx + bw / 2, by + bh + 8);
          }
        }
      }

      // agentes: nombre, estado, progreso, burbuja
      const crowded = agents.length > 26;
      let bubbleBudget = 14;
      const sel = this.agents.selected;
      for (const a of agents) {
        const head = this.worldToScreen(a.x, a.y - (a.isBoss ? 26 : 23));
        const selected = sel === a;
        const important = selected || a === this.hover || a.isBoss || !!a.task;
        if (this.showNames && (zoom > 1.15 || selected) && (!crowded || important || zoom > 2.2)) {
          const nm = a.name;
          ctx.font = 'bold 9px ui-monospace, "Courier New", monospace';
          const tw = ctx.measureText(nm).width;
          const bw = tw + 10, bh = 13;
          const bx = Math.round(head.x - bw / 2), by = Math.round(head.y - bh - 2);
          ctx.fillStyle = selected ? 'rgba(20,24,40,0.95)' : 'rgba(12,15,26,0.78)';
          ctx.fillRect(bx, by, bw, bh);
          ctx.fillStyle = a.color;
          ctx.fillRect(bx, by + bh - 2, bw, 2);
          ctx.fillStyle = '#f0f3fa';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(nm, bx + bw / 2, by + bh / 2);
        }
        // barra de progreso de tarea
        if (a.task && (a.state === 'work' || a.state === 'error')) {
          const bw = 30, bh = 4;
          const bx = Math.round(head.x - bw / 2), by = Math.round(head.y - 20);
          ctx.fillStyle = 'rgba(8,10,18,.85)'; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
          ctx.fillStyle = '#2a3047'; ctx.fillRect(bx, by, bw, bh);
          ctx.fillStyle = a.state === 'error' ? '#ff5a5f' : '#7ee2a8';
          ctx.fillRect(bx, by, Math.round(bw * U.clamp(a.task.progress, 0, 1)), bh);
        }
        // burbuja de diálogo
        if (a.bubble && zoom > 0.9 && (bubbleBudget > 0 || selected)) {
          if (!selected) bubbleBudget--;
          this._bubble(ctx, head.x, head.y - (a.task && a.state === 'work' ? 34 : 18), a.bubble, a.color);
        }
      }
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }

    _bubble(ctx, x, y, bubble, color) {
      const text = bubble.text;
      ctx.font = '10px ui-monospace, "Courier New", monospace';
      const maxW = 150;
      const words = text.split(' ');
      const lines = []; let line = '';
      for (const wd of words) {
        const test = line ? line + ' ' + wd : wd;
        if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = wd; }
        else line = test;
      }
      if (line) lines.push(line);
      const lh = 12, pad = 6;
      const bw = Math.min(maxW + pad * 2, Math.max(...lines.map(l => ctx.measureText(l).width)) + pad * 2);
      const bh = lines.length * lh + pad * 2 - 4;
      const bx = Math.round(x - bw / 2), by = Math.round(y - bh);
      const alpha = U.clamp(bubble.t / 0.6, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(248,250,255,0.96)';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = color || '#4cc9f0';
      ctx.fillRect(bx, by, bw, 2);
      ctx.fillStyle = 'rgba(248,250,255,0.96)';
      ctx.beginPath();
      ctx.moveTo(x - 4, by + bh); ctx.lineTo(x + 4, by + bh); ctx.lineTo(x, by + bh + 5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#1b2033';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      lines.forEach((l, i) => ctx.fillText(l, bx + bw / 2, by + pad - 1 + i * lh));
      ctx.restore();
    }

    /* ---------- Minimapa ---------- */
    drawMinimap(cv) {
      const g = cv.getContext('2d');
      const w = this.world;
      const sw = cv.width, sh = cv.height;
      const scale = Math.min(sw / w.pxW, sh / w.pxH);
      const ox = (sw - w.pxW * scale) / 2, oy = (sh - w.pxH * scale) / 2;
      g.fillStyle = '#0a0d18'; g.fillRect(0, 0, sw, sh);
      g.save(); g.translate(ox, oy); g.scale(scale, scale);
      // pasillos
      g.fillStyle = '#232a42';
      g.fillRect(0, 0, w.pxW, w.pxH);
      for (const room of w.rooms) {
        g.fillStyle = U.rgba(room.color, room.kind === 'office' ? 0.55 : 0.8);
        g.fillRect(room.x * T, room.y * T, room.w * T, room.h * T);
        g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 2;
        g.strokeRect(room.x * T, room.y * T, room.w * T, room.h * T);
      }
      for (const a of this.agents.agents) {
        g.fillStyle = a.isBoss ? '#ffd166' : (a.task ? '#7ee2a8' : '#ffffff');
        const s = a.isBoss ? 22 : 14;
        g.fillRect(a.x - s / 2, a.y - s / 2, s, s);
      }
      // viewport
      const tl = this.screenToWorld(0, 0), br = this.screenToWorld(this.vw, this.vh);
      g.strokeStyle = '#ffd166'; g.lineWidth = 3 / scale;
      g.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
      g.restore();
      this._mm = { scale, ox, oy };
    }

    minimapToWorld(mx, my) {
      if (!this._mm) return null;
      return { x: (mx - this._mm.ox) / this._mm.scale, y: (my - this._mm.oy) / this._mm.scale };
    }
  }

  NAW.Renderer = Renderer;
})(window);
